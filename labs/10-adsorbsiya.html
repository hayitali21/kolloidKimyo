/* ============ KIMYOVIY MODEL (2-JADVAL VA FREYNDLIX TENGLAMASI) ============ */
const M_CHAR = 3.00; // g hayvonot suyagi ko'miri
const V_ADS = 100;   // ml (har bir kolbada qoladigan hajm)
const A_TRUE = +rnd(2.48, 2.74).toFixed(3);      // mmol/g (C1 = 1 mol/L da)
const INV_N_TRUE = +rnd(0.41, 0.45).toFixed(3);  // 1/n (n ≈ 2.22..2.44)

function solveC1(c0) {
  // 100*(c0 - c1) = M_CHAR * A_TRUE * c1^(INV_N_TRUE)
  let lo = 1e-6, hi = c0;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) * 0.5;
    const lhs = V_ADS * (c0 - mid);
    const rhs = M_CHAR * A_TRUE * Math.pow(mid, INV_N_TRUE);
    if (lhs > rhs) lo = mid; else hi = mid;
  }
  return (lo + hi) * 0.5;
}

const FLASKS = [

  { id: 5, vTot: 110, cNom: 0.200, vAl: 10 },
  { id: 6, vTot: 105, cNom: 0.400, vAl: 5  }
].map(f => {
  const vAcid = +((f.vTot * f.cNom) / 2.0).toFixed(2);
  const vWater = +(f.vTot - vAcid).toFixed(2);
  const cTrue = +(f.cNom * (1 + (Math.random() * 2 - 1) * 0.014)).toFixed(5);
  const c1Raw = solveC1(cTrue);
  const c1True = +(clamp(c1Raw * (1 + (Math.random() * 2 - 1) * 0.012), 0.001, cTrue * 0.96)).toFixed(5);
  const vEq0 = +((cTrue * f.vAl) / 0.1).toFixed(2);
  const vEq1 = +((c1True * f.vAl) / 0.1).toFixed(2);
  return { ...f, vAcid, vWater, cTrue, c1True, vEq0, vEq1 };

/* ============ STATISTIKA VA HISOB-KITOB ============ */
function s1PreparedCount() {
  let c = 0;
  for (let i = 0; i < 6; i++) if (S.s1.acid[i] && S.s1.water[i]) c++;
  return c;
}
function s2Count() { return Object.keys(S.s2.recC).length; }
function s3C1Count() { return Object.keys(S.s3.recC1).length; }

function computeTable() {
  return FLASKS.map(f => {
    const r0 = S.s2.recC[f.id];
    const r1 = S.s3.recC1[f.id];
    if (!r0 || !r1) return { f, r0, r1, ok: false };
    const C = r0.C, C1 = r1.C1;
    const dC = Math.max(1e-5, C - C1);
    const x = dC * V_ADS; // mmol in 100 ml
    const xm = x / M_CHAR; // mmol/g
    return {
      f, r0, r1, ok: true,
      C, C1, dC, x, xm,
      lgC1: Math.log10(C1),
      lgXM: Math.log10(xm)
    };
  });
}

function fitFreundlich() {
  const rows = computeTable().filter(r => r.ok);
  if (rows.length < 2) return null;
  const n = rows.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
  rows.forEach(r => {
    sx += r.lgC1; sy += r.lgXM;
    sxx += r.lgC1 * r.lgC1;
    sxy += r.lgC1 * r.lgXM;
    syy += r.lgXM * r.lgXM;
  });
  const denom = n * sxx - sx * sx;
  if (Math.abs(denom) < 1e-12) return null;
  const invN = (n * sxy - sx * sy) / denom;
  const lgA = (sy - invN * sx) / n;
  const a = Math.pow(10, lgA);
  const nVal = 1 / invN;
  const numR = n * sxy - sx * sy;
  const denR = Math.sqrt(Math.max(1e-12, (n * sxx - sx * sx) * (n * syy - sy * sy)));
  const r2 = Math.pow(numR / denR, 2);
  return { invN, nVal, lgA, a, r2, rows };
}

function pen(w, msg, once) {
  if (once && S.events.some(e => e.once === once)) return;
  S.pen[S.stage] = (S.pen[S.stage] || 0) + w;
  S.events.push({ st: S.stage, msg, once });
  LabUI.toast("⚠️ " + msg, "warn", 3800);
  SFX.play("warn");
}
function okT(msg) { LabUI.toast("✓ " + msg, "ok", 2600); SFX.play("ok"); }

function s1Done() { return s1PreparedCount() === 6 && QS[1].every(q => S.q[q.id] === q.a); }
function s2Done() { return s2Count() === 6 && QS[2].every(q => S.q[q.id] === q.a); }
function s3Done() { return S.s3.filtered && s3C1Count() === 6 && QS[3].every(q => S.q[q.id] === q.a); }
function s4Done() { return S.s4.checkedInvN && S.s4.checkedA && QS[4].every(q => S.q[q.id] === q.a); }

function total() {
  // Stage 1: max 16 (6 flasks × 2 = 12, 2 Qs × 2 = 4)
  let p1 = s1PreparedCount() * 2 + QS[1].filter(q => S.q[q.id] === q.a).length * 2;
  p1 = clamp(Math.round(p1 - (S.pen[1] || 0)), 0, 16);

  // Stage 2: max 22 (6 titrations × 3 = 18, 2 Qs × 2 = 4)
  let p2 = s2Count() * 3 + QS[2].filter(q => S.q[q.id] === q.a).length * 2;
  p2 = clamp(Math.round(p2 - (S.pen[2] || 0)), 0, 22);

  // Stage 3: max 24 (weigh+char 3, shake 2, filter 3, 6 C1 × 2 = 12, 2 Qs × 2 = 4)
  let p3 = (S.s3.weighed ? 1.5 : 0) + (S.s3.charAdded ? 1.5 : 0) + (S.s3.shaken ? 2 : 0) + (S.s3.filtered ? 3 : 0)
    + s3C1Count() * 2 + QS[3].filter(q => S.q[q.id] === q.a).length * 2;
  p3 = clamp(Math.round(p3 - (S.pen[3] || 0)), 0, 24);

  // Stage 4: max 18 (check invN 6, check a 6, 2 Qs × 3 = 6)
  let p4 = (S.s4.checkedInvN ? 6 : 0) + (S.s4.checkedA ? 6 : 0) + QS[4].filter(q => S.q[q.id] === q.a).length * 3;
  p4 = clamp(Math.round(p4 - (S.pen[4] || 0)), 0, 18);

  // Quiz: max 20 (5 × 4)
  const pq = QUIZ.filter(q => S.quiz[q.id] === q.a).length * 4;
  return { p1, p2, p3, p4, pq, tot: clamp(p1 + p2 + p3 + p4 + pq, 0, 100) };
}

function renderTabs() {
  const names = [
    [1, "1. Eritmalar", s1Done()],

    [3, "3. Adsorbsiya", s3Done()],
    [4, "4. Freyndlix", s4Done()],
    [5, "5. Hisobot", s1Done() && s2Done() && s3Done() && s4Done() && QUIZ.every(q => S.quiz[q.id] !== undefined)]
  ];
  el("tabs").innerHTML = names.map(([i, t, d]) =>
    `<button class="${S.stage === i ? "cur" : ""} ${d ? "done" : ""}" onclick="goStage(${i})">${d ? "✓ " : ""}${t}</button>`
  ).join("");
  const sc = total();
  el("chip").textContent = `${sc.tot} / 100 ball`;
  const isDone = s1Done() && s2Done() && s3Done() && s4Done();
  LabProgress.save(LAB_ID, sc.tot, isDone);
}

    LabUI.toast("Avval 3-bosqichda adsorbsiya, filtrlash va C₁ titrlashni yakunlang!", "warn");
    SFX.play("warn");
    return;

  S.stage = n;
  SFX.play("click");
  renderAll();

/* ============ TITRLASH UMUMIY LOGIKASI (STAGE 2 VA STAGE 3C) ============ */
function activeTit() {

    ? { st: S.s2, isPost: false, rec: S.s2.recC, eqOf: f => f.vEq0 }

window.titDrop = function (dv) {
  const { st, eqOf } = activeTit();
  const f = FLASKS[st.sel];
  if (!st.aliquotIn) { LabUI.toast("Avval kolbadan alikvota oling!", "warn"); SFX.play("warn"); return; }
  if (!st.phenIn) { pen(1, "Fenolftalein indikatori qoʻshilmagan — ekvivalent nuqtani koʻra olmaysiz!", "nophen_" + S.stage); return; }
  if (st.vol + dv > 50) return;
  const prev = st.vol;
  st.vol = +(st.vol + dv).toFixed(2);
  st.swirl = 1.0;
  const vEq = eqOf(f);
  const cnt = dv >= 1 ? 3 : 1;
  for (let k = 0; k < cnt; k++) st.drops.push({ y: 274 - k * 14, v: 265 + k * 20 });
  SFX.play(dv >= 1 ? "pour" : "drip");
  // Fleeting pink swirl near endpoint (85%..99.5%)
  if (st.vol >= vEq * 0.80 && st.vol < vEq - 0.04) {
    st.flash = clamp((st.vol / vEq - 0.78) / 0.22, 0.25, 0.9);
  }
  if (prev < vEq - 0.08 && st.vol >= vEq - 0.08 && st.vol <= vEq + 0.30) {
    SFX.play("bell");
    LabUI.toast(`🌸 <b>Ekvivalent nuqta!</b> Och pushti rang barqaror saqlandi (V = ${f1(st.vol, 2)} ml). Natijani qayd eting!`, "ok", 3400);
  } else if (st.vol > vEq + 0.45) {
    LabUI.toast("⚠️ <b>Ortiqcha titrlandi (toʻq malina rang)!</b> Aniq natija uchun «Qayta titrlash» ni bosing.", "err", 3400);
    SFX.play("err");
  }
  renderAll();
};
window.titReset = function () {
  const { st } = activeTit();
  st.vol = 0;
  st.flash = 0;
  SFX.play("splash");
  renderAll();
};
window.titRecord = function () {
  const { st, isPost, rec, eqOf } = activeTit();
  const f = FLASKS[st.sel];
  const vEq = eqOf(f);
  if (!st.aliquotIn || !st.phenIn || st.vol <= 0) return;
  if (st.vol < vEq - 0.25) {
    LabUI.toast("Hali ekvivalent nuqtaga yetilmadi (eritma rangsiz). Tomchilashda davom eting.", "warn");
    SFX.play("warn");
    return;
  }
  if (st.vol > vEq + 0.45) {
    pen(1, "Ortiqcha titrlangan (toʻq malina) natija katta xatolik beradi — qayta titrlang!", "overtit_" + S.stage + "_" + f.id);
    return;
  }
  const calcC = +((0.1 * st.vol) / f.vAl).toFixed(5);
  if (isPost) {
    const c0 = S.s2.recC[f.id]?.C || f.cTrue;
    if (calcC >= c0) {
      LabUI.toast("C₁ dastlabki C dan kichik boʻlishi kerak! Qayta titrlang.", "err");
      return;
    }
    rec[f.id] = { vNaOH: st.vol, C1: calcC };
    okT(`Kolba №${f.id} filtrati qayd etildi: V = ${f1(st.vol, 2)} ml ⇒ C₁ = ${f1(calcC, 4)} n`);
  } else {
    rec[f.id] = { vNaOH: st.vol, C: calcC };
    okT(`Kolba №${f.id} dastlabki konsentratsiyasi: V = ${f1(st.vol, 2)} ml ⇒ C = ${f1(calcC, 4)} n`);
  }
  st.manualDone++;
  const next = FLASKS.findIndex(x => !rec[x.id]);
  if (next >= 0) {
    st.sel = next;
    st.aliquotIn = false;
    st.phenIn = false;
    st.vol = 0;
    st.flash = 0;
  }
  renderAll();
};
window.titQuickRest = function () {
  const { st, isPost, rec, eqOf } = activeTit();
  if (st.manualDone < 2) {
    LabUI.toast("Avval kamida 2 ta kolbani oʻzingiz qoʻlda titrlab koʻring!", "warn");
    return;
  }
  FLASKS.forEach(f => {
    if (!rec[f.id]) {
      const v = +(eqOf(f) + (Math.random() * 2 - 1) * 0.05).toFixed(2);
      const calcC = +((0.1 * v) / f.vAl).toFixed(5);
      if (isPost) rec[f.id] = { vNaOH: v, C1: calcC };
      else rec[f.id] = { vNaOH: v, C: calcC };
    }
  });
  SFX.play("bell");
  okT(isPost ? "Qolgan filtratlar titrlandi va C₁ qiymatlari 3-jadvalga yozildi!" : "Qolgan kolbalar titrlandi va barcha C qiymatlari aniqlandi!");
  renderAll();
};

window.checkFreundlich = function () {
  const fit = fitFreundlich();
  if (!fit) return;
  const vInvN = parseFloat((el("inpInvN").value || "").replace(",", "."));
  const vA = parseFloat((el("inpA").value || "").replace(",", "."));
  S.s4.inInvN = el("inpInvN").value;
  S.s4.inA = el("inpA").value;

  if (isNaN(vInvN) || isNaN(vA)) {
    LabUI.toast("Iltimos, qiyalik (1/n) va doimiy (a) uchun son qiymat kiriting.", "warn");
    return;
  }
  const okInvN = Math.abs(vInvN - fit.invN) / fit.invN <= 0.10;
  const okA = Math.abs(vA - fit.a) / fit.a <= 0.12;
  if (okInvN) S.s4.checkedInvN = true;
  if (okA) S.s4.checkedA = true;
  if (okInvN && okA) {
    SFX.play("fanfare");
    okT(`Ajoyib! 1/n = ${f1(fit.invN, 3)} (n = ${f1(fit.nVal, 2)}) va a = ${f1(fit.a, 2)} mmol/g toʻgʻri topildi!`);
  } else {
    const hints = [];
    if (!okInvN) hints.push(`1/n ≈ ${f1(fit.invN, 2)} atrofida (grafik qiyaligi Δlg(x/m)/ΔlgC₁)`);
    if (!okA) hints.push(`a = 10^(lg a) ≈ ${f1(fit.a, 2)} atrofida`);
    LabUI.toast("Aniqlashtiring: " + hints.join("; "), "warn", 4400);
    SFX.play("warn");
  }
  renderAll();
};

function renderQBlock(st) {
  return `<div class="box"><h4>Nazorat savollari</h4>` + QS[st].map((q, qi) => {
    const order = shuf(q.o.length, st * 41 + qi * 19 + 10);
    const chosen = S.q[q.id];
    const solved = chosen === q.a;
    return `<div class="q"><p>${qi + 1}. ${q.q}</p>` + order.map(orig => {
      let cls = "";
      if (chosen === orig) cls = orig === q.a ? "right" : "wrong";
      else if (solved && orig === q.a) cls = "right";
      return `<button class="${cls}" ${solved ? "disabled" : ""} onclick="ansQ(${st},'${q.id}',${orig})">${q.o[orig]}</button>`;
    }).join("") + `</div>`;
  }).join("") + `</div>`;
}

function drawMiniFlask(cx, by, scale, fillFrac, col, op, label, sub, highlight, done, charcoal) {
  const w = 44 * scale, h = 92 * scale;
  const liqH = fillFrac * (h * 0.62);
  const cid = `fc_${Math.round(cx)}_${Math.round(by)}`;
  let s = `<defs><clipPath id="${cid}"><path d="M${cx - w*0.26} ${by - h} L${cx - w*0.26} ${by - h*0.64} L${cx - w} ${by - 6} Q${cx - w*1.04} ${by} ${cx - w*0.86} ${by} L${cx + w*0.86} ${by} Q${cx + w*1.04} ${by} ${cx + w} ${by - 6} L${cx + w*0.26} ${by - h*0.64} L${cx + w*0.26} ${by - h} Z"/></clipPath></defs>`;
  s += `<g clip-path="url(#${cid})">`;
  if (fillFrac > 0) {
    s += `<rect x="${cx - w*1.1}" y="${by - liqH}" width="${w*2.2}" height="${liqH + 4}" fill="${col}" fill-opacity="${op}"/>`;
    if (charcoal) {
      for (let k = 0; k < 18; k++) {
        const px = cx - w*0.7 + ((k * 17) % Math.round(w*1.4));
        const py = by - 5 - ((k * 11) % Math.max(8, Math.round(liqH - 8)));
        s += `<circle cx="${px}" cy="${py}" r="2.1" fill="#181c1d" fill-opacity=".85"/>`;
      }
      s += `<rect x="${cx - w}" y="${by - 12}" width="${w*2}" height="12" fill="#141819" fill-opacity=".9"/>`;
    }
  }
  s += `</g>`;
  s += `<path d="M${cx - w*0.26} ${by - h} L${cx - w*0.26} ${by - h*0.64} L${cx - w} ${by - 6} Q${cx - w*1.04} ${by} ${cx - w*0.86} ${by} L${cx + w*0.86} ${by} Q${cx + w*1.04} ${by} ${cx + w} ${by - 6} L${cx + w*0.26} ${by - h*0.64} L${cx + w*0.26} ${by - h}" fill="url(#glassShine)" stroke="${highlight ? "#e89b3c" : done ? "#1f9d6b" : "#244347"}" stroke-width="${highlight ? 3.2 : 2}"/>`;
  s += `<ellipse cx="${cx}" cy="${by - h}" rx="${w*0.26}" ry="${3*scale}" fill="#eef6f5" stroke="#244347" stroke-width="1.6"/>`;

  return s;
}

function drawTitrationScene(isPost) {
  const { st, rec, eqOf } = activeTit();
  const f = FLASKS[st.sel];
  const vEq = eqOf(f);
  const burY = 104 + (st.vol / 50) * 145;

  // Color of solution in titration flask
  let liqCol = "#dff2fa", liqOp = 0.62, stateTxt = "Rangsiz (kislotali)";
  if (!st.aliquotIn) {
    stateTxt = "Alikvota olinmagan";
  } else if (!st.phenIn) {
    stateTxt = "Fenolftalein qoʻshilmagan";
  } else if (st.vol >= vEq + 0.45) {
    liqCol = "#d92682"; liqOp = 0.78; stateTxt = "Toʻq malina (ortiqcha!)";
  } else if (st.vol >= vEq - 0.10) {
    liqCol = "#f6b8d4"; liqOp = 0.78; stateTxt = "Och pushti — EKVIVALENT NUQTA!";
  } else if (st.flash > 0.05) {
    liqCol = "#f8cbe0"; liqOp = 0.58 + st.flash * 0.2; stateTxt = "Vaqtincha pushti chaqnash...";
  }

function drawStage4() {
  const fit = fitFreundlich();
  let s = benchDefs() + benchBG("4-bosqich · Adsorbsiya izotermasi va Freyndlix tenglamasi", "Chapda: x/m = f(C₁) izotermasi · Oʻngda: lg(x/m) = lg a + (1/n)·lg C₁ chiziqli bogʻliqligi");

  if (!fit) return s;

  // LEFT CHART: Freundlich Isotherm x/m vs C1 (x: 34..486, y: 92..460)
  const xMax = Math.max(0.40, Math.ceil(Math.max(...fit.rows.map(r => r.C1)) * 10) / 10);
  const yMax = Math.max(2.0, Math.ceil(Math.max(...fit.rows.map(r => r.xm)) * 2) / 2);
  const lx0 = 92, lw = 374, ly0 = 132, lh = 282;
  const LX = v => lx0 + (v / xMax) * lw;
  const LY = v => ly0 + lh - (v / yMax) * lh;

  s += `<g>
    <rect x="30" y="90" width="458" height="370" rx="16" fill="#fff" fill-opacity=".96" stroke="#c3d6d3" stroke-width="2"/>
    <text x="50" y="116" font-size="13.5" font-weight="800" fill="#132629">1) Adsorbsiya izotermasi: x/m = f(C₁)</text>
    <rect x="${lx0}" y="${ly0}" width="${lw}" height="${lh}" fill="#f8fbfa" stroke="#d4e1df"/>`;
  for (let i = 0; i <= 4; i++) {
    const xv = (xMax * i) / 4;
    s += `<line x1="${LX(xv)}" y1="${ly0}" x2="${LX(xv)}" y2="${ly0 + lh}" stroke="#e6efed"/>
      <text x="${LX(xv)}" y="${ly0 + lh + 16}" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" fill="#587276">${f1(xv, 2)}</text>`;
    const yv = (yMax * i) / 4;
    s += `<line x1="${lx0}" y1="${LY(yv)}" x2="${lx0 + lw}" y2="${LY(yv)}" stroke="#e6efed"/>
      <text x="${lx0 - 8}" y="${LY(yv) + 3}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="#587276">${f1(yv, 2)}</text>`;
  }
  // Smooth fitted Freundlich curve x/m = a * C1^(1/n)
  let pathD = "";
  for (let k = 0; k <= 60; k++) {
    const cx = (k / 60) * xMax;
    const cy = cx === 0 ? 0 : fit.a * Math.pow(cx, fit.invN);
    if (cy <= yMax * 1.02) {
      pathD += (pathD ? " L" : "M") + LX(cx).toFixed(1) + " " + LY(Math.min(yMax, cy)).toFixed(1);
    }
  }
  s += `<path d="${pathD}" fill="none" stroke="#1b484f" stroke-width="2.6"/>`;
  fit.rows.forEach(r => {
    s += `<circle cx="${LX(r.C1)}" cy="${LY(r.xm)}" r="5" fill="#e89b3c" stroke="#132629" stroke-width="1.4"/>
      <text x="${LX(r.C1) + 7}" y="${LY(r.xm) - 6}" font-size="9.5" font-weight="700" fill="#132629">№${r.f.id}</text>`;
  });
  s += `<text x="${lx0 + lw}" y="${ly0 + lh + 34}" text-anchor="end" font-size="11" font-weight="700" fill="#132629">Muvozanat konsentratsiyasi C₁, mol/L</text>
    <text x="${lx0 + 6}" y="${ly0 + 14}" font-size="10.5" font-weight="700" fill="#132629">x/m, mmol/g</text>
  </g>`;

  // RIGHT CHART: Linearized Freundlich lg(x/m) vs lg(C1) (showing y-intercept at lg C1 = 0!)
  const rx0 = 568, rw = 374, ry0 = 132, rh = 282;
  const minX = -2.6, maxX = 0.2;
  const minY = -0.8, maxY = 0.7;
  const RX = v => rx0 + ((v - minX) / (maxX - minX)) * rw;
  const RY = v => ry0 + rh - ((v - minY) / (maxY - minY)) * rh;

  s += `<g>
    <rect x="510" y="90" width="460" height="370" rx="16" fill="#fff" fill-opacity=".96" stroke="#c3d6d3" stroke-width="2"/>
    <text x="530" y="116" font-size="13.5" font-weight="800" fill="#132629">2) Logarifmik chiziq: lg(x/m) = lg a + (1/n)·lg C₁</text>
    <rect x="${rx0}" y="${ry0}" width="${rw}" height="${rh}" fill="#f8fbfa" stroke="#d4e1df"/>`;
  [-2.5, -2.0, -1.5, -1.0, -0.5, 0].forEach(xv => {
    s += `<line x1="${RX(xv)}" y1="${ry0}" x2="${RX(xv)}" y2="${ry0 + rh}" stroke="${xv === 0 ? "#0f2e33" : "#e6efed"}" stroke-width="${xv === 0 ? 1.8 : 1}"/>
      <text x="${RX(xv)}" y="${ry0 + rh + 16}" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" font-weight="${xv === 0 ? 800 : 500}" fill="#587276">${f1(xv, 1)}</text>`;
  });
  [-0.6, -0.3, 0, 0.3, 0.6].forEach(yv => {
    s += `<line x1="${rx0}" y1="${RY(yv)}" x2="${rx0 + rw}" y2="${RY(yv)}" stroke="${yv === 0 ? "#9bb3b0" : "#e6efed"}" stroke-width="${yv === 0 ? 1.2 : 1}"/>
      <text x="${rx0 - 6}" y="${RY(yv) + 3}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="#587276">${f1(yv, 1)}</text>`;
  });
  // Best-fit line from x=-2.5 to x=0
  const yAtMin = fit.lgA + fit.invN * (-2.45);
  const yAt0 = fit.lgA;
  s += `<line x1="${RX(-2.45)}" y1="${RY(yAtMin)}" x2="${RX(0)}" y2="${RY(yAt0)}" stroke="#d64545" stroke-width="2.4" stroke-dasharray="6 3"/>`;
  // Slope triangle between x=-2.0 and x=-1.0
  const tx1 = -2.0, tx2 = -1.0;
  const ty1 = fit.lgA + fit.invN * tx1, ty2 = fit.lgA + fit.invN * tx2;
  s += `<path d="M${RX(tx1)} ${RY(ty1)} L${RX(tx2)} ${RY(ty1)} L${RX(tx2)} ${RY(ty2)}" fill="none" stroke="#1f9d6b" stroke-width="1.8"/>
    <text x="${(RX(tx1) + RX(tx2)) / 2}" y="${RY(ty1) + 13}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f9d6b">ΔlgC₁ = 1,0</text>
    <text x="${RX(tx2) + 5}" y="${(RY(ty1) + RY(ty2)) / 2 + 3}" font-size="9.5" font-weight="700" fill="#1f9d6b">Δlg(x/m) ≈ ${f1(fit.invN, 2)}</text>`;
  // Y-intercept dot at lg C1 = 0
  s += `<circle cx="${RX(0)}" cy="${RY(yAt0)}" r="5.5" fill="#d64545" stroke="#fff" stroke-width="1.5"/>
    <text x="${RX(0) - 8}" y="${RY(yAt0) - 8}" text-anchor="end" font-size="10.5" font-weight="800" fill="#b82424">lg a = ${f1(yAt0, 3)}</text>`;
  // Experimental points
  fit.rows.forEach(r => {
    s += `<circle cx="${RX(r.lgC1)}" cy="${RY(r.lgXM)}" r="4.8" fill="#e89b3c" stroke="#132629" stroke-width="1.3"/>`;
  });
  s += `<text x="${rx0 + rw}" y="${ry0 + rh + 34}" text-anchor="end" font-size="11" font-weight="700" fill="#132629">lg C₁</text>
    <text x="${rx0 + 6}" y="${ry0 + 14}" font-size="10.5" font-weight="700" fill="#132629">lg(x/m) · R² = ${f1(fit.r2, 4)}</text>
  </g>`;
  return s;
}

function renderScene() {

        <h4>3-jadval · Yakuniy natijalar</h4>
        <table class="j">
          <tr><th>№</th><th>C</th><th>C₁</th><th>x/m</th><th>lgC₁</th><th>lg(x/m)</th></tr>
          ${rows.map(r => r.ok ? `<tr><td>${r.f.id}</td><td>${f1(r.C, 3)}</td><td>${f1(r.C1, 3)}</td><td>${f1(r.xm, 2)}</td><td>${f1(r.lgC1, 2)}</td><td>${f1(r.lgXM, 2)}</td></tr>` : "").join("")}
        </table>
      </div>
      ${chartsHTML}
      <div class="row noprint" style="margin-top:8px">
        <button class="pri" style="flex:1" onclick="window.print()">🖨️ Hisobotni chop etish</button>
        <button class="ghost" onclick="location.reload()">↺ Qaytadan boshlash</button>
      </div>
    </div>`;
  }
}

function renderAll() {
  renderTabs();
  renderScene();
  renderPanel();
}

/* ============ ANIMATSIYA SIKLI (requestAnimationFrame) ============ */
let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  // Stage 1 pour animation
  if (S.stage === 1 && S.s1.pourAnim > 0) {
    S.s1.pourAnim = Math.max(0, S.s1.pourAnim - dt * 2.2);
    renderScene();
  }

  // Titration drops + fleeting pink fade (Stage 2 or Stage 3C)
  if (S.stage === 2 || (S.stage === 3 && S.s3.sub === "C")) {
    const st = S.stage === 2 ? S.s2 : S.s3;
    if (st.drops.length) {
      st.drops = st.drops.filter(d => { d.y += d.v * dt; return d.y < 455; });
      const dg = el("titDrops");
      if (dg) {
        dg.innerHTML = st.drops.map(d =>
          `<path d="M500 ${d.y} Q504 ${d.y + 6} 500 ${d.y + 10} Q496 ${d.y + 6} 500 ${d.y} Z" fill="#69bbe6"/>`
        ).join("");
      }
    }
    if (st.swirl > 0) {
      st.swirl = Math.max(0, st.swirl - dt * 2.5);
      const fg = el("titFlaskG");
      if (fg) fg.setAttribute("transform", `rotate(${(Math.sin(st.swirl * 22) * 1.7 * st.swirl).toFixed(2)} 500 480)`);
    }
    if (st.flash > 0) {
      st.flash = Math.max(0, st.flash - dt * 1.4);
      if (st.flash === 0) renderScene();
    }
  }

  // Stage 3A weighing animation
  if (S.stage === 3 && S.s3.sub === "A" && S.s3.weighing) {
    S.s3.weighDisp = Math.min(M_CHAR, S.s3.weighDisp + dt * 2.1);
    renderScene();
    if (S.s3.weighDisp >= M_CHAR) {
      S.s3.weighing = false;
      S.s3.weighed = true;
      SFX.play("bell");
      okT("3,00 g hayvonot suyagi koʻmiri aniq tortildi!");
      renderAll();
    }
  }

  // Stage 3B shaking & filtering animations
  if (S.stage === 3 && S.s3.sub === "B") {
    if (S.s3.shaking) {
      S.s3.shakeProg = Math.min(1, S.s3.shakeProg + dt / 3.0);
      renderScene();
      if (S.s3.shakeProg >= 1) {
        S.s3.shaking = false;
        S.s3.shaken = true;
        SFX.play("bell");
        okT("10 daqiqa chayqatish tugadi! Adsorbsion muvozanat oʻrnatildi — endi filtrlang.");
        renderAll();
      }
    }
    if (S.s3.filtering) {
      S.s3.filterProg = Math.min(1, S.s3.filterProg + dt / 3.2);
      renderScene();
      if (S.s3.filterProg >= 1) {
        S.s3.filtering = false;
        S.s3.filtered = true;
        SFX.play("bell");
        okT("Barcha 6 kolba filtrlandi! Endi 3C-qismda filtratlarni titrlab C₁ ni toping.");
        renderAll();
      }
    }
  }

  requestAnimationFrame(tick);
}

el("btnTheory").addEventListener("click", () => {
  SFX.play("click");
  LabUI.modal(`
    <h1>📘 Nazariy maʼlumotlar · Adsorbsiya va Freyndlix izotermasi</h1>
    <p><b>Adsorbsiya</b> — ikki faza (masalan, qattiq jism–suyuqlik) chegarasidagi sirt qatlamida modda konsentratsiyasining oʻz-oʻzidan ortishi hodisasidir. Moddani yutuvchi qattiq jism <b>adsorbent</b> (hayvonot suyagi koʻmiri), yutiluvchi modda <b>adsorbat</b> (CH₃COOH) deyiladi.</p>
    <h3>1. Solishtirma adsorbsiyani hisoblash</h3>

    <h3>2. Freyndlix adsorbsiya izotermasi tenglamasi</h3>
