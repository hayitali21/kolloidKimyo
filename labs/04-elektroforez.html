/* ============ BALLAR HISOBI (0..100) ============ */
function total() {
  // Stage 1: 18 amaliy + 6 savol = 24
  let p1 = 0;
  if (S.s1.tubes) p1 += 3;
  if (S.s1.sand) p1 += 3;
  if (S.s1.water) p1 += 3;
  if (S.s1.electrodes) p1 += 3;
  if (S.s1.tMin >= 3) p1 += 3;
  if (S.s1.chargeOk) p1 += 3;
  let q1 = STAGE_QS[0].reduce((a, q) => a + (S.s1.q[q.id] === q.ok ? 3 : 0), 0);

  // Stage 2: 20 amaliy + 6 savol = 26
  let p2 = 0;
  if (S.s2.solA.mixed) p2 += 3;
  if (S.s2.solA.tMin >= 2) p2 += 3;
  if (S.s2.solA.ok) p2 += 4;
  if (S.s2.solB.mixed) p2 += 3;
  if (S.s2.solB.tMin >= 2) p2 += 3;
  if (S.s2.solB.ok) p2 += 4;
  let q2 = STAGE_QS[1].reduce((a, q) => a + (S.s2.q[q.id] === q.ok ? 3 : 0), 0);

  // Stage 3: 24 amaliy + 6 savol = 30
  let p3 = 0;
  if (S.s3.waterFilled) p3 += 3;
  if (S.s3.solLayered) p3 += 4;
  if (S.s3.bridges) p3 += 4;
  if (S.s3.baseMarked) p3 += 3;
  if (S.s3.records.length >= 1) p3 += 5;
  if (S.s3.uOk) p3 += 5;
  let q3 = STAGE_QS[2].reduce((a, q) => a + (S.s3.q[q.id] === q.ok ? 3 : 0), 0);

  // Quiz: 5 * 4 = 20
  let qz = QUIZ.reduce((a, q) => a + (S.quiz[q.id] === q.ok ? 4 : 0), 0);

  const tot = p1 + q1 + p2 + q2 + p3 + q3 + qz;
  return { p1, q1, p2, q2, p3, q3, qz, tot };
}

function stageDone(i) {
  if (i === 0) return S.s1.chargeOk && STAGE_QS[0].every(q => S.s1.q[q.id] === q.ok);
  if (i === 1) return S.s2.solA.ok && S.s2.solB.ok && STAGE_QS[1].every(q => S.s2.q[q.id] === q.ok);
  if (i === 2) return S.s3.uOk && STAGE_QS[2].every(q => S.s3.q[q.id] === q.ok);
  return false;
}

/* ============ TABLAR VA PROGRESS ============ */
const TAB_NAMES = ["1. Loy elektroforezi", "2. AgBr zaryadi", "3. Harakatchanlik", "4. Hisobot"];
function renderTabs() {
  const t = total();
  const doneAll = stageDone(0) && stageDone(1) && stageDone(2) && QUIZ.every(q => S.quiz[q.id] !== undefined);
  el("chip").textContent = `${t.tot} / 100 ball`;
  el("tabs").innerHTML = TAB_NAMES.map((nm, i) => {
    const cls = [S.stage === i ? "cur" : "", (i < 3 && stageDone(i)) || (i === 3 && doneAll) ? "done" : ""].join(" ");
    return `<button class="${cls}" onclick="goStage(${i})">${nm}</button>`;
  }).join("");
  LabProgress.save(LAB_ID, t.tot, doneAll || t.tot >= 75);
}

window.goStage = function(i) {
  SFX.play("click");
  S.stage = i;
  renderAll();
};

/* ============ ANIMATSIYA (requestAnimationFrame) ============ */
let lastTs = performance.now();
let animPhase = 0;

function tick(now) {
  const dt = Math.min(0.08, (now - lastTs) / 1000);
  lastTs = now;
  animPhase += dt;

  let needPanelQuickUpdate = false;

  // Stage 1: Loy elektroforezi (0..12 min)
  if (S.s1.power && S.s1.tMin < 12) {
    const prevInt = Math.floor(S.s1.tMin);
    S.s1.tMin = clamp(S.s1.tMin + dt * (S.speed / 12), 0, 12);
    if (Math.floor(S.s1.tMin) !== prevInt) needPanelQuickUpdate = true;
    if (S.s1.tMin >= 12) {
      S.s1.power = false;
      SFX.play("bell");
      toast("12 daqiqa oʻtdi! Anod (+) nayidagi suv kuchli loyqalandi, sathi pasaydi. Zaryadni belgilang.", "ok", 4500);
      needPanelQuickUpdate = true;
    }
  }

  // Stage 2: AgBr elektroforezi (0..8 min)
  const cur2 = S.s2.activeSol === "A" ? S.s2.solA : S.s2.solB;
  if (cur2.power && cur2.tMin < 8) {
    const prevInt = Math.floor(cur2.tMin);
    cur2.tMin = clamp(cur2.tMin + dt * (S.speed / 12), 0, 8);
    if (Math.floor(cur2.tMin) !== prevInt) needPanelQuickUpdate = true;
    if (cur2.tMin >= 8) {
      cur2.power = false;
      SFX.play("bell");
      toast(`Zol ${S.s2.activeSol} chegarasi aniq siljidi! Zaryad ishorasini tanlang.`, "ok", 4000);
      needPanelQuickUpdate = true;
    }
  }

  // Stage 3: Harakatchanlik (0..40 min)
  if (S.s3.power && S.s3.tMin < 40) {
    const prevHalf = Math.floor(S.s3.tMin * 2);
    S.s3.tMin = clamp(S.s3.tMin + dt * (S.speed / 10), 0, 40);
    const prop = SOL_PROPS[S.s3.solType];
    // S = U_min * V * tMin / l
    S.s3.S_cm = (prop.U_min * S.s3.V * S.s3.tMin) / S.s3.l;
    if (Math.floor(S.s3.tMin * 2) !== prevHalf) needPanelQuickUpdate = true;
    if (S.s3.tMin >= 40) {
      S.s3.power = false;
      SFX.play("bell");
      toast("40 daqiqa toʻldi. Natijani jurnalga qayd etib harakatchanlikni hisoblang.", "ok");
      needPanelQuickUpdate = true;
    }
  }

  updateSceneLive();
  if (needPanelQuickUpdate) {
    updateLiveNumbers();
  }
  requestAnimationFrame(tick);
}

function updateLiveNumbers() {
  if (S.stage === 0) {
    const e = el("s1Clock");
    if (e) e.innerHTML = `${f1(S.s1.tMin, 1)} min<small>Elektroforez vaqti (2 V)</small>`;
    const obs = el("s1Obs");
    if (obs) {
      const p = clamp(S.s1.tMin / 10, 0, 1);
      obs.innerHTML = `<div class="kv"><span>Anod (+) loyqaligi:</span><b>${Math.round(p * 100)}%</b></div>
        <div class="kv"><span>Anod (+) suv sathi:</span><b>${f1(2.5 - p * 0.6, 2)} sm</b></div>
        <div class="kv"><span>Katod (−) suv sathi:</span><b>${f1(2.5 + p * 0.6, 2)} sm</b></div>`;
    }
    if (S.s1.tMin >= 3 && !el("s1GuessBox")) renderPanel();
  } else if (S.stage === 1) {
    const cur = S.s2.activeSol === "A" ? S.s2.solA : S.s2.solB;
    const e = el("s2Clock");
    if (e) e.innerHTML = `${f1(cur.tMin, 1)} min<small>100 V kenotron toki · Zol ${S.s2.activeSol}</small>`;
    if (cur.tMin >= 2 && !el("s2GuessBox")) renderPanel();
  } else if (S.stage === 2) {
    const e = el("s3Clock");
    if (e) e.innerHTML = `t = ${f1(S.s3.tMin, 1)} min · S = ${f1(S.s3.S_cm, 2)} sm<small>V = ${S.s3.V} V · l = ${f1(S.s3.l, 1)} sm</small>`;
  }
  renderTabs();
}

function renderScene() {
  const svg = el("scene");
  if (S.stage === 0) svg.innerHTML = buildScene1();
  else if (S.stage === 1) svg.innerHTML = buildScene2();
  else if (S.stage === 2) svg.innerHTML = buildScene3();
  else svg.innerHTML = buildSceneReport();
  updateSceneLive();
}

/* --- SAHNA 1: LOY (GIL) ELEKTROFOREZI (28-rasm) --- */
function buildScene1() {
  const s = S.s1;
  const needTubes = !s.tubes;
  const needSand = s.tubes && !s.sand;
  const needWater = s.sand && !s.water;
  const needElec = s.water && !s.electrodes;
  const needPower = s.electrodes && !s.power && s.tMin < 3;

  return `${commonDefs()}

/* ============ JONLI SVG YANGILASH (60 FPS) ============ */
function updateSceneLive() {
  if (S.stage === 0 && S.s1.tubes && S.s1.water) {
    const p = clamp(S.s1.tMin / 10, 0, 1);
    // Suv sathlari: chap (katod -) ko'tariladi, o'ng (anod +) pasayadi
    const shift = p * 18;
    const wL = el("s1WaterL"), mL = el("s1MenL");
    const wR = el("s1WaterR"), mR = el("s1MenR"), tR = el("s1TurbidR");
    if (wL) { wL.setAttribute("y", (112 - shift).toFixed(1)); wL.setAttribute("height", (82 + shift).toFixed(1)); }
    if (mL) mL.setAttribute("cy", (112 - shift).toFixed(1));
    if (wR) { wR.setAttribute("y", (112 + shift).toFixed(1)); wR.setAttribute("height", (82 - shift).toFixed(1)); }
    if (mR) mR.setAttribute("cy", (112 + shift).toFixed(1));
    if (tR) {
      tR.setAttribute("y", (112 + shift).toFixed(1));
      tR.setAttribute("height", (82 - shift).toFixed(1));
      tR.setAttribute("opacity", (p * 0.78).toFixed(3));
    }
    const lblR = el("s1LblR"), lblL = el("s1LblL");
    if (lblR) lblR.textContent = p > 0.55 ? "Kuchli loyqa!" : p > 0.15 ? "Loyqalanmoqda" : "Tiniq";
    if (lblL) lblL.textContent = p > 0.25 ? "Tiniq (+sath)" : "Tiniq";

    const arr = el("s1Arrows");
    if (arr) arr.setAttribute("opacity", S.s1.power || p > 0.15 ? "0.95" : "0");

    const grp = el("s1ClayParticles");
    if (grp && p > 0.02) {
      let dots = "";
      const count = Math.floor(6 + p * 28);
      for (let i = 0; i < count; i++) {
        const seed = i * 73.13;
        const x = 7 + ((seed * 17) % 44);
        const speed = 14 + (i % 5) * 4;
        const travel = (S.s1.power ? animPhase * speed : 0) + (seed % 70);
        const hMax = Math.max(10, 74 - shift);
        const y = 190 - (travel % hMax);
        const r = 1.6 + (i % 3) * 0.7;
        dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#6e3615" opacity="${(0.35 + p * 0.55).toFixed(2)}"/>`;
      }
      grp.innerHTML = dots;
    }
  } else if (S.stage === 1) {
    const sol = S.s2.activeSol;
    const cur = sol === "A" ? S.s2.solA : S.s2.solB;
    if (cur.loaded) {
      const p = clamp(cur.tMin / 8, 0, 1);
      // Zol A (+): chap tirsak Katod (-) ga ko'tariladi, o'ng (Anod +) pasayadi
      // Zol B (-): o'ng tirsak Anod (+) ga ko'tariladi, chap (Katod -) pasayadi
      const dir = sol === "A" ? 1 : -1;
      const dy = p * 54 * dir;
      const yL = 175 - dy;
      const yR = 175 + dy;
      const sL = el("s2SolL"), sR = el("s2SolR"), lL = el("s2LineL"), lR = el("s2LineR");
      if (sL) { sL.setAttribute("y", yL.toFixed(1)); sL.setAttribute("height", (345 - yL).toFixed(1)); }
      if (sR) { sR.setAttribute("y", yR.toFixed(1)); sR.setAttribute("height", (345 - yR).toFixed(1)); }
      if (lL) { lL.setAttribute("y1", yL.toFixed(1)); lL.setAttribute("y2", yL.toFixed(1)); }
      if (lR) { lR.setAttribute("y1", yR.toFixed(1)); lR.setAttribute("y2", yR.toFixed(1)); }

      const pts = el("s2Parts");
      if (pts) {
        let html = "";
        for (let i = 0; i < 16; i++) {
          const leftArm = i < 8;
          const x = leftArm ? 116 + (i * 11) % 24 : 250 + (i * 13) % 24;
          const baseY = leftArm ? yL + 8 : yR + 8;
          const span = Math.max(20, 290 - baseY);
          const off = ((i * 29 + (cur.power ? animPhase * 22 * (leftArm ? -dir : dir) : 0)) % span + span) % span;
          html += `<circle cx="${x}" cy="${(baseY + off).toFixed(1)}" r="2.2" fill="#8f6c0e" opacity="0.65"/>`;
        }
        pts.innerHTML = html;
      }
      const arr = el("s2DirArrow");
      if (arr) {
        if (p > 0.12) {
          arr.setAttribute("opacity", "1");
          if (sol === "A") {
            arr.innerHTML = `<path d="M96,210 L96,135" stroke="#1f9d6b" stroke-width="3.5" stroke-linecap="round"/>
              <polygon points="96,126 89,140 103,140" fill="#1f9d6b"/>
              <text x="86" y="175" text-anchor="end" font-size="11.5" font-weight="800" fill="#126b47">Katod (−) ga</text>`;
          } else {
            arr.innerHTML = `<path d="M294,210 L294,135" stroke="#c83333" stroke-width="3.5" stroke-linecap="round"/>
              <polygon points="294,126 287,140 301,140" fill="#c83333"/>
              <text x="304" y="175" text-anchor="start" font-size="11.5" font-weight="800" fill="#9c2222">Anod (+) ga</text>`;
          }
        } else {
          arr.setAttribute("opacity", "0");
        }
      }
    }
  } else if (S.stage === 2) {
    const s = S.s3;
    const prop = SOL_PROPS[s.solType];
    if (s.solLayered) {
      // 1 sm = 16 px; boshlang'ich sath 4.0 sm -> y = 211
      const px = clamp(s.S_cm * 16, 0, 92);
      const yL = 211 + (prop.dir < 0 ? -px : px);
      const yR = 211 + (prop.dir < 0 ? px : -px);
      const sL = el("s3SolL"), sR = el("s3SolR"), bL = el("s3BoundL"), bR = el("s3BoundR");
      if (sL) { sL.setAttribute("y", yL.toFixed(1)); sL.setAttribute("height", (356 - yL).toFixed(1)); }
      if (sR) { sR.setAttribute("y", yR.toFixed(1)); sR.setAttribute("height", (356 - yR).toFixed(1)); }
      if (bL) { bL.setAttribute("y1", yL.toFixed(1)); bL.setAttribute("y2", yL.toFixed(1)); }
      if (bR) { bR.setAttribute("y1", yR.toFixed(1)); bR.setAttribute("y2", yR.toFixed(1)); }
    }
    const lv = el("s3LcdV"), ls = el("s3LcdS");
    if (lv) lv.textContent = s.power ? `${s.V} V · ${f1(s.tMin, 1)} min` : `${s.V} V · PAUZA`;
    if (ls) ls.textContent = `S = ${f1(s.S_cm, 2)} sm`;
  }
}

/* ============ AMALLAR (ACTIONS) ============ */
window.act1 = function(cmd) {
  const s = S.s1;
  if (cmd === "tubes") {
    if (s.tubes) return toast("Shisha naylar allaqachon loyga tiqilgan.", "warn");
    s.tubes = true; SFX.play("click");
    toast("2 ta 1,5–2 sm diametrli shisha nay loy boʻlagiga tiqildi.", "ok");
  } else if (cmd === "sand") {
    if (!s.tubes) return toast("Avval shisha naylarni loyga tiqing!", "warn");
    if (s.sand) return toast("Qum allaqachon solingan.", "warn");
    s.sand = true; SFX.play("pour");
    toast("Har ikkala nayga 0,5 sm qalinlikda yuvilgan qum solindi.", "ok");
  } else if (cmd === "water") {
    if (!s.sand) return toast("Avval 0,5 sm yuvilgan qum soling!", "warn");
    if (s.water) return toast("Distillangan suv allaqachon quyilgan.", "warn");
    s.water = true; SFX.play("pour");
    toast("Qum yuzasidan 2,5 sm balandlikda distillangan suv quyildi.", "ok");
  } else if (cmd === "electrodes") {
    if (!s.water) return toast("Avval distillangan suv quying!", "warn");
    if (s.electrodes) return toast("Mis elektrodlar oʻrnatilgan.", "warn");
    s.electrodes = true; SFX.play("click");

window.guess2 = function(sign) {

    cur.ok = true;
    SFX.play("ok");
    toast(sol === "A"

window.act3 = function(cmd) {

    toast("Joʻmrak sekin ochilib, zol suv ostiga aralashmasdan 1/3 balandlikkacha kiritildi.", "ok");

    s.bridges = true; SFX.play("click");
    toast("Agar-agar koʻprikchalari CuSO₄ eritmali stakanlar va mis elektrodlar bilan tutashtirildi.", "ok");
  } else if (cmd === "mark") {

    s.baseMarked = true; SFX.play("beep");

  } else if (cmd === "record") {
    if (s.tMin < 5) return toast("Aniq oʻlchash uchun tok kamida 5 daqiqa oʻtsin!", "warn");
    const rec = { tMin: +s.tMin.toFixed(1), S_cm: +s.S_cm.toFixed(2), V: s.V, l: s.l };
    s.records.push(rec);
    SFX.play("ok");
    toast(`Jurnalga yozildi: t = ${f1(rec.tMin, 1)} min, S = ${f1(rec.S_cm, 2)} sm.`, "ok");
  }
  renderAll();

window.checkU3 = function() {
  const s = S.s3;
  if (s.records.length === 0) return toast("Avval kamida 1 ta (S, t) oʻlchovni jurnalga qayd eting!", "warn");
  const inp = el("uInputEl");
  const raw = (inp ? inp.value : s.uInput).trim().replace(",", ".");
  s.uInput = raw;
  const val = parseFloat(raw);
  if (isNaN(val) || val <= 0) return toast("Iltimos, musbat son kiriting (masalan: 0,0210).", "err");
  const trueU = SOL_PROPS[s.solType].U_min;
  const relErr = Math.abs(val - trueU) / trueU;
  s.uChecked = true;
  if (relErr <= 0.08) {
    s.uOk = true;
    SFX.play("fanfare");
    toast(`Barakalla! U = ${f1(trueU, 4)} sm²/(V·min) = ${f1(trueU / 60 * 1e4, 2)}·10⁻⁴ sm²/(V·s).`, "ok", 5000);
  } else {
    s.uOk = false;
    SFX.play("err");
    toast(`Xatolik! Formulani tekshiring: U = (S · l) / (V · t), bu yerda t daqiqada.`, "err", 4200);
  }
  renderAll();
};

window.ansStageQ = function(stageIdx, qid, optIdx) {

  const store = stageIdx === 0 ? S.s1.q : stageIdx === 1 ? S.s2.q : S.s3.q;
  store[qid] = optIdx;
  SFX.play(optIdx === qObj.ok ? "ok" : "err");
  if (optIdx === qObj.ok) toast("Toʻgʻri javob! (+3 ball)", "ok");
  else toast("Notoʻgʻri. Qayta urinib koʻring!", "err");
  renderAll();
};

window.ansQuiz = function(qid, optIdx) {
  const qObj = QUIZ.find(x => x.id === qid);

function renderStageQs(stageIdx) {
  const store = stageIdx === 0 ? S.s1.q : stageIdx === 1 ? S.s2.q : S.s3.q;
  return `<div class="box"><h4>Nazorat savollari</h4>` +
    STAGE_QS[stageIdx].map((q, qi) => {
      const order = shuf(q.opts.length, 41 + stageIdx * 17 + qi * 7);
      const picked = store[q.id];
      return `<div class="q"><p>${q.p}</p>` +
        order.map(oi => {
          const cls = picked === oi ? (oi === q.ok ? "right" : "wrong") : "";
          return `<button class="${cls}" onclick="ansStageQ(${stageIdx},'${q.id}',${oi})">${q.opts[oi]}</button>`;
        }).join("") + `</div>`;
    }).join("") + `</div>`;
}

          <button onclick="act3('power')" class="${s.power ? "on" : "pri"}" ${!s.baseMarked ? "disabled" : ""}>${s.power ? "⏸ Pauza" : "⚡ Tokni yoqish"}</button>
          <button onclick="act3('record')" ${s.tMin < 5 ? "disabled" : ""}>📌 Oʻlchovni yozish</button>
        </div>
      </div>
      <div class="box">
        <h4>Jonli koʻrsatkichlar</h4>
        <div class="big" id="s3Clock">t = ${f1(s.tMin, 1)} min · S = ${f1(s.S_cm, 2)} sm<small>V = ${s.V} V · l = ${f1(s.l, 1)} sm</small></div>
        ${s.records.length ? `
          <table class="j">
            <thead><tr><th>#</th><th>t, min</th><th>S, sm</th><th>V, V</th><th>l, sm</th></tr></thead>
            <tbody>${s.records.map((r, i) => `<tr><td>${i + 1}</td><td>${f1(r.tMin, 1)}</td><td>${f1(r.S_cm, 2)}</td><td>${r.V}</td><td>${f1(r.l, 1)}</td></tr>`).join("")}</tbody>
          </table>
          <div style="margin-top:8px">${chartSvg}</div>
        ` : `<p class="note">Kamida 5 daqiqa tok oʻtgach «Oʻlchovni yozish» tugmasini bosing (2–3 nuqta olsangiz chiziqli grafik chiqadi).</p>`}
      </div>
      <div class="box">
        <h4>Harakatchanlikni hisoblash</h4>
        <div class="eq">U = (S · l) / (V · t)   [sm² / (V · min)]</div>
        <p class="note">Oʻlchov jadvalidan S, l, V, t qiymatlarini qoʻyib U ni hisoblang (masalan, 0,0210):</p>
        <div class="calc-row">
          <input id="uInputEl" type="text" placeholder="U [sm²/(V·min)]" value="${s.uInput}">
          <button class="pri" onclick="checkU3()">Tekshirish</button>
        </div>
        ${s.uChecked ? (s.uOk
          ? `<p class="note" style="margin-top:6px;color:var(--ok);font-weight:700">✓ Toʻgʻri! U = ${f1(prop.U_min, 4)} sm²/(V·min) = ${f1(prop.U_min / 60 * 1e4, 2)}·10⁻⁴ sm²/(V·s)</p>`
          : `<p class="note" style="margin-top:6px;color:var(--err)">✗ Natija mos kelmadi. S (sm) · ${f1(s.l, 1)} / (${s.V} · t (min)) ni qayta hisoblang.</p>`) : ""}
      </div>
      ${renderStageQs(2)}
      ${stageDone(2) ? `<button class="next pri" onclick="goStage(3)">Yakuniy hisobot va testga oʻtish →</button>` : ""}
    `;
  } else {
    renderReport();
  }
}

function renderReport() {
  const t = total();
  const prop = SOL_PROPS[S.s3.solType];
  const grade = t.tot >= 90 ? "Aʼlo (5)" : t.tot >= 75 ? "Yaxshi (4)" : t.tot >= 60 ? "Qoniqarli (3)" : "Tugallanmagan";
  const chartSvg = S.s3.records.length ? svgChart({
    title: `${prop.name}: S(t) elektroforez grafigi`,
    xl: "t, min", yl: "S, sm",
    x0: 0, xm: Math.max(25, ...S.s3.records.map(r => r.tMin + 4)), y0: 0, ym: Math.max(3, ...S.s3.records.map(r => r.S_cm + 0.6)),
    series: [{ color: prop.color, pts: [{ x: 0, y: 0 }, ...S.s3.records.map(r => ({ x: r.tMin, y: r.S_cm }))] }]
  }) : "";

  el("panel").innerHTML = `<div class="rep">
    <h2>4-laboratoriya hisoboti</h2>
    <div class="score">
      <div class="n">${t.tot}</div>
      <div><b>${grade}</b><br><span style="font-size:12px;opacity:.82">1-tajriba: ${t.p1 + t.q1}/24 · 2-tajriba: ${t.p2 + t.q2}/26 · 3-tajriba: ${t.p3 + t.q3}/30 · Test: ${t.qz}/20</span></div>
    </div>

    <div class="box">
      <h4>Tajriba natijalari xulosasi</h4>
      <table class="j">
        <thead><tr><th>Tajriba</th><th>Natija</th><th>Holat</th></tr></thead>
        <tbody>
          <tr><td>1. Loy (gil)</td><td>Anod (+) loyqalandi → (−)</td><td>${S.s1.chargeOk ? "✓" : "—"}</td></tr>
          <tr><td>2a. AgBr (Ag⁺ moʻl)</td><td>Katod (−) ga → (+)</td><td>${S.s2.solA.ok ? "✓" : "—"}</td></tr>
          <tr><td>2b. AgBr (Br⁻ moʻl)</td><td>Anod (+) ga → (−)</td><td>${S.s2.solB.ok ? "✓" : "—"}</td></tr>
          <tr><td>3. ${prop.name}</td><td>U = ${S.s3.uOk ? f1(prop.U_min, 4) + " sm²/(V·min)" : "—"}</td><td>${S.s3.uOk ? "✓" : "—"}</td></tr>
        </tbody>
      </table>
      ${chartSvg ? `<div style="margin-top:8px">${chartSvg}</div>` : ""}
    </div>

    <div class="box">
      <h4>Yakuniy test (5 savol × 4 ball = 20 ball)</h4>
      ${QUIZ.map((q, qi) => {
        const order = shuf(q.opts.length, 404 + qi * 13);
        const picked = S.quiz[q.id];
        return `<div class="q"><p>${q.p}</p>` +
          order.map(oi => {
            const cls = picked === oi ? (oi === q.ok ? "right" : "wrong") : "";
            return `<button class="${cls}" onclick="ansQuiz('${q.id}',${oi})">${q.opts[oi]}</button>`;
          }).join("") + `</div>`;
      }).join("")}
    </div>

    <div class="row noprint">
      <button class="pri" style="flex:1" onclick="window.print()">🖨️ Hisobotni chop etish</button>
      <button class="ghost" onclick="location.reload()">↺ Qaytadan boshlash</button>
    </div>
  </div>`;
}

function renderAll() {
  renderTabs();
  renderScene();
  renderPanel();
}

/* ============ MODALLAR (NAZARIYA, JURNAL, MASLAHAT, KIRISH) ============ */
function showTheory() {
  modal(`
    <h1>📘 4-laboratoriya nazariyasi</h1>
    <p><b>Mavzu:</b> Dispers sistemalarning elektr xossalari. Zarracha zaryadini aniqlash. Elektroforez va elektroosmos.</p>
    <h3>1. Elektroforez va elektroosmos</h3>
    <ul>
      <li><b>Elektroforez</b> — tashqi oʻzgarmas elektr maydon taʼsirida dispers faza zarrachalarining suyuq muhitda qarama-qarshi zaryadli elektrod tomon harakatlanishi.</li>
      <li><b>Elektroosmos</b> — elektr maydon taʼsirida dispersion muhit (suyuqlik) ning qoʻzgʻalmas gʻovak diafragma (masalan, nam loy) orqali harakatlanishi.</li>
    </ul>
    <h3>2. Kolloid mitsella tuzilishi (Panet–Fayans qoidasi)</h3>
    <p>Yadro sirtiga eritmada ortiqcha boʻlgan va kristall panjarani toʻldira oladigan <b>potensial belgilovchi ionlar</b> adsorbsiyalanadi:</p>
    <div class="eq">AgNO₃ ortiqcha: {m[AgBr] · nAg⁺ · (n−x)NO₃⁻}ˣ⁺ · xNO₃⁻   (musbat zol)</div>
    <div class="eq">KBr ortiqcha:   {m[AgBr] · nBr⁻ · (n−x)K⁺}ˣ⁻ · xK⁺     (manfiy zol)</div>
    <h3>3. Elektroforetik harakatchanlik</h3>
    <p>Kolloid zarrachalarning birlik elektr maydon kuchlanganligidagi (1 V/sm) harakat tezligi <b>harakatchanlik (U)</b> deyiladi:</p>
    <div class="eq">U = (S · l) / (V · t)</div>
    <p>Bu yerda: <b>S</b> — chegaraning siljishi (sm), <b>l</b> — agar-agar koʻpriklar orasidagi U-nay uzunligi (sm), <b>V</b> — kuchlanish (V), <b>t</b> — vaqt (min yoki s). Qutblanishni oldini olish uchun Cu elektrodlar CuSO₄ eritmasiga, u esa agar-agar koʻprikchalar orqali U-nayga ulanadi.</p>
    ${refsHTML()}
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" onclick="LabUI.closeModal()">Yopish</button></div>
  `);
}

function showJournal() {
  const prop = SOL_PROPS[S.s3.solType];
  modal(`
    <h1>📋 Laboratoriya jurnali (4-ish)</h1>
    <h3>1-tajriba: Loy (gil) elektroforezi</h3>
    <p>Vaqt: <b>${f1(S.s1.tMin, 1)} min</b> · Anod (+) nayi: ${S.s1.tMin >= 3 ? "loyqalandi, suv sathi pasaydi" : "hali kuzatilmadi"} · Zaryad: <b>${S.s1.chargeOk ? "Manfiy (−)" : "aniqlanmagan"}</b></p>
    <h3>2-tajriba: AgBr zollari</h3>
    <table class="j">
      <thead><tr><th>Namuna</th><th>Reaktivlar</th><th>Siljish</th><th>Zaryad</th></tr></thead>
      <tbody>
        <tr><td>Zol A</td><td>3 ml KBr(→10) + 5 ml AgNO₃(→40)</td><td>Katod (−) ga</td><td>${S.s2.solA.ok ? "Musbat (+)" : "—"}</td></tr>
        <tr><td>Zol B</td><td>5 ml KBr(→40) + 4 ml AgNO₃(→15)</td><td>Anod (+) ga</td><td>${S.s2.solB.ok ? "Manfiy (−)" : "—"}</td></tr>
      </tbody>
    </table>
    <h3>3-tajriba: Harakatchanlik (${prop.name})</h3>
    ${S.s3.records.length ? `<table class="j">
      <thead><tr><th>#</th><th>t, min</th><th>S, sm</th><th>V, V</th><th>l, sm</th><th>U, sm²/(V·min)</th></tr></thead>
      <tbody>${S.s3.records.map((r, i) => `<tr><td>${i + 1}</td><td>${f1(r.tMin, 1)}</td><td>${f1(r.S_cm, 2)}</td><td>${r.V}</td><td>${f1(r.l, 1)}</td><td>${f1((r.S_cm * r.l) / (r.V * r.tMin), 4)}</td></tr>`).join("")}</tbody>
    </table>` : `<p class="note">Hali oʻlchov qayd etilmagan.</p>`}
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" onclick="LabUI.closeModal()">Yopish</button></div>
  `);
}

function showHint() {
  let h = "";
  if (S.stage === 0) {
    if (!S.s1.tubes) h = "Loy blokiga 2 ta shisha nayni tiqing (sahnadagi konturni yoki 1-tugmani bosing).";
    else if (!S.s1.sand) h = "Chapdagi qum stakanini bosib har bir nayga 0,5 sm yuvilgan qum soling.";
    else if (!S.s1.water) h = "Distillangan suv yuvgichini bosib qum ustidan 2,5 sm suv quying.";
    else if (!S.s1.electrodes) h = "Mis (Cu) elektrodlarni naylarga tushiring.";
    else if (S.s1.tMin < 3) h = "2 V batareyani yoqing va tezlashtirish (×10 / ×30) bilan 3+ daqiqa kuzating.";
    else h = "Anod (+) nayi loyqalandi — demak loy zarrachalari manfiy (−) zaryadlangan!";
  } else if (S.stage === 1) {
    const cur = S.s2.activeSol === "A" ? S.s2.solA : S.s2.solB;
    if (!cur.mixed) h = `Zol ${S.s2.activeSol} uchun KBr, keyin AgNO₃ ni tayyorlab kolbada aralashtiring.`;
    else if (!cur.loaded) h = "Voronkani bosib AgBr zolini U-simon nayga toʻldiring.";
    else if (!cur.elec) h = "U-nay tirsaklariga elektrodlarni oʻrnating.";
    else if (cur.tMin < 2) h = "100 V kenotron toʻgʻrilagichni yoqing va chegara siljishini kuzating.";
    else if (!cur.ok) h = S.s2.activeSol === "A" ? "Zol A da Ag⁺ ortiqcha — zol katod (−) ga siljiydi, demak zaryadi (+)." : "Zol B da Br⁻ ortiqcha — zol anod (+) ga siljiydi, demak zaryadi (−).";
    else h = "Endi ikkinchi zolga (Zol A ↔ Zol B) oʻtib uni ham tekshiring!";
  } else if (S.stage === 2) {
    if (!S.s3.waterFilled) h = "U-nayga 1/3 balandlikgacha distillangan suv quying.";
    else if (!S.s3.solLayered) h = "Voronka joʻmragini sekin ochib zolni suv ostiga qatlamlang.";
    else if (!S.s3.bridges) h = "Agar-agar tuz koʻprikchalarini CuSO₄ stakanlari bilan tutashtiring.";
    else if (!S.s3.baseMarked) h = "Boshlangʻich zol–suv chegarasini belgilang.";
    else if (S.s3.records.length === 0) h = "Tokni yoqib kamida 5–20 daqiqa oʻtkazing va «Oʻlchovni yozish» ni bosing.";
    else {
      const r = S.s3.records[S.s3.records.length - 1];
      const u = (r.S_cm * r.l) / (r.V * r.tMin);
      h = `Formula: U = (${f1(r.S_cm, 2)} × ${f1(r.l, 1)}) / (${r.V} × ${f1(r.tMin, 1)}) ≈ ${f1(u, 4)} sm²/(V·min).`;
    }
  } else {
    h = "Yakuniy 5 ta test savoliga javob bering va hisobotni chop eting!";
  }
  toast("💡 " + h, "warn", 5200);
}

function showIntro() {
  modal(`
    <h1>⚡ 4-laboratoriya: Elektroforez va zarracha zaryadi</h1>
    <p>Ushbu virtual laboratoriyada dispers sistemalarning elektr xossalarini 3 ta bosqichda amaliy oʻrganasiz:</p>
    <ul>
      <li><b>1-tajriba (28-rasm):</b> 8×15×4 sm loy blokida 2 V batareya yordamida elektroforez va elektroosmosni kuzatish.</li>
      <li><b>2-tajriba (29-rasm):</b> Ortiqcha Ag⁺ (Zol A) va ortiqcha Br⁻ (Zol B) bilan AgBr zollarini olish va 100 V tokda zaryad ishorasini aniqlash.</li>
      <li><b>3-tajriba (30-rasm):</b> Agar-agar koʻprikchali U-nayda kolloid zarrachalarning harakatchanligini <code>U = S·l/(V·t)</code> boʻyicha hisoblash.</li>
    </ul>
    <p class="note" style="margin-top:10px">Maslahat: pastki paneldagi <b>×10 / ×30 / ×60</b> tugmalari bilan tajriba vaqtini tezlashtirishingiz mumkin.</p>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="pri" onclick="LabUI.closeModal()">Boshlash →</button></div>
  `);
}

/* ============ INITSIALIZATSIYA ============ */
LabUI.initShell(LAB_ID);
document.querySelectorAll("[data-sp]").forEach(btn => {
  if (+btn.dataset.sp === S.speed) btn.classList.add("on");
  btn.addEventListener("click", () => {
    S.speed = +btn.dataset.sp;
    document.querySelectorAll("[data-sp]").forEach(b => b.classList.toggle("on", +b.dataset.sp === S.speed));
    SFX.play("click");
    toast(`Vaqt tezligi: ×${S.speed}`, "", 1800);
  });
});
el("btnTable").addEventListener("click", () => { SFX.play("click"); showJournal(); });
el("btnHint").addEventListener("click", () => { SFX.play("click"); showHint(); });
el("btnTheory").addEventListener("click", () => { SFX.play("click"); showTheory(); });

renderAll();
showIntro();
requestAnimationFrame(tick);
</script>
