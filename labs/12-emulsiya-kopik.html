/* ============ KOʻPIK MODELLARI (8-rasm asbobi) ============ */
const FOAM_SPEC = {
  nekal: {
    name: "0,2% Nekal eritmasi",
    V0: 100,        // boshlangʻich koʻpik hajmi, ml
    H0: 20.0,       // boshlangʻich koʻpik ustuni balandligi, cm
    Vmax: 12.5,     // koʻpik ichidagi jami suyuqlik, ml => K0 = 100/12.5 = 8,0
    tauDrain: 32,   // drenaj xarakteristik vaqti, s
    tauLife: 120,   // "oyna" qurish vaqti (yashash davri), s
    logTimes: [0, 10, 20, 30, 40, 60, 80, 100, 120],
    color: "#d9534f"
  },
  agar: {
    name: "0,2% Agar-agar + 0,2% Nekal",
    V0: 100,
    H0: 20.0,
    Vmax: 16.0,     // qalinroq gel pardalar => K0 = 100/16.0 = 6,25
    tauDrain: 135,  // ~4x sekin drenaj
    tauLife: 360,   // 3x uzoq yashash davri
    logTimes: [0, 10, 20, 30, 40, 60, 90, 120, 180, 240, 300, 360],
    color: "#1f9d6b"
  }
};

function foamStateAt(kind, t) {
  const sp = FOAM_SPEC[kind];
  const tc = clamp(t, 0, sp.tauLife);
  const f = tc / sp.tauLife;
  // Ajralib chiqqan suyuqlik V_suy(t): boshida tez, keyin sekinlashadi
  const rawDrain = 1 - Math.exp(-tc / sp.tauDrain);
  const norm = 1 - Math.exp(-sp.tauLife / sp.tauDrain);
  const Vsuy = +(sp.Vmax * (rawDrain / norm)).toFixed(2);
  // Koʻpik balandligi H(t): barqarorlikka mos egri chiziq
  const H = +(sp.H0 * Math.max(0, 1 - Math.pow(f, kind === "agar" ? 1.45 : 1.25))).toFixed(1);
  const Vkopik = +(sp.V0 * (H / sp.H0)).toFixed(1);
  const VinFoam = Math.max(0, sp.Vmax - Vsuy);
  const K = VinFoam > 0.25 && Vkopik > 0.5 ? +(Vkopik / VinFoam).toFixed(1) : 0;
  return { t: Math.round(tc), Vsuy, H, Vkopik, VinFoam: +VinFoam.toFixed(2), K };
}

/* ============ HOLAT (STATE) ============ */
function createInitialState() {
  return {
    stage: 0,
    speed: 10,
    // 1-bosqich: Emulsiyalar
    bzStep: 0,      // 0: boʻsh, 1: H2O+benzol quyildi, 2: chayqatildi (2 qavat), 3: +2% sovun, 4: barqaror emulsiya
    bzShakeT: 0,
    bzSepProg: 1,   // 0 (aralash) -> 1 (2 qavatga ajraldi)
    oilStep: 0,     // 0: boʻsh, 1: 4.5g bura tortildi, 2: 95ml issiq suvda eritildi, 3: +2.5ml paxta moyi, 4: barqaror emulsiya
    oilShakeT: 0,
    buraMass: 0,
    testDilute: false,
    testDye: false,
    typePicked: null, // 'MS' | 'SM'
    // 2-bosqich: 0,2% Nekal (8-rasm)
    nekal: {
      depth: 20,      // botirish chuqurligi cm H2O (12..28)
      pumpOn: false,
      valveOpen: false,
      flushed: false,
      fillProg: 0,    // 0..1 yigʻgich toʻlishi
      filled: false,
      measuring: false,
      done: false,
      time: 0,
      logs: []
    },
    // 3-bosqich: 0,2% Agar-agar + 0,2% Nekal
    agar: {
      dosed: false,
      depth: 20,
      pumpOn: false,
      valveOpen: false,
      flushed: false,
      fillProg: 0,
      filled: false,
      measuring: false,
      done: false,
      time: 0,
      logs: [],
      compared: false
    },
    ans: {},
    seed: 1268,
    t: 0
  };
}

let S = createInitialState();

/* ============ BALL HISOBLASH (100 BALL) ============ */
function total() {
  const bzPt = S.bzStep >= 4 ? 6 : (S.bzStep >= 2 ? 3 : 0);
  const oilPt = S.oilStep >= 4 ? 6 : (S.oilStep >= 2 ? 3 : 0);
  const tpPt = (S.testDilute ? 2 : 0) + (S.testDye ? 2 : 0) + (S.typePicked === "MS" ? 2 : 0);
  const p1 = bzPt + oilPt + tpPt; // 18

  const n = S.nekal;
  const p2 = (n.pumpOn || n.filled ? 2 : 0) + (n.valveOpen || n.filled ? 2 : 0) + (n.filled ? 4 : 0) + (n.done ? 8 : Math.min(6, Math.floor(n.logs.length * 0.7))); // 16

  const a = S.agar;
  const p3 = (a.dosed ? 3 : 0) + (a.filled ? 3 : 0) + (a.done ? 8 : Math.min(6, Math.floor(a.logs.length * 0.55))) + (a.compared ? 4 : 0); // 18

  const prac = p1 + p2 + p3; // 52
  let sq = 0;
  Object.values(STAGE_QS).flat().forEach(q => { if (S.ans[q.id] === q.ok) sq += 3; }); // 6*3 = 18
  let fq = 0;
  FINAL_QUIZ.forEach(q => { if (S.ans[q.id] === q.ok) fq += 6; }); // 5*6 = 30
  return { p1, p2, p3, prac, sq, fq, tot: prac + sq + fq };
}

function stageDone(i) {
  if (i === 0) return S.bzStep >= 4 && S.oilStep >= 4 && S.testDilute && S.testDye && S.typePicked === "MS";
  if (i === 1) return S.nekal.done;
  if (i === 2) return S.agar.done && S.agar.compared;
  if (i === 3) return FINAL_QUIZ.every(q => S.ans[q.id] !== undefined);
  return false;
}

const TABS = [
  "1. Emulsiyalar va tiplar",
  "2. Koʻpik: 0,2% Nekal",
  "3. Gel: Agar + Nekal",
  "4. Hisobot"
];

function renderTabs() {
  const sc = total();
  el("chip").textContent = `${sc.tot} / 100`;
  const isDone = stageDone(0) && stageDone(1) && stageDone(2);
  LabProgress.save(LAB_ID, sc.tot, isDone);

  el("tabs").innerHTML = TABS.map((t, i) => {
    const cls = (i === S.stage ? "cur " : "") + (stageDone(i) ? "done" : "");
    return `<button class="${cls}" data-st="${i}">${stageDone(i) ? "✓ " : ""}${t}</button>`;
  }).join("");
  el("tabs").querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      const idx = +b.dataset.st;
      if (idx === 2 && !S.nekal.done) {
        LabUI.toast("Avval 2-bosqichda 0,2% Nekal koʻpigi tajribasini yakunlang (taqqoslash uchun kerak)!", "warn");
        SFX.play("warn");
        return;
      }
      SFX.play("click");
      S.stage = idx;
      renderAll();
    };
  });
}

/* ============ 1-BOSQICH HARAKATLARI ============ */
function bzAction() {
  if (S.bzStep === 0) {
    S.bzStep = 1; S.bzSepProg = 1;
    SFX.play("pour");
    LabUI.toast("Silindrga 50 ml H₂O va 10 ml benzol quyildi. Endi qattiq chayqating!", "");
  } else if (S.bzStep === 1) {
    S.bzStep = 2; S.bzShakeT = 1.25; S.bzSepProg = 0;
    SFX.play("shake");
    LabUI.toast("Chayqatildi — lekin emulgatorsiz benzol tezda yana 2 qavatga ajralib ketadi!", "warn");
  } else if (S.bzStep === 2) {
    S.bzStep = 3;
    SFX.play("pipette");
    LabUI.toast("10 ml 2% sovun eritmasi (emulgator) qoʻshildi. Endi yana qattiq chayqating!", "");
  } else if (S.bzStep === 3) {
    S.bzStep = 4; S.bzShakeT = 1.3;
    SFX.play("shake");
    setTimeout(() => SFX.play("ok"), 600);
    LabUI.toast("Sutdek barqaror benzol emulsiyasi (M/S) hosil boʻldi!", "ok");
  }
  renderAll();
}

function oilAction() {
  if (S.oilStep === 0) {
    SFX.play("weigh");
    S.oilStep = 1;
    S.buraMass = 4.50;
    LabUI.toast("Analitik tarozida 4,50 g kristallik bura (Na₂B₄O₇·10H₂O) tortib olindi.", "ok");
  } else if (S.oilStep === 1) {
    SFX.play("heat");
    S.oilStep = 2;
    LabUI.toast("4,50 g bura 95 ml isitilgan distillangan suvda toʻliq eritildi va silindrga quyildi.", "");
  } else if (S.oilStep === 2) {
    SFX.play("pipette");
    S.oilStep = 3;
    LabUI.toast("5 ml li pipetka bilan 2,5 ml paxta moyi qoʻshildi. Endi qattiq chayqating!", "");
  } else if (S.oilStep === 3) {
    SFX.play("shake");
    S.oilStep = 4; S.oilShakeT = 1.3;
    setTimeout(() => SFX.play("ok"), 600);
    LabUI.toast("Paxta moyining barqaror emulsiyasi hosil boʻldi!", "ok");
  }
  renderAll();
}

function runDiluteTest() {
  if (S.bzStep < 4 && S.oilStep < 4) {
    LabUI.toast("Avval kamida bitta barqaror emulsiya hosil qiling!", "warn"); SFX.play("warn"); return;
  }
  SFX.play("drip");
  S.testDilute = true;
  LabUI.toast("Suyultirish testi: tomchi suvda darhol tarqaldi, moyda esa dumaloq tomchi boʻlib qoldi!", "ok");
  renderAll();
}

function runDyeTest() {
  if (S.bzStep < 4 && S.oilStep < 4) {
    LabUI.toast("Avval kamida bitta barqaror emulsiya hosil qiling!", "warn"); SFX.play("warn"); return;
  }
  SFX.play("drip");
  S.testDye = true;
  LabUI.toast("Metilen koʻki testi: suvda eruvchan boʻyoq tashqi (uzluksiz) fazani koʻk rangga boʻyadi!", "ok");
  renderAll();
}

function pickType(tp) {
  if (!S.testDilute && !S.testDye) {
    LabUI.toast("Avval suyultirish yoki metilen koʻki testini oʻtkazing!", "warn"); SFX.play("warn"); return;
  }
  S.typePicked = tp;
  if (tp === "MS") {
    SFX.play("ok");
    LabUI.toast("Toʻgʻri! Ikkala emulsiya ham M/S (moy/suv) — 1-turdagi toʻgʻri emulsiya!", "ok");
  } else {
    SFX.play("err");
    LabUI.toast("Notoʻgʻri! Tomchi suvda tarqaldi va tashqi faza metilen koʻki bilan boʻyaldi — demak tashqi faza SUV (M/S)!", "err");
  }
  renderAll();
}

/* ============ 2- VA 3-BOSQICH (KOʻPIK ASBOBI) HARAKATLARI ============ */
function activeFoamObj() { return S.stage === 1 ? S.nekal : S.agar; }
function activeFoamKind() { return S.stage === 1 ? "nekal" : "agar"; }

function doseAgarMixture() {
  if (S.agar.dosed) return;
  SFX.play("pour");
  S.agar.dosed = true;
  LabUI.toast("Oʻlchov dozator yordamida 0,2% agar-agar + 0,2% nekal aralashmasi tayyorlanib silindrga quyildi.", "ok");
  renderAll();
}

function togglePump() {
  const f = activeFoamObj();
  if (S.stage === 2 && !f.dosed) {
    LabUI.toast("Avval oʻlchov dozatorda 0,2% agar-agar + 0,2% nekal eritmasini silindrga quying!", "warn");
    SFX.play("warn"); return;
  }
  if (f.filled) return;
  f.pumpOn = !f.pumpOn;
  SFX.play(f.pumpOn ? "vacuum" : "click");
  if (f.pumpOn) LabUI.toast(`Havo puflagich yoqildi! Bosim ${f.depth} cm H₂O darajasida barqarorlashdi.`, "");
  renderAll();
}

function openValveAndFill() {
  const f = activeFoamObj();
  if (!f.pumpOn) { LabUI.toast("Avval havo puflagichni yoqib, doimiy bosim hosil qiling!", "warn"); SFX.play("warn"); return; }
  if (f.filled) return;
  f.valveOpen = true;
  f.flushed = true;
  SFX.play("bubble");
  LabUI.toast("Joʻmrak ochildi: dastlabki notekis koʻpik chiqarib yuborilib, yigʻgich 100 ml belgisigacha toʻldirilmoqda!", "");
  renderAll();
}

function startFoamDrainage() {
  const f = activeFoamObj();
  const kind = activeFoamKind();
  if (!f.filled) { LabUI.toast("Avval yigʻgichni 100 ml belgisigacha koʻpik bilan toʻldiring!", "warn"); SFX.play("warn"); return; }
  if (f.done) return;
  f.pumpOn = false;
  f.valveOpen = false;
  f.measuring = !f.measuring;
  if (f.measuring && f.logs.length === 0) {
    f.logs.push(foamStateAt(kind, 0));
    SFX.play("beep");
    LabUI.toast("Havo berish toʻxtatildi! Har 10 sekundda V_suy va H oʻlchanmoqda («oyna» quriguncha).", "");
  } else {
    SFX.play("click");
  }
  renderAll();
}

function answerQ(qid, chosen, correct) {
  if (S.ans[qid] !== undefined) return;
  S.ans[qid] = chosen;
  if (chosen === correct) { SFX.play("ok"); LabUI.toast("Toʻgʻri javob!", "ok", 2200); }
  else { SFX.play("err"); LabUI.toast("Notoʻgʻri. Nazariya boʻlimini koʻring.", "err", 2800); }
  renderAll();
}

  let s = `<text x="30" y="36" fill="#132629" font-size="18.5" font-weight="800">${isAgar ? "3-BOSQICH: Gel strukturasi — 0,2% Agar-agar + 0,2% Nekal (8-rasm)" : "2-BOSQICH: Koʻpik hosil qilish asbobi (8-rasm) — 0,2% Nekal"}</text>

    <rect x="0" y="0" width="80" height="236" rx="6" fill="url(#gShine)"/>
    <text x="40" y="254" text-anchor="middle" font-size="10" font-weight="800" fill="#132629">2. Bosim</text>
    <text x="40" y="267" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="#1b484f">h = ${f.depth} cm</text>
  </g>`;

  /* 3. U-SHAKLLI MANOMETR */
  s += `<g transform="translate(328, 206)" filter="url(#sh)">
    <rect x="0" y="0" width="76" height="238" rx="9" fill="#f7fbfa" stroke="#99b3b0" stroke-width="1.5"/>
    <!-- U-trubka -->
    <path d="M22 14 L22 192 Q22 214 38 214 Q54 214 54 192 L54 14" fill="none" stroke="#456569" stroke-width="12" stroke-linecap="round"/>
    <path d="M22 14 L22 192 Q22 214 38 214 Q54 214 54 192 L54 14" fill="none" stroke="#eaf5f4" stroke-width="8" stroke-linecap="round"/>
    <!-- Suyuqlik ustuni (manometr) -->
    <path d="M22 ${120 + manDiff*0.5} L22 192 Q22 214 38 214 Q54 214 54 192 L54 ${120 - manDiff*0.5}" fill="none" stroke="#e0533c" stroke-width="7"/>
    <text x="38" y="256" text-anchor="middle" font-size="10" font-weight="800" fill="#132629">3. Manometr</text>
    <text x="38" y="269" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="#d64545">ΔP=${pressP} cm</text>
  </g>`;

  /* 4. GʻOVAK SHISHA PLASTINKALI KOʻPIK SILINDRI */
  const hasSol = !isAgar || f.dosed;
  s += `<g transform="translate(446, 198)" filter="url(#sh)">
    <!-- Ikki teshikli rezina tiqin -->
    <path d="M12 -4 L96 -4 L90 20 L18 20 Z" fill="#4f3b31" stroke="#2e211b" stroke-width="1.6"/>
    <!-- Silindr -->
    <rect x="10" y="18" width="88" height="234" rx="8" fill="rgba(255,255,255,.4)" stroke="#3e5e62" stroke-width="2"/>
    <!-- Gʻovak shisha plastinka -->
    <rect x="13" y="196" width="82" height="10" rx="2" fill="#d4e0de" stroke="#5b7a7d" stroke-width="1.4" stroke-dasharray="3 2"/>
    <!-- Eritma (0.2% nekal yoki agar+nekal) -->
    ${hasSol ? `<rect x="13" y="142" width="82" height="54" fill="${isAgar ? "url(#agarGrad)" : "url(#waterGrad)"}"/>` : ""}
    <!-- Silindr ichida hosil boʻlayotgan koʻpik -->
    ${hasSol && f.pumpOn ? `
      <rect x="13" y="24" width="82" height="118" fill="#ffffff" opacity=".92"/>
      ${Array.from({length: 28}, (_, k) => {
        const bx = 22 + ((k * 23) % 64);
        const by = 140 - ((S.t * 52 + k * 19) % 114);
        return `<circle cx="${bx}" cy="${by}" r="${4 + (k%3)*1.8}" fill="${isAgar ? "#e8faf2" : "#f7fcfc"}" stroke="#b4d2ce" stroke-width="1"/>`;
      }).join("")}
    ` : ""}
    <rect x="10" y="18" width="88" height="234" rx="8" fill="url(#gShine)"/>
    <text x="54" y="270" text-anchor="middle" font-size="10" font-weight="800" fill="#132629">4. Gʻovak silindr</text>
    <text x="54" y="283" text-anchor="middle" font-size="9.2" fill="${isAgar ? "#1f9d6b" : "#1b484f"}">${isAgar ? (f.dosed ? "0,2% Agar+Nekal" : "Boʻsh (dozator)") : "0,2% Nekal"}</text>
  </g>`;

  /* 5. JOʻMRAK (STOPCOCK) */
  s += `<g class="clk ${f.pumpOn && !f.filled ? "glow" : ""}" data-act="openValve" transform="translate(612, 148)">
    <circle cx="0" cy="0" r="16" fill="#fff" stroke="#1b484f" stroke-width="2.5"/>
    <rect x="-13" y="-4" width="26" height="8" rx="3" fill="${f.valveOpen ? "#1f9d6b" : "#d64545"}" transform="rotate(${f.valveOpen ? 0 : 90})"/>
    <text x="0" y="-24" text-anchor="middle" font-size="10" font-weight="800" fill="#132629">5. Joʻmrak</text>
    <text x="0" y="29" text-anchor="middle" font-size="9" font-weight="700" fill="${f.valveOpen ? "#1f9d6b" : "#d64545"}">${f.valveOpen ? "OCHIQ" : "YOPIQ"}</text>
  </g>`;

  /* 6. MAYDA ULUSHLARGA BOʻLINGAN YIGʻGICH (0–100 ml / 0–20 cm) */
  const recH = 228; // 100 ml = 228 px
  const liqH = (st.Vsuy / 100) * recH * 2.4; // koʻrinish uchun aniqroq shkala (pastki qism)
  const foamH = clamp((st.H / sp.H0) * (recH - liqH), 0, recH - liqH);
  const foamTopY = 232 - liqH - foamH;

  s += `<g transform="translate(674, 198)" filter="url(#sh)">
    <rect x="0" y="0" width="88" height="236" rx="6" fill="rgba(255,255,255,.42)" stroke="#3e5e62" stroke-width="2"/>
    <rect x="-12" y="236" width="112" height="12" rx="4" fill="#9eb8b6" stroke="#3e5e62" stroke-width="1.6"/>
    <!-- Ajralib chiqqan suyuqlik V_suy -->
    ${liqH > 0.5 ? `<rect x="3" y="${233 - liqH}" width="82" height="${liqH}" fill="${isAgar ? "url(#agarGrad)" : "url(#waterGrad)"}"/>` : ""}
    <!-- Koʻpik ustuni H(t) -->
    ${foamH > 1.5 ? `
      <rect x="3" y="${foamTopY}" width="82" height="${foamH}" fill="${isAgar ? "#f3fcf8" : "#ffffff"}"/>
      ${Array.from({length: 34}, (_, k) => {
        const bx = 12 + ((k * 19) % 64);
        const by = foamTopY + 6 + ((k * 23) % Math.max(8, foamH - 10));
        return `<circle cx="${bx}" cy="${by}" r="${3.6 + (k%3)*1.4}" fill="${isAgar ? "#e4f7ef" : "#f4f9f9"}" stroke="${isAgar ? "#8ac9ae" : "#bfd6d4"}" stroke-width=".9"/>`;
      }).join("")}
      <line x1="-10" y1="${foamTopY}" x2="98" y2="${foamTopY}" stroke="#e89b3c" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="102" y="${foamTopY + 4}" font-size="10.5" font-weight="800" font-family="var(--mono)" fill="#d18224">H=${f1(st.H,1)}cm</text>
    ` : ""}
    <!-- Shkala -->
    ${[0,20,40,60,80,100].map(v => {
      const yy = 232 - (v / 100) * 220;
      return `<line x1="0" y1="${yy}" x2="12" y2="${yy}" stroke="#2c484c" stroke-width="1.2"/>
              <text x="15" y="${yy+3}" font-size="8" font-family="var(--mono)" fill="#2c484c">${v}</text>`;
    }).join("")}
    <rect x="0" y="0" width="88" height="236" rx="6" fill="url(#gShine)"/>
    <text x="44" y="266" text-anchor="middle" font-size="10" font-weight="800" fill="#132629">6. Yigʻgich (100 ml)</text>
    <text x="44" y="280" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="#1b484f">V_suy = ${f1(st.Vsuy,1)} ml</text>
  </g>`;

  /* 7. "OYNA" YUQORIDAN KOʻRINISH + PARDA STRUKTURASI INSET */
  const bubbleFrac = f.filled ? clamp(st.H / sp.H0, 0, 1) : f.fillProg;
  const nBub = Math.round(bubbleFrac * 24);
  s += `<g transform="translate(822, 130)" filter="url(#sh)">
    <rect x="0" y="0" width="154" height="175" rx="12" fill="#ffffff" stroke="#b9cecb" stroke-width="1.6"/>
    <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#132629">«Oyna» koʻrinishi</text>
    <circle cx="77" cy="90" r="52" fill="${isAgar ? "#b6e6d1" : "#c7ebf5"}" stroke="#3e5e62" stroke-width="2.5"/>
    ${Array.from({length: nBub}, (_, k) => {
      const ang = k * 2.39996;
      const rr = 8 + Math.sqrt(k / 24) * 38;
      return `<circle cx="${77 + Math.cos(ang)*rr}" cy="${90 + Math.sin(ang)*rr}" r="${7 + (k%3)*2}" fill="#ffffff" stroke="${isAgar ? "#76bfa1" : "#9dc5cf"}" stroke-width="1.2"/>`;
    }).join("")}
    <text x="77" y="160" text-anchor="middle" font-size="10.5" font-weight="800" fill="${f.done ? "#1f9d6b" : "#587276"}">${f.done ? "✓ «OYNA» QURIDI!" : (f.filled ? "τ = " + Math.round(f.time) + " s" : "Kutilmoqda")}</text>
  </g>`;

  // Pastki oʻng inset: Parda mikrostrukturasi
  s += `<g transform="translate(822, 318)" filter="url(#sh)">
    <rect x="0" y="0" width="154" height="128" rx="12" fill="#133136" stroke="#2c5960" stroke-width="1.6"/>
    <text x="77" y="18" text-anchor="middle" fill="#e89b3c" font-size="9.5" font-weight="800">${isAgar ? "GEL-PARDALAR (×500)" : "ODDIY PARDA (×500)"}</text>
    <!-- Plato-Gibbs kanali -->
    <path d="M22 30 Q77 64 132 30 L132 96 Q77 62 22 96 Z" fill="${isAgar ? "#47a885" : "#4da8c7"}" opacity=".75"/>
    ${isAgar ? `
      <!-- 3D agar-agar gel toʻri -->
      <path d="M26 42 L128 84 M26 84 L128 42 M40 36 L114 90 M40 90 L114 36 M60 54 L94 72 M60 72 L94 54" stroke="#b9f5dc" stroke-width="1.8" opacity=".85"/>
      <text x="77" y="114" text-anchor="middle" fill="#9bf2c8" font-size="9">Gel toʻri drenajni ushlaydi</text>
    ` : `
      <path d="M77 44 L77 88 M71 80 L77 88 L83 80" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="77" y="114" text-anchor="middle" fill="#c7e6ed" font-size="9">Suyuqlik tez oqib tushadi</text>
    `}
  </g>`;

  // Pastki status paneli
  s += `<text x="500" y="540" text-anchor="middle" fill="#cbe0dd" font-size="13" font-family="var(--mono)">Vaqt t = ${Math.round(f.time)} s   |   H = ${f1(st.H,1)} cm   |   V_suy = ${f1(st.Vsuy,1)} ml   |   Karralilik K = ${st.K ? f1(st.K,1) : "—"}   |   Tezlik ×${S.speed}</text>`;
  return s;
}

/* ============ OʻNG PANEL ============ */
function renderQuestionsHTML(list) {
  return list.map((q, qi) => {
    const order = shuf(q.opts.length, S.seed + qi * 19 + q.id.charCodeAt(q.id.length - 1));
    const chosen = S.ans[q.id];
    return `<div class="q">
      <p>${qi + 1}. ${q.q}</p>
      ${order.map(oi => {
        let cls = "";
        if (chosen !== undefined) {
          if (oi === q.ok) cls = "right";
          else if (oi === chosen) cls = "wrong";
        }
        return `<button class="${cls}" data-qid="${q.id}" data-oi="${oi}" data-ok="${q.ok}" ${chosen !== undefined ? "disabled" : ""}>${q.opts[oi]}</button>`;
      }).join("")}
    </div>`;
  }).join("");
}

function bindQuestions(root) {
  root.querySelectorAll("button[data-qid]").forEach(b => {
    b.onclick = () => answerQ(b.dataset.qid, +b.dataset.oi, +b.dataset.ok);
  });
}

      <div class="box">
        <h4>8-rasm asbobini boshqarish</h4>
        ${isAgar ? `<button class="${f.dosed?"on":"pri"}" id="btnDose" style="width:100%;margin-bottom:8px" ${f.dosed?"disabled":""}>${f.dosed?"✓ 0,2% Agar + 0,2% Nekal quyildi":"🧪 Oʻlchov dozatorda aralashma quyish"}</button>` : ""}
        <div class="kv"><span>Nay botish chuqurligi (bosim):</span><b>${f.depth} cm H₂O</b></div>
        <input type="range" id="rngDepth" min="12" max="28" step="2" value="${f.depth}" ${f.filled?"disabled":""}>
        <div class="row" style="margin-top:8px">
          <button class="${f.pumpOn?"on":"pri"}" id="btnPump" ${f.filled || (isAgar && !f.dosed)?"disabled":""}>${f.pumpOn?"● Puflagich yoniq":"💨 1. Puflagichni yoqish"}</button>
          <button class="${f.filled?"on":"dark"}" id="btnValve" ${!f.pumpOn || f.filled?"disabled":""}>${f.filled?"✓ 100 ml toʻldi":"🔧 2. Joʻmrakni ochish"}</button>
        </div>
        <button class="${f.done?"on":"pri"}" id="btnDrain" style="width:100%;margin-top:7px" ${!f.filled || f.done?"disabled":""}>${f.done ? "✓ «Oyna» quridi (τ = " + sp.tauLife + " s)" : (f.measuring ? "⏸ Oʻlchashni toʻxtatish" : "⏱ 3. Havoni toʻxtatish va oʻlchash")}</button>
        <div class="kpi-grid">
          <div class="kpi"><small>Vaqt (t / τ)</small><b>${Math.round(f.time)} / ${sp.tauLife} s</b></div>
          <div class="kpi"><small>Karralilik K₀</small><b>${f.filled ? f1(sp.V0 / sp.Vmax, 2) : "—"}</b></div>
          <div class="kpi"><small>Koʻpik balandligi H</small><b>${cur ? f1(cur.H, 1) + " cm" : "—"}</b></div>
          <div class="kpi"><small>Ajralgan suyuqlik V_suy</small><b>${cur ? f1(cur.Vsuy, 1) + " ml" : "—"}</b></div>
        </div>
      </div>

      <div class="box">
        <h4>Oʻlchash jadvali (${sp.name})</h4>
        <table class="j">
          <thead><tr><th>t, s</th><th>H, cm</th><th>V_suy, ml</th><th>V_ichida</th><th>K</th></tr></thead>
          <tbody>
            ${f.logs.length ? f.logs.map(r => `<tr>
              <td>${r.t}</td><td>${f1(r.H,1)}</td><td>${f1(r.Vsuy,1)}</td><td>${f1(r.VinFoam,1)}</td><td><b>${r.K ? f1(r.K,1) : "0"}</b></td>
            </tr>`).join("") : `<tr><td colspan="5" style="text-align:center;color:var(--muted)">Oʻlchash boshlangach maʼlumotlar chiqadi</td></tr>`}
          </tbody>
        </table>
      </div>

      ${isAgar && f.done ? `
        <div class="box">
          <h4>Yonma-yon taqqoslash: Nekal vs Agar-agar + Nekal</h4>
          ${!f.compared ? `<button class="pri" id="btnCompare" style="width:100%;margin-bottom:8px">📊 Taqqoslash grafiklarini qurish</button>` : comparisonChartsHTML()}
        </div>` : ""}

      <div class="box"><h4>Nazorat savollari (${st+1}-bosqich)</h4>${renderQuestionsHTML(STAGE_QS[st])}</div>
      <button class="pri next" id="btnNext" ${!stageDone(st)?"disabled":""}>${isAgar ? "Yakuniy hisobotga oʻtish →" : "3-bosqichga oʻtish: Agar-agar taʼsiri →"}</button>`;
  } else {
    const sc = total();
    h = `<div class="rep">
      <h2>12-laboratoriya · Yakuniy hisobot</h2>
      <div class="score">
        <div class="n">${sc.tot}</div>
        <div>
          <b>Umumiy ball (100 dan)</b>
          <div style="font-size:12px;opacity:.82">Amaliyot: ${sc.prac}/52 · Bosqich savollari: ${sc.sq}/18 · Test: ${sc.fq}/30</div>
        </div>
      </div>
      <div class="box">
        <h4>1. Emulsiyalar xulosasi</h4>
        <div class="kv"><span>Benzol + H₂O (emulgatorsiz):</span><b>Tez 2 qavatga ajraldi</b></div>
        <div class="kv"><span>Benzol + H₂O + 2% sovun:</span><b>Barqaror M/S emulsiya</b></div>
        <div class="kv"><span>Paxta moyi + 4,5 g bura + 95 ml H₂O:</span><b>Barqaror M/S emulsiya</b></div>
        <div class="kv"><span>Tipni aniqlash (suv + metilen koʻki):</span><b>${S.typePicked === "MS" ? "M/S (moy/suv) ✓" : "Aniqlanmagan"}</b></div>
      </div>
      <div class="box">
        <h4>2. Koʻpiklarning qiyosiy jadvali</h4>
        <table class="j">
          <thead><tr><th>Koʻrsatkich</th><th>0,2% Nekal</th><th>0,2% Agar+Nekal</th></tr></thead>
          <tbody>
            <tr><td>Boshlangʻich hajm V₀</td><td>100 ml</td><td>100 ml</td></tr>
            <tr><td>Jami suyuqlik V_suy,max</td><td>12,5 ml</td><td>16,0 ml</td></tr>
            <tr><td>Boshlangʻich karralilik K₀</td><td><b>8,0</b></td><td><b>6,25</b></td></tr>
            <tr><td>40 s da ajralgan V_suy</td><td>${f1(foamStateAt("nekal",40).Vsuy,1)} ml</td><td>${f1(foamStateAt("agar",40).Vsuy,1)} ml</td></tr>
            <tr><td>60 s da balandlik H</td><td>${f1(foamStateAt("nekal",60).H,1)} cm</td><td>${f1(foamStateAt("agar",60).H,1)} cm</td></tr>
            <tr class="hl"><td>Yashash davri τ («oyna»)</td><td>120 s</td><td>360 s (3×)</td></tr>
          </tbody>
        </table>
      </div>
      ${S.nekal.done && S.agar.done ? `<div class="box"><h4>3. Taqqoslash grafiklari H(t) va V_suy(t)</h4>${comparisonChartsHTML()}</div>` : ""}
      <div class="box">
        <h4>Yakuniy test (5 savol × 6 ball = 30 ball)</h4>
        ${renderQuestionsHTML(FINAL_QUIZ)}
      </div>
      <div class="row noprint">
        <button class="pri" id="btnPrint" style="flex:1">🖨 Hisobotni chop etish</button>
        <button class="ghost" id="btnReset">🔄 Qaytadan boshlash</button>
      </div>
    </div>`;
  }

  p.innerHTML = h;
  bindQuestions(p);

  const bBz = el("btnBz"); if (bBz) bBz.onclick = bzAction;
  const bOil = el("btnOil"); if (bOil) bOil.onclick = oilAction;
  const bDil = el("btnDilute"); if (bDil) bDil.onclick = runDiluteTest;
  const bDye = el("btnDye"); if (bDye) bDye.onclick = runDyeTest;
  const bMS = el("btnPickMS"); if (bMS) bMS.onclick = () => pickType("MS");
  const bSM = el("btnPickSM"); if (bSM) bSM.onclick = () => pickType("SM");

  const bDose = el("btnDose"); if (bDose) bDose.onclick = doseAgarMixture;
  const rDep = el("rngDepth"); if (rDep) rDep.oninput = () => { activeFoamObj().depth = +rDep.value; renderPanel(); renderSVG(); };
  const bPump = el("btnPump"); if (bPump) bPump.onclick = togglePump;
  const bValve = el("btnValve"); if (bValve) bValve.onclick = openValveAndFill;
  const bDrain = el("btnDrain"); if (bDrain) bDrain.onclick = startFoamDrainage;
  const bComp = el("btnCompare"); if (bComp) bComp.onclick = () => {
    SFX.play("fanfare"); S.agar.compared = true;
    LabUI.toast("Taqqoslash grafiklari qurildi! Agar-agar koʻpik yashash davrini 3 baravar oshirdi.", "ok");
    renderAll();
  };

  const bNext = el("btnNext"); if (bNext) bNext.onclick = () => { SFX.play("whoosh"); S.stage++; renderAll(); };
  const bPrint = el("btnPrint"); if (bPrint) bPrint.onclick = () => window.print();
  const bReset = el("btnReset"); if (bReset) bReset.onclick = () => { SFX.play("click"); S = createInitialState(); renderAll(); LabUI.toast("Laboratoriya qaytadan boshlandi.", ""); };
}

function renderAll() {
  renderTabs();
  renderPanel();
  renderSVG();
}

/* ============ MODALLAR ============ */
function showIntro() {
  LabUI.modal(`
    <h1>12-laboratoriya ishi: Emulsiyalar va koʻpiklar</h1>
    <p style="color:var(--muted);margin-bottom:10px">Emulsiyalarni olish, tiplarini aniqlash va 8-rasm asbobida koʻpiklarning barqarorligini oʻrganish</p>
    <p>Ushbu laboratoriyada siz ikki xil barqaror emulsiya (benzol va paxta moyi) tayyorlab, ularning tipini (M/S yoki S/M) tajribada aniqlaysiz, soʻng 8-rasm asbobida <b>0,2% Nekal</b> hamda <b>0,2% Agar-agar + 0,2% Nekal</b> koʻpiklarining karraliligi va yashash davrini solishtirasiz.</p>
    <h3>Ish bosqichlari:</h3>
    <ul>
      <li><b>1-bosqich:</b> Benzol (50 ml H₂O + 10 ml benzol + 10 ml 2% sovun) va paxta moyi (4–5 g bura + 95 ml issiq H₂O + 2–3 ml moy) emulsiyalari + suyultirish va metilen koʻki testlari.</li>
      <li><b>2-bosqich:</b> 8-rasm koʻpik asbobida 0,2% Nekal eritmasidan koʻpik olish, har 10 sekundda drenaj V_suy va balandlik H ni oʻlchash («oyna» quriguncha).</li>
      <li><b>3-bosqich:</b> 0,2% Agar-agar + 0,2% Nekal aralashmasida gel pardalar taʼsirini kuzatish va H(t), V_suy(t) grafiklarini solishtirish.</li>
    </ul>
    <div style="margin-top:16px;text-align:right">
      <button class="pri" onclick="LabUI.closeModal();SFX.play('click')">Tajribani boshlash ▶</button>
    </div>
  `);
}

function showTheory() {
  LabUI.modal(`
    <h1>Nazariy maʼlumotlar (12-lab)</h1>
    <h3>1. Emulsiyalar va ularning tiplari</h3>
    <p>Emulsiyalar — oʻzaro aralashmaydigan ikki suyuqlikdan iborat dispers sistemalar. Emulgatorsiz (masalan, suv + benzol) tizim termodinamik beqaror boʻlib, tezda qavatlarga ajraladi. Gidrofil emulgatorlar (2% sovun, yoki bura + moyning erkin yogʻ kislotalaridan hosil boʻlgan sovun) <b>M/S (moy/suv)</b> tipidagi toʻgʻri emulsiyani barqarorlashtiradi.</p>
    <p>Emulsiya tipini aniqlash: <b>suyultirish usuli</b> (M/S tomchisi suvda darhol tarqaladi) va <b>boʻyash usuli</b> (suvda eruvchan metilen koʻki tashqi fazani koʻk rangga boʻyaydi).</p>
    <h3>2. Koʻpiklar va ularning asosiy koʻrsatkichlari</h3>
    <p>Koʻpik — suyuqlik ichida gaz pufakchalari tarqalgan (G/S) konsentrlangan dispers sistema. 0,2% Nekal (butilsulfonaftalinning natriyli tuzi) sirt taranglikni kamaytirib koʻpik hosil qiladi.</p>
    <div class="eq">K = V_koʻpik / V_suy,ichida    |    V_suy,ichida = V_suy,jami − V_suy,ajralgan</div>
    <p>Tajriba boshidan to suyuqlik sirti ochilib <b>«oyna» quriguncha</b> oʻtgan vaqt <b>koʻpikning yashash davri (τ)</b> deb ataladi.</p>
    <h3>3. Gel strukturasi (Agar-agar) taʼsiri</h3>
    <p>0,2% agar-agar koʻpik pardalari ichida uch oʻlchamli elastik <b>gel strukturasi</b> hosil qiladi. Natijada pardalardan suyuqlik oqib tushishi (drenaj / sinerezis) keskin sekinlashadi va koʻpikning yashash davri bir necha baravar uzayadi.</p>
    ${LabUI.refsHTML()}
    <div style="margin-top:14px;text-align:right"><button class="dark" onclick="LabUI.closeModal()">Yopish</button></div>

function showJournal() {
  LabUI.modal(`
    <h1>Laboratoriya jurnali (12-lab)</h1>
    <h3>0,2% Nekal koʻpigi (τ = 120 s, K₀ = 8,0)</h3>

      <thead><tr><th>t, s</th><th>H, cm</th><th>V_suy, ml</th><th>V_ichida, ml</th><th>K</th></tr></thead>
      <tbody>${S.nekal.logs.length ? S.nekal.logs.map(r=>`<tr><td>${r.t}</td><td>${f1(r.H,1)}</td><td>${f1(r.Vsuy,1)}</td><td>${f1(r.VinFoam,1)}</td><td>${r.K?f1(r.K,1):"0"}</td></tr>`).join("") : `<tr><td colspan="5" style="text-align:center">Hali oʻlchanmagan</td></tr>`}</tbody>
    </table>

    <table class="j">
      <thead><tr><th>t, s</th><th>H, cm</th><th>V_suy, ml</th><th>V_ichida, ml</th><th>K</th></tr></thead>
      <tbody>${S.agar.logs.length ? S.agar.logs.map(r=>`<tr><td>${r.t}</td><td>${f1(r.H,1)}</td><td>${f1(r.Vsuy,1)}</td><td>${f1(r.VinFoam,1)}</td><td>${r.K?f1(r.K,1):"0"}</td></tr>`).join("") : `<tr><td colspan="5" style="text-align:center">Hali oʻlchanmagan</td></tr>`}</tbody>
    </table>
    <div style="margin-top:14px;text-align:right"><button class="dark" onclick="LabUI.closeModal()">Yopish</button></div>
  `);
}

function showSmartHint() {
  SFX.play("beep");
  let msg = "";
  if (S.stage === 0) {
    if (S.bzStep < 4) msg = "Benzol silindrini yoki oʻng paneldagi «A. Benzol emulsiyasi» tugmasini bosib 4 bosqichni bajaring.";
    else if (S.oilStep < 4) msg = "«B. Paxta moyi emulsiyasi» boʻlimida bura tortib, 95 ml issiq suvda eriting va 2,5 ml moy qoʻshib chayqating.";
    else msg = "«💧 Suyultirish testi» va «🔵 Metilen koʻki» tugmalarini bosib, soʻng «M/S (moy/suv)» ni tanlang!";
  } else if (S.stage === 1 || S.stage === 2) {
    const f = activeFoamObj();
    if (S.stage === 2 && !f.dosed) msg = "Avval «🧪 Oʻlchov dozatorda aralashma quyish» tugmasini bosing.";
    else if (!f.pumpOn && !f.filled) msg = "1-qadam: «💨 Puflagichni yoqish» tugmasini bosib havo bosimini barqarorlashtiring.";
    else if (!f.filled) msg = "2-qadam: «🔧 Joʻmrakni ochish» tugmasini bosib yigʻgichni 100 ml gacha toʻldiring.";
    else if (!f.done) msg = "3-qadam: «⏱ Havoni toʻxtatish va oʻlchash» tugmasini bosing (×10 yoki ×20 tezlikdan foydalanishingiz mumkin).";
    else if (S.stage === 2 && !f.compared) msg = "«📊 Taqqoslash grafiklarini qurish» tugmasini bosing!";
    else msg = "Bosqich yakunlandi! Savollarga javob berib keyingi bosqichga oʻting.";
  } else {
    msg = "5 ta yakuniy test savoliga javob bering va hisobotni chop eting!";
  }
  LabUI.toast("💡 " + msg, "warn", 4600);
}

/* ============ ANIMATSIYA SIKLI ============ */
let lastTs = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTs) / 1000, 0.08);
  lastTs = now;
  S.t += dt;
  let dirty = false;

  // 1-bosqich animatsiyalari
  if (S.bzShakeT > 0) S.bzShakeT = Math.max(0, S.bzShakeT - dt);
  if (S.oilShakeT > 0) S.oilShakeT = Math.max(0, S.oilShakeT - dt);
  if (S.bzStep === 2 && S.bzShakeT === 0 && S.bzSepProg < 1) {
    S.bzSepProg = Math.min(1, S.bzSepProg + dt * 0.65);
  }

  // 2- va 3-bosqich koʻpik toʻldirish va drenaj
  [["nekal", S.nekal], ["agar", S.agar]].forEach(([kind, f]) => {
    const sp = FOAM_SPEC[kind];
    if (f.valveOpen && !f.filled) {
      f.fillProg = Math.min(1, f.fillProg + dt * 0.48);
      if (f.fillProg >= 1) {
        f.filled = true;
        f.valveOpen = false;
        SFX.play("ok");
        LabUI.toast(`Yigʻgich 100 ml belgisigacha toʻldi! Endi «3. Havoni toʻxtatish va oʻlchash» tugmasini bosing.`, "ok");
        dirty = true;
      }
    }
    if (f.measuring && !f.done) {
      const prevT = f.time;
      f.time = Math.min(sp.tauLife, f.time + dt * S.speed);
      // Jadval nuqtalarini avtomatik qayd etish
      sp.logTimes.forEach(lt => {
        if (lt > prevT && lt <= f.time && !f.logs.some(x => x.t === lt)) {
          f.logs.push(foamStateAt(kind, lt));
          SFX.play("tick");
          dirty = true;
        }
      });
      if (f.time >= sp.tauLife) {
        f.measuring = false;
        f.done = true;
        SFX.play("bell");
        LabUI.toast(`«Oyna» quridi! ${sp.name} koʻpigining yashash davri τ = ${sp.tauLife} s.`, "ok");
        dirty = true;
      } else if (Math.floor(prevT / 2) !== Math.floor(f.time / 2)) {
        dirty = true;
      }
    }
  });

  if (dirty) renderAll();
  else renderSVG();
  requestAnimationFrame(loop);
}

/* ============ INITSIALIZATSIYA ============ */
function init() {
  LabUI.initShell(LAB_ID);
  document.querySelectorAll("footer.lab-foot button[data-sp]").forEach(b => {
    const sp = +b.dataset.sp;
    if (sp === S.speed) b.classList.add("on");
    b.onclick = () => {
      SFX.play("click");
      S.speed = sp;
      document.querySelectorAll("footer.lab-foot button[data-sp]").forEach(x => x.classList.toggle("on", +x.dataset.sp === sp));
      renderPanel();
    };
  });
  el("btnTable").onclick = () => { SFX.play("paper"); showJournal(); };
  el("btnHint").onclick = showSmartHint;
  el("btnTheory").onclick = () => { SFX.play("paper"); showTheory(); };
  renderAll();
  showIntro();
  requestAnimationFrame(loop);
}

init();
</script>
