<script src="../assets/lab-core.js"></script>
<script>
"use strict";

const LAB_ID = 1;
const { el, clamp, lerp, f1, shuf, toast, modal, closeModal } = LabUI;

/* ============ HOLAT (STATE) ============ */
const S = {
  stage: 1,
  unlocked: 1,
  hints: 0,
  pen: { 1: 0, 2: 0, 3: 0 },
  events: [],
  q: {},
  quiz: {},
  // 1-bosqich: S va kanifol gidrozollari (erituvchini almashtirish)
  s1: {
    sDrops: 0,       // S (EtOH) ml (maqsad 4-8 ml)
    kDrops: 0,       // Kanifol 2% (EtOH) ml (maqsad 5-10 ml)
    sShaken: false,
    kShaken: false,
    sTurb: 0,        // 0..1 loyqalik (sutdek oppoq)
    kTurb: 0,
    laser: false,
    laserChecked: false,
    shakeT1: 0,
    shakeT2: 0
  },
  // 2-bosqich: Fe(OH)3 gidrolizi
  s2: {
    heaterOn: false,
    temp: 22.0,
    boiled: false,
    feMl: 0,         // 2% FeCl3 ml (maqsad 5-10 ml)
    solColor: 0,     // 0..1 tiniq qizil-qo'ng'ir
    heaterOffDone: false,
    laser: false,
    micBuilt: false,
    micPick: { core: null, pot: null, cnt: null }
  },
  // 3-bosqich: AgI zoli (A va B seriyalar)
  s3: {
    series: "A",     // "A" (KI ortiqcha) yoki "B" (AgNO3 ortiqcha)
    selVol: 16,      // dozator hajmi: 10, 16, 18, 20 ml
    A: [
      { id: "A1", base: "20 ml 0,05 n KI", target: 16, added: 0, shaken: false, state: "clear", shakeT: 0 },
      { id: "A2", base: "20 ml 0,05 n KI", target: 10, added: 0, shaken: false, state: "clear", shakeT: 0 },
      { id: "A3", base: "20 ml 0,05 n KI", target: 20, added: 0, shaken: false, state: "clear", shakeT: 0 }
    ],
    B: [
      { id: "B1", base: "20 ml 0,05 n AgNO₃", target: 16, added: 0, shaken: false, state: "clear", shakeT: 0 },
      { id: "B2", base: "20 ml 0,05 n AgNO₃", target: 18, added: 0, shaken: false, state: "clear", shakeT: 0 },
      { id: "B3", base: "20 ml 0,05 n AgNO₃", target: 20, added: 0, shaken: false, state: "clear", shakeT: 0 }
    ]
  },
  // Animatsiya zarralari va tomchilari
  anim: {
    t: 0,
    drops: [],       // {x, y, vy, targetY, color, r}
    bubbles: [],     // {x, y, r, vy}
    tyndallPts: []   // {x, y, vx, vy, r}
  }
};

// Tindal zarralarini boshlang'ich to'ldirish
for (let i = 0; i < 48; i++) {
  S.anim.tyndallPts.push({
    x: Math.random(),
    y: Math.random(),
    vx: (Math.random() - 0.5) * 0.14,
    vy: (Math.random() - 0.5) * 0.14,
    r: 1.3 + Math.random() * 1.9
  });
}

/* ============ BOSQICHLAR VA TOPSHIRIQLAR ============ */
const STG = [
  null,
  { s: "S va kanifol", t: "Oltingugurt va kanifol gidrozollari (erituvchini almashtirish)" },
  { s: "Fe(OH)₃ gidroliz", t: "Temir (III) gidroksid zolini gidroliz usulida olish" },
  { s: "AgI zoli (A/B)", t: "Kumush yodid (AgI) manfiy va musbat zollarini olish" },
  { s: "Hisobot", t: "Laboratoriya ishi hisoboti" }
];

const TASKS = {
  1: [
    ["1-kolbaga (100 ml H₂O) oltingugurtning spirtdagi toʻyingan eritmasidan tomchilab qoʻshing (≥ 4 ml) va chayqating", () => S.s1.sDrops >= 4 && S.s1.sShaken],
    ["2-kolbaga (100 ml H₂O) kanifolning 2% li spirtli eritmasidan 5–10 ml tomchilab qoʻshing va qattiq chayqating", () => S.s1.kDrops >= 5 && S.s1.kShaken],
    ["Tindal lazerini yoqib, ikkala sutdek oppoq gidrozolda yorugʻlik sochilishini tekshiring", () => S.s1.laserChecked]
  ],
  2: [
    ["Isitgichni yoqib, kolbadagi 100 ml distillangan suvni 100 °C gacha qaynating", () => S.s2.boiled],
    ["Qaynab turgan suvga 2% li FeCl₃ eritmasidan 5–10 ml tomchilab qoʻshing", () => S.s2.feMl >= 5],
    ["Isitgichni oʻchiring va Fe(OH)₃ zolining mitsella tarkibini yigʻing", () => S.s2.heaterOffDone && S.s2.micBuilt]
  ],
  3: [
    ["A seriya: 20 ml 0,05 n KI kolbalariga mos ravishda 16, 10 va 20 ml 0,05 n AgNO₃ qoʻshib chayqating", () => S.s3.A.every(f => f.shaken)],
    ["B seriya: 20 ml 0,05 n AgNO₃ kolbalariga mos ravishda 16, 18 va 20 ml 0,05 n KI qoʻshib chayqating", () => S.s3.B.every(f => f.shaken)]
  ]
};

const QS = {
  1: [
    {
      id: "q1_1",
      q: "Oltingugurt va kanifolning spirtdagi eritmalari suvga tomizilganda nima uchun kolloid zol hosil boʻladi?",
      o: [
        "Suvda eruvchanlik keskin kamayib, oʻta toʻyingan sistemada kondensatsiyalanish (mayda agregatlar hosil boʻlishi) sodir boʻladi",
        "Etil spirti suv bilan kimyoviy reaksiyaga kirishib choʻkma beradi",
        "Oltingugurt suvda molekulyar holatda toʻliq eriydi",
        "Harorat keskin koʻtarilib, modda bugʻlanib ketadi"
      ],
      a: 0
    },
    {
      id: "q1_2",
      q: "Lazer nuri sutdek oppoq kanifol gidrozolidan oʻtganda yorugʻ konussimon iz koʻrinishi qaysi optik hodisa?",
      o: [
        "Tindal effekti (kolloid zarrachalarda yorugʻlikning sochilishi)",
        "Elektroforez hodisasi",
        "Sedimentatsion muvozanat",
        "Osmotik bosim pasayishi"
      ],
      a: 0
    }
  ],
  2: [
    {
      id: "q2_1",
      q: "Fe(OH)₃ zolini gidroliz usulida olishda nima uchun FeCl₃ qaynab turgan suvga tomiziladi?",
      o: [
        "Yuqori harorat FeCl₃ gidrolizini keskin tezlashtiradi va mayda Fe(OH)₃ yadrolari hosil boʻlishini taʼminlaydi",
        "Sovuq suvda FeCl₃ umuman erimaydi",
        "Qaynoq suvda HCl gazi zolni rangsizlantiradi",
        "Suv qaynasa, eritma sovuqroq boʻlib qoladi"
      ],
      a: 0
    },
    {
      id: "q2_2",
      q: "Gidroliz natijasida olingan qizil-qoʻngʻir Fe(OH)₃ zoli mitsellasining granulasi qanday zaryadga ega?",
      o: [
        "Musbat (+) — chunki yadro sirtiga FeO⁺ (yoki Fe³⁺) ionlari adsorbsiyalanadi",
        "Manfiy (−) — chunki yadro sirtiga OH⁻ ionlari adsorbsiyalanadi",
        "Elektroneytral — zaryadga ega emas",
        "Haroratga qarab har soniyada almashinib turadi"
      ],
      a: 0
    }
  ],
  3: [
    {
      id: "q3_1",
      q: "A seriyada (KI ortiqcha: 20 ml KI + 16 ml AgNO₃) hosil boʻlgan AgI zoli zarrachalarining zaryadi va potensial aniqlovchi ioni qaysi?",
      o: [
        "Manfiy (−); potensial aniqlovchi ion — I⁻",
        "Musbat (+); potensial aniqlovchi ion — Ag⁺",
        "Musbat (+); potensial aniqlovchi ion — K⁺",
        "Manfiy (−); potensial aniqlovchi ion — NO₃⁻"
      ],
      a: 0
    },
    {
      id: "q3_2",
      q: "Nima uchun har ikki seriyaning 3-kolbasida (20 ml KI + 20 ml AgNO₃, ekvimolyar nisbat) barqaror zol emas, balki AgI↓ choʻkmasi tushadi?",
      o: [
        "Ortiqcha elektrolit-stabilizator qolmagani uchun zarrachalar zaryadlanmaydi va koagullanib choʻkadi",
        "Eritma hajmi juda katta boʻlib ketgani uchun",
        "AgNO₃ va KI ekvimolyar nisbatda reaksiyaga kirishmaydi",
        "KNO₃ tuzi AgI ni eritib yuboradi"
      ],
      a: 0
    }
  ]
};

const QZ = [
  ["Kondensatsion usulning mohiyati nimadan iborat?", ["Ion va molekulalarni yiriklashtirib kolloid oʻlchamdagi (1–100 nm) zarrachalar hosil qilish", "Yirik jismlarni tegirmonda maydalash", "Kolloid eritmani membranadan oʻtkazib tozalash", "Zolni sovitib gelga aylantirish"], 0],
  ["Oltingugurt va kanifol gidrozollari kondensatsiyaning qaysi turiga kiradi?", ["Fizik kondensatsiya (erituvchini almashtirish)", "Kimyoviy qaytarilish reaksiyasi", "Elektrolitik peptizatsiya", "Mexanik disperslash"], 0],
  ["FeCl₃ gidrolizi jarayonida yadro sirtida stabilizator vazifasini qaysi birikma bajaradi?", ["FeOCl (FeO⁺ va Cl⁻ ionlariga dissotsilanadi)", "Faqat distillangan suv", "NaCl tuzi", "KNO₃ eritmasi"], 0],
  ["Panet–Fayans qoidasiga koʻra AgI yadrosi sirtiga birinchi navbatda qaysi ionlar adsorbsiyalanadi?", ["Yadro kristall panjarasi tarkibiga kiruvchi ortiqcha ionlar (Ag⁺ yoki I⁻)", "Faqat K⁺ va NO₃⁻ ionlari", "Eritmadagi eng yengil gaz molekulalari", "Faqat gidroksid ionlari"], 0],
  ["AgNO₃ ortiqcha boʻlganda (B seriya) AgI mitsellasi formulasi qanday yoziladi?", ["{[AgI]ₘ · nAg⁺ · (n−x)NO₃⁻}ˣ⁺ · xNO₃⁻", "{[AgI]ₘ · nI⁻ · (n−x)K⁺}ˣ⁻ · xK⁺", "{[AgI]ₘ · nK⁺ · (n−x)I⁻}ˣ⁺ · xI⁻", "{[AgI]ₘ · nNO₃⁻ · (n−x)Ag⁺}ˣ⁻ · xAg⁺"], 0]
];

/* ============ YORDAMCHILAR ============ */
function idx(st) {
  const list = TASKS[st] || [];
  for (let i = 0; i < list.length; i++) if (!list[i][1]()) return i;
  return list.length;
}
function qDone(id) { return S.q[id] && S.q[id].ans !== undefined; }
function stageDone(st) {
  return st >= 1 && st <= 3 && idx(st) >= TASKS[st].length && QS[st].every(q => qDone(q.id));
}
function pen(pts, msg, type = "warn") {
  if (S.stage <= 3) S.pen[S.stage] = (S.pen[S.stage] || 0) + pts;
  S.events.push({ st: S.stage, msg: msg.replace(/<[^>]+>/g, "") });
  toast(msg, type, 3600);
  SFX.play(type === "err" ? "err" : "warn");
}
function spawnDrop(x, y0, y1, color, r = 4.2) {
  S.anim.drops.push({ x, y: y0, vy: 90, targetY: y1, color, r });
}

/* ============ 1-BOSQICH AMALLARI ============ */
function addS() {
  if (S.stage !== 1) return;
  if (S.s1.sDrops >= 8) { toast("Oltingugurt eritmasi yetarlicha qoʻshildi. Kolbani chayqating.", "warn"); return; }
  S.s1.sDrops += 2;
  S.s1.sTurb = clamp(S.s1.sDrops / 6, 0, 1);
  spawnDrop(270, 222, 392, "#f6efaa", 4.5);
  SFX.play("drip");
  toast(`1-kolbaga +2 ml S (EtOH) qoʻshildi (jami ${S.s1.sDrops} ml).`, "", 1800);
  renderPanel();
}
function addK() {
  if (S.stage !== 1) return;
  if (S.s1.kDrops >= 10) { toast("Kanifol eritmasi yetarlicha qoʻshildi (10 ml). Kolbani chayqating.", "warn"); return; }
  S.s1.kDrops += 2.5;
  S.s1.kTurb = clamp(S.s1.kDrops / 7.5, 0, 1);
  spawnDrop(545, 222, 392, "#f3d9a4", 4.5);
  SFX.play("drip");
  toast(`2-kolbaga +2,5 ml kanifol (2% EtOH) qoʻshildi (jami ${f1(S.s1.kDrops, 1)} ml).`, "", 1800);
  renderPanel();
}
function shakeS1(which) {
  if (S.stage !== 1) return;
  if (which === 1) {
    if (S.s1.sDrops < 4) { pen(0.5, "Avval 1-kolbaga kamida 4 ml oltingugurt eritmasidan tomizing.", "warn"); return; }
    S.s1.sShaken = true;
    S.s1.sTurb = 0.88;
    S.s1.shakeT1 = 1.1;
    SFX.play("shake");
    toast("✓ 1-kolba chayqatildi — sutdek oppoq shaffof oltingugurt gidrozoli hosil boʻldi!", "ok");
  } else {
    if (S.s1.kDrops < 5) { pen(0.5, "Avval 2-kolbaga 5–10 ml kanifol (2% EtOH) eritmasidan tomizing.", "warn"); return; }
    S.s1.kShaken = true;
    S.s1.kTurb = 0.96;
    S.s1.shakeT2 = 1.1;
    SFX.play("shake");
    toast("✓ 2-kolba chayqatildi — sutdek oppoq barqaror kanifol gidrozoli olindi!", "ok");
  }
  renderPanel();
}
function toggleLaser1() {
  S.s1.laser = !S.s1.laser;
  SFX.play("click");
  if (S.s1.laser && S.s1.sShaken && S.s1.kShaken) {
    S.s1.laserChecked = true;
    SFX.play("ok");
    toast("🔦 Tindal konusi aniq koʻrindi! Kolloid zarrachalar (1–100 nm) lazer nurini sochmoqda.", "ok", 3800);
  } else if (S.s1.laser) {
    toast("Lazer yoqildi. Tiniq suvda nur sochilmaydi — avval zollarni tayyorlab chayqating.", "", 2600);
  }
  renderPanel();
}

/* ============ 2-BOSQICH AMALLARI ============ */
function toggleHeater2() {
  if (S.stage !== 2) return;
  S.s2.heaterOn = !S.s2.heaterOn;
  SFX.play(S.s2.heaterOn ? "heat" : "click");
  if (!S.s2.heaterOn && S.s2.feMl >= 5) {
    S.s2.heaterOffDone = true;
    SFX.play("ok");
    toast("✓ Isitgich oʻchirildi. Tiniq qizil-qoʻngʻir Fe(OH)₃ zoli tayyor!", "ok");
  } else if (S.s2.heaterOn) {
    toast("Isitgich yoqildi — 100 ml distillangan suv qizimoqda...", "", 2200);
  }
  renderPanel();
}
function heatQuick2() {
  if (S.stage !== 2) return;
  S.s2.heaterOn = true;
  S.s2.temp = 100;
  S.s2.boiled = true;
  SFX.play("boil");
  toast("✓ Suv 100 °C da qaynayapti! Endi 2% li FeCl₃ eritmasidan 5–10 ml tomizing.", "ok");
  renderPanel();
}
function addFeCl3() {
  if (S.stage !== 2) return;
  if (S.s2.temp < 95) {
    pen(1, "Xato: suv hali qaynamagan (" + f1(S.s2.temp, 0) + " °C)! Avval suvni 100 °C gacha qaynating.", "err");
    return;
  }
  if (S.s2.feMl >= 10) {
    toast("10 ml 2% FeCl₃ qoʻshildi (yetarli). Endi isitgichni oʻchiring.", "warn");
    return;
  }
  S.s2.feMl += 2;
  S.s2.solColor = clamp(S.s2.feMl / 8, 0, 1);
  spawnDrop(440, 190, 345, "#c46818", 4.6);
  SFX.play("drip");
  if (S.s2.feMl >= 6 && S.s2.feMl < 8) {
    SFX.play("ok");
    toast(`✓ ${S.s2.feMl} ml 2% FeCl₃ qoʻshildi — eritma tiniq qizil-qoʻngʻir rangga kirdi!`, "ok");
  } else {
    toast(`+${2} ml 2% FeCl₃ tomizildi (jami ${S.s2.feMl} ml).`, "", 1800);
  }
  renderPanel();
}
function pickMic2(part, val) {
  S.s2.micPick[part] = val;
  SFX.play("click");
  const p = S.s2.micPick;
  if (p.core && p.pot && p.cnt) {
    if (p.core === "Fe(OH)3" && p.pot === "FeO+" && p.cnt === "Cl-") {
      S.s2.micBuilt = true;
      SFX.play("ok");
      toast("✓ Mitsella toʻgʻri yigʻildi: {m[Fe(OH)₃] · nFeO⁺ · (n−x)Cl⁻}ˣ⁺ · xCl⁻", "ok", 3800);
    } else {
      pen(0.5, "Mitsella tarkibida xatolik bor. Qayta tekshiring: yadro — Fe(OH)₃, potensial aniqlovchi ion — FeO⁺, qarama-qarshi ion — Cl⁻.", "warn");
      S.s2.micPick = { core: null, pot: null, cnt: null };
    }
  }
  renderPanel();
}
function toggleLaser2() {
  S.s2.laser = !S.s2.laser;
  SFX.play("click");
  renderPanel();
}

/* ============ 3-BOSQICH AMALLARI ============ */
function setSeries3(ser) {
  S.s3.series = ser;
  SFX.play("click");
  renderPanel();
}
function setVol3(v) {
  S.s3.selVol = v;
  SFX.play("click");
  renderPanel();
}
function dispense3(idxF) {
  if (S.stage !== 3) return;
  const ser = S.s3.series;
  const fl = S.s3[ser][idxF];
  if (fl.shaken) {
    toast(`${fl.id} kolbasi allaqachon tayyor (${fl.target} ml qoʻshilgan).`, "", 2000);
    return;
  }
  if (S.s3.selVol !== fl.target) {
    pen(0.5, `${fl.id} kolbasiga metodik koʻrsatma boʻyicha aynan <b>${fl.target} ml</b> qoʻshish kerak (siz ${S.s3.selVol} ml tanladingiz).`, "warn");
    return;
  }
  fl.added = fl.target;
  fl.shaken = true;
  fl.shakeT = 1.1;
  fl.state = fl.target === 20 ? "precip" : (ser === "A" ? "neg" : "pos");
  const fx = [245, 485, 725][idxF];
  spawnDrop(fx, 195, 360, "#dce8ee", 5);
  SFX.play("pour");
  setTimeout(() => SFX.play("shake"), 260);
  if (fl.state === "precip") {
    toast(`⚠️ ${fl.id} (20 ml + 20 ml ekvimolyar): stabilizator ortiqcha emas → sariq <b>AgI↓ choʻkmasi</b> tushdi!`, "warn", 3800);
  } else if (fl.state === "neg") {
    toast(`✓ ${fl.id}: KI ortiqcha → barqaror <b>manfiy (−) AgI zoli</b> hosil boʻldi!`, "ok", 3200);
  } else {
    toast(`✓ ${fl.id}: AgNO₃ ortiqcha → barqaror <b>musbat (+) AgI zoli</b> hosil boʻldi!`, "ok", 3200);
  }
  renderPanel();
}

/* ============ SVG SAHNA CHIZISH ============ */
function benchBaseSVG(titleText) {
  return `
  <defs>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3d5d2"/><stop offset="100%" stop-color="#a5beba"/>
    </linearGradient>
    <linearGradient id="tableG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#607b7e"/><stop offset="100%" stop-color="#3c5356"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">

function flatFlaskPath(cx, cy) {
  // Tagi yassi kolba (markazi cx, tagi cy)
  return `M${cx - 22},${cy - 175} L${cx - 22},${cy - 115} C${cx - 72},${cy - 92} ${cx - 78},${cy - 30} ${cx - 60},${cy} L${cx + 60},${cy} C${cx + 78},${cy - 30} ${cx + 72},${cy - 92} ${cx + 22},${cy - 115} L${cx + 22},${cy - 175} Z`;
}
function flatLiqPath(cx, cy) {
  return `M${cx - 65},${cy - 68} C${cx - 74},${cy - 42} ${cx - 73},${cy - 18} ${cx - 58},${cy - 3} L${cx + 58},${cy - 3} C${cx + 73},${cy - 18} ${cx + 74},${cy - 42} ${cx + 65},${cy - 68} Z`;
}
function conicalFlaskPath(cx, cy) {
  return `M${cx - 20},${cy - 165} L${cx - 20},${cy - 110} L${cx - 74},${cy - 6} Q${cx - 76},${cy} ${cx - 66},${cy} L${cx + 66},${cy} Q${cx + 76},${cy} ${cx + 74},${cy - 6} L${cx + 20},${cy - 110} L${cx + 20},${cy - 165} Z`;
}
function conicalLiqPath(cx, cy, h = 62) {
  const topW = lerp(68, 22, h / 106);
  return `M${cx - topW},${cy - h} L${cx - 70},${cy - 5} Q${cx - 71},${cy - 2} ${cx - 64},${cy - 2} L${cx + 64},${cy - 2} Q${cx + 71},${cy - 2} ${cx + 70},${cy - 5} L${cx + topW},${cy - h} Z`;
}

function sceneClick(t) {
  SFX.init();
  if (t === "botS") addS();
  else if (t === "botK") addK();
  else if (t === "flask1") shakeS1(1);
  else if (t === "flask2") shakeS1(2);
  else if (t === "laser1") toggleLaser1();
  else if (t === "heater2") toggleHeater2();

/* ============ SAVOLLAR VA PANEL ============ */
function qBlock(Q, seed) {
  const q = S.q[Q.id] || {};
  return `<div class="q"><p>${Q.q}</p>${shuf(Q.o.length, seed).map(oi => {
    let c = "";
    if (q.ans !== undefined && oi === Q.a) c = "right";
    else if (q.wrong && q.wrong.includes(oi)) c = "wrong";
    return `<button class="${c}" onclick="ansQ('${Q.id}',${oi})" ${q.ans !== undefined || (q.wrong && q.wrong.includes(oi)) ? "disabled" : ""}>${Q.o[oi]}</button>`;
  }).join("")}</div>`;
}
function ansQ(id, i) {
  let Q;
  for (const k in QS) { Q = QS[k].find(x => x.id === id); if (Q) break; }
  const q = S.q[id] || (S.q[id] = { tries: 0, wrong: [], pts: 0 });
  if (q.ans !== undefined) return;
  q.tries++;
  if (i === Q.a) {
    q.ans = i;
    q.pts = q.tries === 1 ? 2 : 1;
    SFX.play("ok");
    toast("✓ Toʻgʻri javob!", "ok", 1600);
  } else {
    q.wrong.push(i);
    if (q.tries >= 2) {
      q.ans = Q.a;
      SFX.play("warn");
      toast("Toʻgʻri javob koʻrsatildi. 📘 Nazariyani koʻzdan kechiring.", "warn", 2600);
    } else {
      SFX.play("err");
      toast("✗ Notoʻgʻri. Yana bir bor urinib koʻring.", "err", 1800);
    }
  }
  renderPanel();
}
function tasksHTML(st) {
  const cur = idx(st);
  return `<ul class="tasks">${TASKS[st].map((t, k) => `<li class="${k < cur ? "done" : k === cur ? "cur" : ""}"><span class="b">${k < cur ? "✓" : k + 1}</span><span>${t[0]}</span></li>`).join("")}</ul>`;
}

/* ============ BAHOLASH VA HISOBOT ============ */
function total() {
  let proc = 0;
  for (let k = 1; k <= 3; k++) {
    const tDone = idx(k) / TASKS[k].length;
    proc += Math.max(0, 15 * tDone - (S.pen[k] || 0));
  }
  const allQ = [1, 2, 3].flatMap(k => QS[k].map(q => q.id));
  const qp = allQ.reduce((s, id) => s + ((S.q[id] && S.q[id].pts) || 0), 0);
  const qsScore = 30 * qp / (allQ.length * 2);
  const qzScore = QZ.filter((q, i) => S.quiz[i] === q[2]).length * 5;
  const hp = Math.min(5, S.hints * 0.5);
  return {
    proc: Math.round(proc),
    qs: Math.round(qsScore),
    qz: qzScore,
    hp,
    tot: clamp(Math.round(proc + qsScore + qzScore - hp), 0, 100)
  };
}

function quizA(qi, oi) {

/* ============ NAVIGATSIYA VA PROGRESS ============ */
function goStage(n) {
  if (n > S.unlocked) return;
  S.stage = n;
  SFX.play("paper");
  renderPanel();
  el("panel").scrollTop = 0;
}
function nextStage() {
  const n = S.stage + 1;
  if (n > S.unlocked) S.unlocked = n;
  goStage(n);
}
function renderTabs() {
  el("tabs").innerHTML = STG.slice(1).map((x, i) => {
    const n = i + 1;
    const d = n <= 3 ? stageDone(n) : Object.keys(S.quiz).length === QZ.length;
    return `<button class="${n === S.stage ? "cur" : ""} ${d ? "done" : ""}" ${n > S.unlocked ? "disabled" : ""} onclick="goStage(${n})" title="${x.t}">${d ? "✓ " : ""}${n} · ${x.s}</button>`;
  }).join("");
  const sc = total().tot;
  el("chip").textContent = sc + " ball";
  const isDone = stageDone(1) && stageDone(2) && stageDone(3);
  LabProgress.save(LAB_ID, sc, isDone);
}

    <p><b>KI ortiqcha (A seriya — manfiy zol):</b></p>
    <div class="eq">{[AgI]ₘ · nI⁻ · (n−x)K⁺}ˣ⁻ · xK⁺</div>
    <p><b>AgNO₃ ortiqcha (B seriya — musbat zol):</b></p>
    <div class="eq">{[AgI]ₘ · nAg⁺ · (n−x)NO₃⁻}ˣ⁺ · xNO₃⁻</div>
    <p>Ekvimolyar nisbatda (20 ml + 20 ml) ortiqcha stabilizator qolmaydi va AgI choʻkmaga tushadi.</p>
    ${LabUI.refsHTML()}
    <div class="row" style="margin-top:14px"><button class="pri" onclick="closeModal()">Yopish</button></div>`);
}

function showJournal() {
  modal(`<h1>📋 Laboratoriya jurnali</h1>
    <table class="j">
      <tr><th>Bosqich</th><th>Holat</th><th>Jarima</th></tr>
      <tr><td>1 · S va kanifol zoli</td><td>S: ${S.s1.sDrops} ml, Kanifol: ${f1(S.s1.kDrops, 1)} ml, Tindal: ${S.s1.laserChecked ? "✓" : "—"}</td><td>${S.pen[1]}</td></tr>
      <tr><td>2 · Fe(OH)₃ gidroliz</td><td>T=${f1(S.s2.temp, 0)} °C, FeCl₃: ${S.s2.feMl} ml, Mitsella: ${S.s2.micBuilt ? "✓" : "—"}</td><td>${S.pen[2]}</td></tr>
      <tr><td>3 · AgI zoli (A & B)</td><td>A: ${S.s3.A.filter(f => f.shaken).length}/3, B: ${S.s3.B.filter(f => f.shaken).length}/3</td><td>${S.pen[3]}</td></tr>
    </table>
    ${S.events.length ? `<h3>Qayd etilgan ogohlantirishlar</h3><ul>${S.events.map(e => `<li>${e.st}-bosqich: ${e.msg}</li>`).join("")}</ul>` : "<p class='note' style='margin-top:10px'>Hozircha xatolik qayd etilmagan.</p>"}
    <div class="row" style="margin-top:14px"><button class="pri" onclick="closeModal()">Yopish</button></div>`);
}

function smartHint() {
  S.hints++;
  SFX.play("beep");
  let msg = "";
  if (S.stage === 1) {
    if (S.s1.sDrops < 4) msg = "1-kolbaga kamida 4 ml oltingugurt (S) spirtli eritmasini tomizing.";
    else if (!S.s1.sShaken) msg = "1-kolbani bosib yoki «Chayqatish» tugmasini bosib aralashtiring.";
    else if (S.s1.kDrops < 5) msg = "2-kolbaga 5–10 ml kanifolning 2% li eritmasini tomizing.";
    else if (!S.s1.kShaken) msg = "2-kolbani qattiq chayqating — sutdek oppoq barqaror zol olinadi.";
    else if (!S.s1.laserChecked) msg = "Tindal lazerini yoqing va zollarda yorugʻ konussimon izni kuzating.";
    else msg = "Pastdagi 2 ta savolga javob bering va 2-bosqichga oʻting.";
  } else if (S.stage === 2) {
    if (!S.s2.boiled) msg = "Isitgichni yoqib, kolbadagi 100 ml suvni 100 °C gacha qaynating (yoki «100 °C ga yetkazish» tugmasini bosing).";
    else if (S.s2.feMl < 5) msg = "Qaynab turgan suvga 2% li FeCl₃ eritmasidan kamida 5–10 ml tomizing.";
    else if (!S.s2.heaterOffDone) msg = "Zol tayyor! Endi isitgichni oʻchiring.";
    else if (!S.s2.micBuilt) msg = "Mitsella konstruktorida: Yadro = Fe(OH)₃, Potensial aniqlovchi = FeO⁺, Qarama-qarshi = Cl⁻ tanlang.";
    else msg = "Bosqich savollariga javob bering va 3-bosqichga oʻting.";
  } else if (S.stage === 3) {
    const ser = S.s3.series;
    const rem = S.s3[ser].find(f => !f.shaken);
    if (rem) msg = `${ser} seriyada ${rem.id} kolbasi uchun dozatorda ${rem.target} ml ni tanlab kolbaga quying.`;
    else if (!S.s3.B.every(f => f.shaken)) msg = "Yuqoridagi «B seriya (20 ml AgNO₃)» tugmasiga oʻtib, 16, 18 va 20 ml KI quying.";
    else if (!S.s3.A.every(f => f.shaken)) msg = "«A seriya» ga qaytib barcha kolbalarni yakunlang.";
    else msg = "Savollarga javob bering va yakuniy hisobotga oʻting.";
  } else {
    msg = "Hisobotdagi 5 ta yakuniy nazorat savolini bajaring va natijani chop eting.";
  }
  toast("💡 " + msg, "warn", 4200);
  renderTabs();
}

/* ============ ANIMATSIYA SIKLI (rAF) ============ */
let lastTs = 0;
function tick(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  S.anim.t += dt;

  // 1-bosqich chayqatish va Tindal zarralari
  if (S.stage === 1) {
    if (S.s1.shakeT1 > 0) {
      S.s1.shakeT1 = Math.max(0, S.s1.shakeT1 - dt);
      const ang = Math.sin(S.s1.shakeT1 * 34) * 9 * (S.s1.shakeT1 / 1.1);
      const f1g = el("flask1Wrap");
      if (f1g) f1g.setAttribute("transform", `translate(270,478) rotate(${ang.toFixed(1)},0,-70)`);
    }
    if (S.s1.shakeT2 > 0) {
      S.s1.shakeT2 = Math.max(0, S.s1.shakeT2 - dt);
      const ang = Math.sin(S.s1.shakeT2 * 34) * 9 * (S.s1.shakeT2 / 1.1);
      const f2g = el("flask2Wrap");
      if (f2g) f2g.setAttribute("transform", `translate(545,478) rotate(${ang.toFixed(1)},0,-70)`);
    }
    const td = el("tyndallDots1");
    if (td && S.s1.laser) {
      let dots = "";
      S.anim.tyndallPts.forEach((p, idxP) => {
        p.x = (p.x + p.vx * dt + 1) % 1;
        p.y = (p.y + p.vy * dt + 1) % 1;
        if (idxP < 24 && S.s1.sTurb > 0.2) {
          const cx = 212 + p.x * 116, cy = 414 + p.y * 14;
          dots += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r.toFixed(1)}" fill="#fff5f7" opacity="${(0.45 + 0.45 * Math.sin(S.anim.t * 6 + idxP)).toFixed(2)}"/>`;
        } else if (idxP >= 24 && S.s1.kTurb > 0.2) {
          const cx = 488 + p.x * 116, cy = 412 + p.y * 17;
          dots += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r.toFixed(1)}" fill="#fff5f7" opacity="${(0.45 + 0.45 * Math.sin(S.anim.t * 6 + idxP)).toFixed(2)}"/>`;
        }
      });
      td.innerHTML = dots;
    }
  }

  // 2-bosqich qizish va qaynash pufakchalari
  if (S.stage === 2) {
    let tempChanged = false;
    if (S.s2.heaterOn && S.s2.temp < 100) {
      S.s2.temp = Math.min(100, S.s2.temp + dt * 13);
      tempChanged = true;
      if (S.s2.temp >= 99.6 && !S.s2.boiled) {
        S.s2.temp = 100;
        S.s2.boiled = true;
        SFX.play("boil");
        toast("✓ Suv 100 °C da qaynayapti! Endi 2% li FeCl₃ eritmasidan 5–10 ml tomizing.", "ok");
        renderPanel();
      }
    } else if (!S.s2.heaterOn && S.s2.temp > 25) {
      S.s2.temp = Math.max(25, S.s2.temp - dt * 3.5);
      tempChanged = true;
    }
    if (tempChanged) {
      const tt = el("tempTxt2");
      if (tt) tt.textContent = Math.round(S.s2.temp) + "°C";
      const mb = el("mercBar2");
      if (mb) {
        const mh = clamp((S.s2.temp - 15) / 95 * 145, 6, 152);
        mb.setAttribute("y", (178 - mh).toFixed(1));
        mb.setAttribute("height", mh.toFixed(1));
      }
    }
    const bg = el("boilBubbles2");
    if (bg) {
      if (S.s2.temp >= 88) {
        if (Math.random() < (S.s2.temp >= 98 ? 0.45 : 0.14)) {
          S.anim.bubbles.push({ x: (Math.random() - 0.5) * 90, y: -4, r: 2 + Math.random() * 3.2, vy: 36 + Math.random() * 38 });
        }
      }
      S.anim.bubbles = S.anim.bubbles.filter(b => {
        b.y -= b.vy * dt;
        return b.y > -64;
      });
      bg.innerHTML = S.anim.bubbles.map(b => `<circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${b.r.toFixed(1)}" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"/>`).join("");
    }
  }

  // 3-bosqich kolbalar chayqalishi
  if (S.stage === 3) {
    const xs = [245, 485, 725];
    S.s3[S.s3.series].forEach((fl, i) => {
      if (fl.shakeT > 0) {
        fl.shakeT = Math.max(0, fl.shakeT - dt);
        const ang = Math.sin(fl.shakeT * 32) * 8 * (fl.shakeT / 1.1);
        const g = el("agFlask" + i);
        if (g) g.setAttribute("transform", `translate(${xs[i]},478) rotate(${ang.toFixed(1)},0,-70)`);
      }
    });
  }

  // Tushayotgan tomchilar (barcha bosqichlar)
  const fx = el("fxLayer");
  if (fx && S.anim.drops.length) {
    S.anim.drops = S.anim.drops.filter(d => {
      d.vy += 420 * dt;
      d.y += d.vy * dt;
      return d.y < d.targetY;
    });
    fx.innerHTML = S.anim.drops.map(d => `<ellipse cx="${d.x}" cy="${d.y.toFixed(1)}" rx="${d.r * 0.78}" ry="${d.r * 1.25}" fill="${d.color}" stroke="#5c4218" stroke-width="0.8"/>`).join("");
  } else if (fx && fx.innerHTML) {
    fx.innerHTML = "";
  }

  requestAnimationFrame(tick);
}

/* ============ ISHGA TUSHIRISH ============ */
LabUI.initShell(LAB_ID);
el("btnTable").addEventListener("click", showJournal);
el("btnHint").addEventListener("click", smartHint);
el("btnTheory").addEventListener("click", showTheory);
renderPanel();
showIntro();
requestAnimationFrame(tick);
</script>
