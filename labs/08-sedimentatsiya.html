  noise(d,o={}){const c=this.ctx;if(!c)return;const t=c.currentTime+(o.delay||0),n=Math.max(1,Math.floor(c.sampleRate*(d+.06))),b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=o.ft||"lowpass";f.frequency.setValueAtTime(o.f||1000,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);f.Q.value=o.q||1;const g=c.createGain();this.env(g,t,o.a||.01,d,o.v||.1);s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+d+.06)},
  play(n){this.init();if(!this.on||!this.ctx)return;const T=this;switch(n){

/* ===================== FIZIKA ===================== */
const PH={g:9.81,eta:1.0e-3,d:2700,d1:1000};
const K=Math.sqrt(9*PH.eta/(2*(PH.d-PH.d1)*PH.g));            // m^½·s^½
const LIQ=14.1, PX=11, BOT=452;                                 // 1 l sathi (sm), px/sm, stakan tubi
const PTS=[15,30,60,120,180,240,360,480,600,780,960,1200,1500,1800,2100,2400]; // o'lchov nuqtalari, s
const rnd=(a,b)=>a+Math.random()*(b-a);
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const BINS=(()=>{const a=[],n=70,r0=4,r1=25,med=10.5,sg=.42;let s=0;for(let i=0;i<n;i++){const r=r0+(r1-r0)*(i+.5)/n,w=Math.exp(-Math.pow(Math.log(r/med),2)/(2*sg*sg))/r;a.push({r,w});s+=w}a.forEach(b=>b.w/=s);return a})();
const tOf=(r,H)=>(H/100)*K*K/Math.pow(r*1e-6,2);               // r µm → t s
const rOf=(t,H)=>K*Math.sqrt((H/100)/t)*1e6;                    // t s → r µm
function mass(t,H){if(t<=0)return 0;let m=0;for(const b of BINS)m+=b.w*Math.min(1,t/tOf(b.r,H));return S.Q*m}
function interc(t,H){let m=0;for(const b of BINS)if(tOf(b.r,H)<=t)m+=b.w;return S.Q*m}

function nice(max){const e=Math.pow(10,Math.floor(Math.log10(max))),f=max/e;return (f<=1.5?.2:f<=3?.5:f<=7?1:2)*e}
function axes(x,y,w,h,xm,ym,xl,yl){
  const X=v=>x+v/xm*w,Y=v=>y+h-v/ym*h;let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fbfdfc" stroke="#9fb9b6" rx="3"/>`;
  const sx=nice(xm),sy=nice(ym);
  for(let v=0;v<=xm+1e-9;v+=sx)s+=`<line x1="${X(v)}" y1="${y}" x2="${X(v)}" y2="${y+h}" stroke="#e3ecea"/><text x="${X(v)}" y="${y+h+12}" text-anchor="middle" font-size="9" fill="#5f7b7f">${+v.toFixed(2)}</text>`;
  for(let v=0;v<=ym+1e-9;v+=sy)s+=`<line x1="${x}" y1="${Y(v)}" x2="${x+w}" y2="${Y(v)}" stroke="#e3ecea"/><text x="${x-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#5f7b7f">${+v.toFixed(2)}</text>`;
  s+=`<text x="${x+w}" y="${y+h+24}" text-anchor="end" font-size="10" font-weight="600" fill="#14292c">${xl}</text><text x="${x+4}" y="${y-5}" font-size="10" font-weight="600" fill="#14292c">${yl}</text>`;
  return {s,X,Y};
}
function sedChart(x,y,w,h,opt={}){
  const tm=40,mmax=Math.max(10,S.Q*1.1);const A=axes(x,y,w,h,tm,mmax,"t, min","m, mg");let s=A.s;
  const pts=S.rd.filter(r=>r.v.length).map(r=>({t:r.t/60,m:avg(r.v)-S.p0}));
  if(opt.model){let d="";for(let i=0;i<=120;i++){const t=Math.pow(i/120,2)*tm*60;d+=(i?"L":"M")+A.X(t/60)+" "+A.Y(mass(t,S.H))}s+=`<path d="${d}" fill="none" stroke="#9fb9b6" stroke-width="1.5" stroke-dasharray="4 3"/>`}
  if(pts.length>1)s+=`<path d="M${A.X(0)} ${A.Y(0)} ${pts.map(p=>`L${A.X(p.t)} ${A.Y(p.m)}`).join(" ")}" fill="none" stroke="#1d4a50" stroke-width="2"/>`;
  s+=pts.map(p=>`<circle cx="${A.X(p.t)}" cy="${A.Y(p.m)}" r="3.4" fill="#f2a541" stroke="#1d1405"/>`).join("");
  if(opt.marks){for(const [k,c] of [["tmin","#2e9d6a"],["tmax","#d64545"]])if(S.A[k]){const xx=A.X(S.A[k]/60);s+=`<line x1="${xx}" y1="${y}" x2="${xx}" y2="${y+h}" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 3"/><text x="${xx+3}" y="${y+12}" font-size="10" font-weight="700" fill="${c}">${k==="tmin"?"t_min":"t_max"}</text>`}}
  if(opt.tang&&S.A.tab){const cid="cpS"+x+"_"+y;s+=`<clipPath id="${cid}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${cid})">`;S.A.tab.bounds.forEach((b,i)=>{const t=b.t,m=mass(t,S.H),sl=(mass(t*1.001,S.H)-m)/(t*.001),ic=m-sl*t;const t2=Math.min(tm*60,t*2.2+120);s+=`<line x1="${A.X(0)}" y1="${A.Y(ic)}" x2="${A.X(t2/60)}" y2="${A.Y(ic+sl*t2)}" stroke="#7b5cc4" stroke-width="1.1" opacity=".85"/><circle cx="${A.X(0)}" cy="${A.Y(ic)}" r="2.6" fill="#7b5cc4"/><circle cx="${A.X(t/60)}" cy="${A.Y(m)}" r="2.6" fill="#fff" stroke="#7b5cc4"/>`});s+=`</g>`}
  if(opt.title)s+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#14292c">${opt.title}</text>`;
  return s;
}
function diffChart(x,y,w,h){
  const tb=S.A.tab;if(!tb)return"";const ym=Math.max(...tb.rows.map(r=>r.pd))*1.2;const A=axes(x,y,w,h,30,ym,"r, µm","p/Δr, %/µm");let s=A.s;
  tb.rows.forEach((r,i)=>{s+=`<rect x="${A.X(r.r2)}" y="${A.Y(r.pd)}" width="${A.X(r.r1)-A.X(r.r2)}" height="${A.Y(0)-A.Y(r.pd)}" fill="${i===tb.mp?"#f2a541":"#8fc9bf"}" stroke="#1d4a50" opacity=".9"/>`});
  const mids=tb.rows.map(r=>({x:(r.r1+r.r2)/2,y:r.pd})).sort((a,b)=>a.x-b.x);
  s+=`<path d="M${A.X(Math.max(0,mids[0].x-(tb.rows[0].dr)))} ${A.Y(0)} ${mids.map(m=>`L${A.X(m.x)} ${A.Y(m.y)}`).join(" ")} L${A.X(Math.min(30,mids[mids.length-1].x+tb.rows[0].dr))} ${A.Y(0)}" fill="none" stroke="#d64545" stroke-width="2"/>`;
  s+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#14292c">Differensial taqsimlanish egri chizigʻi</text>`;
  return s;
}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function drawChart(){const c=el("chart");if(!c)return;
  if(S.stage===4&&S.sim.started)c.innerHTML=`<rect x="590" y="16" width="402" height="256" rx="10" fill="rgba(255,255,255,.55)"/>`+sedChart(625,40,350,205,{title:"Choʻkish egri chizigʻi m = f(t)"});

function drawRuler(on){const g=el("rul");if(!g)return;if(!on){g.setAttribute("opacity",0);return}
  const ly=BOT-LIQ*PX,py=BOT-S.hb*PX;let s=`<rect x="392" y="${BOT-170}" width="18" height="170" fill="#f0d27a" stroke="#a78b2f"/>`;

  s+=`<line x1="430" y1="${ly}" x2="430" y2="${py-7}" stroke="#d64545" stroke-width="2" marker-end=""/><path d="M426 ${ly+6} L430 ${ly} L434 ${ly+6}M426 ${py-13} L430 ${py-7} L434 ${py-13}" fill="none" stroke="#d64545" stroke-width="2"/><text x="425" y="${(ly+py)/2}" text-anchor="end" font-size="12" font-weight="800" fill="#d64545">H</text>`;
  s+=`<line x1="438" y1="${py}" x2="438" y2="${BOT}" stroke="#2e9d6a" stroke-width="2"/><text x="425" y="${(py+BOT)/2+4}" text-anchor="end" font-size="10" font-weight="700" fill="#2e9d6a">h</text>`;
  g.innerHTML=s;g.setAttribute("opacity",1)}

function startSW(){if(S.sim.started){toast("Sekundomer ishlamoqda.","",1200);return}const i=S.L.sed||0;if(i<3){pen(1,"Kosacha suspenziyaga tushirilmagan — vaqtni hisoblashni boshlab boʻlmaydi.","err");return}
  const dl=(performance.now()-S.stir.end)/1000;if(dl>20)pen(1.5,`Aralashtirishdan keyin ${Math.round(dl)} s oʻtdi — yirik zarrachalar oʻlchovsiz choʻkib ulgurdi. Zudlik bilan ishlang!`,"warn");
  S.sim.started=true;S.sim.run=true;S.sim.t=0;S.sim.pi=0;SFX.play("beep");toast("⏱ START! Birinchi oʻlchov 15 s da.","ok");sedCheck();drawChart();renderPanel()}
function recRead(){
  const sm=S.sim;if(!sm.frozen){toast("Oʻlchov faqat belgilangan vaqtlarda olinadi.","warn",1800);return}
  if(!S.arr){pen(.3,"Arretir yopiq — avval 3 ni oʻngga suring.","warn");return}
  if(!aligned()){pen(.3,"Koʻrsatgich 9 chiziq 8 bilan mos emas.","warn");return}
  const t=PTS[sm.pi];let r=S.rd.find(x=>x.t===t);if(!r){r={t,v:[],tr:[]};S.rd.push(r)}
  r.v.push(S.lever);r.tr.push(load());SFX.play("beep");
  if(r.v.length<2){sm.noise=gauss()*.22;toast(`1-oʻlchov: ${f1(S.lever)} mg. Muvozanatni qayta tekshirib, 2-oʻlchovni oling.`,"",2400);renderPanel();return}
  toast(`t = ${tLbl(t)}: p = ${f1(avg(r.v),2)} mg (oʻrtacha)`,"ok",2000);
  sm.pi++;sm.frozen=false;sm.noise=0;drawChart();
  if(sm.pi>=PTS.length){finishSed(true);return}
  renderPanel();
}
function plateau(){const rr=S.rd.filter(r=>r.v.length>=2);if(rr.length<2)return false;const a=rr[rr.length-1],b=rr[rr.length-2];return a.t-b.t>=300&&a.t>=1800&&Math.abs(avg(a.v)-avg(b.v))<.6}
function finishSed(auto){
  if(!auto&&!plateau()){pen(1.5,"Hali barqaror emas: oxirgi ikki (5 min oraliqdagi) natija mos kelishi kerak.","warn");return}
  S.sim.done=true;S.sim.run=false;S.sim.frozen=false;SFX.play("fanfare");okT("Tajriba tugatildi! Egri chiziq tuzildi — savollarga javob bering.",3800);sedCheck();drawChart();renderPanel();
}
function setSpeed(v){S.sim.speed=v;SFX.play("click");document.querySelectorAll("footer [data-sp]").forEach(b=>b.classList.toggle("on",+b.dataset.sp===v))}

/* ===================== 5-BOSQICH: HISOBLASH ===================== */
const AQ={
 a1:{q:"K doimiysi qaysi formula bilan hisoblanadi?",o:["K = √( 9η / (2(d − d₁)g) )","K = 9η / (2(d − d₁)g)","K = √( 2(d − d₁)g / 9η )","K = 6πηr"],a:0},
 a2:null,
 a5:{q:"Zarracha radiusi cho'kish vaqti boʻyicha qanday topiladi?",o:["r = K·√(H/t)","r = K·H/t","r = K·√(t/H)","r = H/(K·t)"],a:0},
 a8:{q:"Stoks qonunini qoʻllashning sharti qaysi?",o:["Zarrachalar sharsimon, qattiq, bir-biriga taʼsir qilmaydi, harakat laminar (kichik Re) va tezlik oʻzgarmas","Zarrachalar har qanday shaklda, konsentratsiya istalgancha","Faqat 1 nm dan kichik zarrachalar","Suyuqlik qaynab turishi kerak"],a:0}
};
function buildA2(){const v=K;AQ.a2={q:`η = 1,0·10⁻³ Pa·s, d = 2700 kg/m³, d₁ = 1000 kg/m³, g = 9,81 m/s² boʻlsa, K = ?`,o:[fsci(v)+" m½·s½",fsci(v*v)+" m·s",fsci(v*31.6)+" m½·s½",fsci(1/v,2)+" m⁻½·s⁻½"],a:0}}
buildA2();for(const k in AQ)AQ[k].id=k;
function pickT(k,t){
  const q=S.q[k]||(S.q[k]={tries:0,wrong:[],pts:0});if(q.ans!==undefined)return;q.tries++;
  const tr=k==="tmin"?tOf(25,S.H):tOf(BINS[0].r,S.H);const ok=k==="tmin"?(t>=tr/1.75&&t<=tr*1.75):(t>=tr/1.28&&t<=tr*1.28);
  if(ok){q.ans=t;q.pts=q.tries===1?2:1;S.A[k]=t;okT("Toʻgʻri!",1400)}
  else{q.wrong.push(t);if(q.tries>=2){const best=PTS.filter(p=>S.rd.find(r=>r.t===p)).reduce((a,b)=>Math.abs(Math.log(b/tr))<Math.abs(Math.log(a/tr))?b:a);q.ans=best;S.A[k]=best;toast(`Toʻgʻri javob: ${tLbl(best)}. ${k==="tmin"?"t_min — egri chiziqning toʻgʻri chiziqdan ajralish nuqtasi.":"t_max — egri chiziq gorizontal boʻladigan nuqta."}`,"warn",4500)}else{toast(k==="tmin"?"✗ Notoʻgʻri. t_min — boshlangʻich toʻgʻri chiziqli qism tugaydigan vaqt.":"✗ Notoʻgʻri. t_max — massa oʻzgarmay qoladigan (egri gorizontallashadigan) vaqt.","err",2600);SFX.play("err")}}
  drawChart();renderPanel();
}
function setFr(n){if(S.A.tab)return;S.A.nfr=n;SFX.play("click");renderPanel()}
function doTang(){
  const n=S.A.nfr,H=S.H,rmax=rOf(S.A.tmin,H),rmin=rOf(S.A.tmax,H),dr=(rmax-rmin)/n;const Qt=mass(PTS[PTS.length-1]*3,H);
  const bounds=[];for(let j=0;j<=n;j++){const r=rmax-j*dr;bounds.push({r,t:tOf(r,H)})}
  const rows=[];for(let j=0;j<n;j++){let m=interc(bounds[j+1].t,H)-interc(bounds[j].t,H);if(j===0)m+=interc(bounds[0].t,H);if(j===n-1)m+=Qt-interc(bounds[n].t,H);const p=m/Qt*100;rows.push({i:j+1,r1:bounds[j].r,r2:bounds[j+1].r,dr,p,pd:p/dr,t1:bounds[j].t,t2:bounds[j+1].t})}
  let mp=0;rows.forEach((r,i)=>{if(r.pd>rows[mp].pd)mp=i});
  S.A.tab={rmax,rmin,bounds,rows,mp};S.A.tang=true;
  const others=rows.map((_,i)=>i).filter(i=>i!==mp).sort(()=>Math.random()-.5).slice(0,3);
  S.A.mpOpts=[mp,...others].sort(()=>Math.random()-.5);
  SFX.play("paper");setTimeout(()=>SFX.play("ok"),300);toast("✏️ Urinmalar oʻtkazildi, 14-jadval toʻldirildi.","ok");drawChart();renderPanel();
}
function ansMP(i){const q=S.q.a7||(S.q.a7={tries:0,wrong:[],pts:0});if(q.ans!==undefined)return;q.tries++;if(i===S.A.tab.mp){q.ans=i;q.pts=q.tries===1?2:1;okT("Toʻgʻri!",1400)}else{q.wrong.push(i);if(q.tries>=2){q.ans=S.A.tab.mp;toast("Javob koʻrsatildi: p/Δr eng katta boʻlgan fraksiya.","warn")}else{toast("✗ Notoʻgʻri. Differensial egrining maksimumiga qarang.","err");SFX.play("err")}}renderPanel()}

function shuf(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qBlock(Q,seed){const q=S.q[Q.id]||{};const ord=shuf(Q.o.length,seed);
  return `<div class="q"><p>${Q.q}</p>${ord.map(oi=>{let c="";if(q.ans!==undefined&&oi===Q.a)c="right";else if(q.wrong&&q.wrong.includes(oi))c="wrong";return `<button class="${c}" onclick="ansQ('${Q.id}',${oi})" ${q.ans!==undefined||(q.wrong&&q.wrong.includes(oi))?"disabled":""}>${Q.o[oi]}</button>`}).join("")}</div>`}
function findQ(id){for(const k in QS){const f=QS[k].find(q=>q.id===id);if(f)return f}return AQ[id]}
function ansQ(id,i){const Q=findQ(id),q=S.q[id]||(S.q[id]={tries:0,wrong:[],pts:0});if(q.ans!==undefined)return;q.tries++;
  if(i===Q.a){q.ans=i;q.pts=q.tries===1?2:1;okT("Toʻgʻri!",1300)}else{q.wrong.push(i);if(q.tries>=2){q.ans=Q.a;toast("Javob koʻrsatildi. Nazariyani koʻrib chiqing (📘).","warn");SFX.play("warn")}else{toast("✗ Notoʻgʻri. Yana bir urinish.","err",1800);SFX.play("err")}}renderPanel()}
const qDone=id=>S.q[id]&&S.q[id].ans!==undefined;

      if(i>=3)h+=leverBox(`<button class="pri" onclick="recP0()" ${S.p0!==null?"disabled":""}>✍️ p₀ ni yozish</button>`);

function readTable(short){

function analysisPanel(){
  let h=`<div class="sub">Choʻkish egri chizigʻi boʻyicha zarrachalar radiusi va fraksion tarkibni aniqlang.</div>`;
  h+=`<div class="box"><h4>1 · K doimiysi</h4>${qBlock(AQ.a1,51)}${qDone("a1")?qBlock(AQ.a2,52):""}</div>`;

  if(qDone("a5")){const rmax=rOf(S.A.tmin,S.H),rmin=rOf(S.A.tmax,S.H);h+=`<div class="eq">r_max = K√(H/t_min) = ${fsci(K)}·√(${f1(S.H/100,3)}/${S.A.tmin}) = ${f1(rmax)} µm</div><div class="eq">r_min = K√(H/t_max) = ${fsci(K)}·√(${f1(S.H/100,3)}/${S.A.tmax}) = ${f1(rmin)} µm</div>`}
  h+=`</div>`;if(!qDone("a5"))return h;

  if(S.A.tab){const tb=S.A.tab;h+=`<table class="j" style="margin-top:8px"><tr><th>№</th><th>r, µm</th><th>Δr</th><th>p, %</th><th>p/Δr</th></tr>${tb.rows.map((r,i)=>`<tr class="${qDone("a7")&&i===tb.mp?"hl":""}"><td>${r.i}</td><td>${f1(r.r1)}–${f1(r.r2)}</td><td>${f1(r.dr,2)}</td><td>${f1(r.p)}</td><td>${f1(r.pd,2)}</td></tr>`).join("")}</table><div class="note" style="margin-top:4px">14-jadval. p — urinmalarning m oʻqidan kesgan kesmalari farqi / m_max.</div>`}
  h+=`</div>`;if(!S.A.tab)return h;
  const q7=S.q.a7||{};
  h+=`<div class="box"><h4>5 · Differensial egri chiziq</h4><div class="q"><p>Suspenziyada eng koʻp uchraydigan zarrachalar radiusi qaysi oraliqda?</p>${S.A.mpOpts.map(i=>{const r=S.A.tab.rows[i];let c="";if(q7.ans!==undefined&&i===S.A.tab.mp)c="right";else if(q7.wrong&&q7.wrong.includes(i))c="wrong";return `<button class="${c}" onclick="ansMP(${i})" ${q7.ans!==undefined||(q7.wrong&&q7.wrong.includes(i))?"disabled":""}>${f1(r.r2)} – ${f1(r.r1)} µm</button>`}).join("")}</div></div>`;
  if(!qDone("a7"))return h;
  h+=`<div class="box"><h4>6 · Nazariy savol</h4>${qBlock(AQ.a8,58)}</div>`;
  return h;
}
function stageDone(st){
  if(st===1)return (S.L.cal||0)>=CAL.length&&QS[1].every(q=>qDone(q.id));
  if(st===2)return S.ai>=PREP.length&&QS[2].every(q=>qDone(q.id));
  if(st===3)return (S.L.geo||0)>=GEO.length&&QS[3].every(q=>qDone(q.id));
  if(st===4)return (S.L.sed||0)>=SED.length&&QS[4].every(q=>qDone(q.id));
  if(st===5)return ["a1","a2","tmin","tmax","a5","a7","a8"].every(qDone);
  return false;
}
function nextStage(){const n=S.stage+1;if(n>S.unlocked)S.unlocked=n;goStage(n)}
const DEF={1:{pan:null,b1x:470,b2x:600,b2s:true},2:{pan:null,b1x:470,b2x:600,b2s:true},3:{pan:null,b1x:470,b2x:600,b2s:true},4:{pan:"up",b1x:600,b2x:470,b2s:true},5:{pan:"b1",b1x:470,b2x:760,b2s:false},6:{pan:null,b1x:470,b2x:600,b2s:false}};
S.saved={};
function goStage(n){if(n>S.unlocked)return;
  if(S.sim.run&&!S.sim.done&&n!==4){toast("Choʻkish tajribasi davom etmoqda — avval uni tugating.","warn");return}
  S.saved[S.stage]={pan:S.pan,b1x:S.b1.x,b2x:S.b2.x,b2s:S.b2.show};
  S.stage=n;S.glow=null;S.arr=false;
  const d=S.saved[n]||DEF[n];S.pan=d.pan;S.b1.x=d.b1x;S.b2.x=d.b2x;S.b2.show=d.b2s;
  if(n>=4){S.b1.tlv=LIQ;S.b2.tlv=LIQ;if(S.b1.turb<.5)S.b1.turb=.8}
  svg.innerHTML=sceneHTML();bindScene();S.b1.lv=S.b1.tlv;S.b2.lv=S.b2.tlv;drawChart();if(n===3&&S.pan==="b2"&&S.H===null)drawRuler(true);renderPanel();$("#panel").scrollTop=0;SFX.play("whoosh");
  document.querySelectorAll("footer [data-sp]").forEach(b=>b.style.display=n===4?"":"none");document.querySelector("footer .lbl").style.display=n===4?"":"none";
}
function bindScene(){svg.querySelectorAll("[data-t]").forEach(g=>g.addEventListener("click",e=>{e.stopPropagation();sceneClick(g.dataset.t)}))}
function sceneClick(t){
  SFX.init();const st=S.stage;
  if(t==="arr"){toggleArr();return}
  if(t==="s1"||t==="s2"){if(st===1)screw(+t[1],S["s"+t[1]]>0?-1:1);return}
  if(t==="z7"){if(st===1)z7(S.e0+S.z7>0?-.2:.2);return}
  if(t==="lev"){toast("Richag 4 ni paneldagi slayder yoki ← → tugmalari bilan suring.","",2000);return}
  if(st===2){prepUse(t);return}
  if(st===3){geoUse(t);return}
  if(st===4){sedUse(t);return}
}
function renderTabs(){
  $("#tabs").innerHTML=STG.slice(1).map((x,i)=>{const n=i+1,d=n<=5&&stageDone(n);return `<button class="${n===S.stage?"cur":""} ${d?"done":""}" ${n>S.unlocked?"disabled":""} onclick="goStage(${n})" title="${x.t}">${d?"✓ ":""}${n}·${x.s}</button>`}).join("");
  $("#chip").textContent=total().tot+" ball";
}

/* ===================== BAHOLASH ===================== */
function total(){
  const base={1:10,2:10,3:8,4:12};let proc=0;for(const k in base){const done=k<S.unlocked||stageDone(+k);proc+=done?Math.max(0,base[k]-(S.pen[k]||0)):0}
  const all=[...QS[1],...QS[2],...QS[3],...QS[4]].map(q=>q.id).concat(["a1","a2","tmin","tmax","a5","a7","a8"]);
  const qp=all.reduce((s,id)=>s+((S.q[id]&&S.q[id].pts)||0),0),qmax=all.length*2;
  const errs=[];S.rd.forEach(r=>r.v.forEach((v,i)=>errs.push(Math.abs(v-r.tr[i]))));
  const me=errs.length?avg(errs):null;const compl=clamp(S.rd.filter(r=>r.v.length>=2).length/13,0,1);
  const acc=me===null?0:20*clamp(1-(me-.15)/.85,0,1)*compl;
  const qz=QZ.filter((q,i)=>S.quiz[i]===q[2]).length*2;
  const hp=Math.min(5,S.hints*.5);
  return {proc:Math.round(proc),acc:Math.round(acc),qs:Math.round(30*qp/qmax),qz,hp,me,tot:clamp(Math.round(proc+acc+30*qp/qmax+qz-hp),0,100)};
}
function report(){
  const g=total(),mark=g.tot>=86?"aʼlo (5)":g.tot>=71?"yaxshi (4)":g.tot>=56?"qoniqarli (3)":"qoniqarsiz (2)";const tb=S.A.tab;
  const chart=`<svg viewBox="0 0 420 240" style="width:100%;background:#fff;border-radius:8px">${sedChart(48,22,355,180,{marks:1,tang:1})}</svg>`;
  const dchart=tb?`<svg viewBox="0 0 420 240" style="width:100%;background:#fff;border-radius:8px;margin-top:8px">${diffChart(48,22,355,180)}</svg>`:"";
  return `<div class="rep"><h2>Laboratoriya ishi natijalari</h2>
  <div class="sub">8-laboratoriya ishi · Sedimentatsion analiz. Zarrachaning choʻkish tezligi va oʻlchamini topish<br>${new Date().toLocaleDateString("uz-UZ")}</div>
  <div class="score"><div class="n">${g.tot}</div><div>/100 ball<br><b>${mark}</b></div></div>
  <div class="box"><h4>Ball tarkibi</h4>
   <div class="kv"><span>Tajriba texnikasi (sozlash, tayyorlash, oʻlchash tartibi)</span><b>${g.proc}/40</b></div>
   <div class="kv"><span>Oʻlchovlar aniqligi (oʻrt. xato ${g.me!==null?f1(g.me,2)+" mg":"—"})</span><b>${g.acc}/20</b></div>
   <div class="kv"><span>Bosqich savollari va hisoblashlar</span><b>${g.qs}/30</b></div>
   <div class="kv"><span>Nazorat savollari</span><b>${g.qz}/10</b></div>
   ${g.hp?`<div class="kv"><span>Maslahatlar (${S.hints})</span><b>−${g.hp}</b></div>`:""}</div>
  <div class="box"><h4>Boshlangʻich maʼlumotlar</h4><div class="kv"><span>Suspenziya</span><b>tal'k, 0,5% (5 g / 1 l)</b></div><div class="kv"><span>H</span><b>${f1(S.H)} sm</b></div><div class="kv"><span>p₀</span><b>${f1(S.p0)} mg</b></div><div class="kv"><span>η; d; d₁</span><b>1,0·10⁻³ Pa·s; 2700; 1000 kg/m³</b></div><div class="kv"><span>K</span><b>${fsci(K)} m½·s½</b></div></div>
  ${readTable(false)}
  <div class="box"><h4>Choʻkish egri chizigʻi</h4>${chart}${tb?`<div class="kv" style="margin-top:6px"><span>t_min / t_max</span><b>${tLbl(S.A.tmin)} / ${tLbl(S.A.tmax)}</b></div><div class="kv"><span>r_max / r_min</span><b>${f1(tb.rmax)} / ${f1(tb.rmin)} µm</b></div>`:""}</div>
  ${tb?`<div class="box"><h4>14-jadval · fraksion tarkib</h4><table class="j"><tr><th>№</th><th>r, µm</th><th>Δr, µm</th><th>p, %</th><th>p/Δr</th></tr>${tb.rows.map((r,i)=>`<tr class="${i===tb.mp?"hl":""}"><td>${r.i}</td><td>${f1(r.r2)}–${f1(r.r1)}</td><td>${f1(r.dr,2)}</td><td>${f1(r.p)}</td><td>${f1(r.pd,2)}</td></tr>`).join("")}</table>${dchart}<div class="note" style="margin-top:6px">Eng koʻp uchraydigan radius: <b>${f1(tb.rows[tb.mp].r2)}–${f1(tb.rows[tb.mp].r1)} µm</b></div></div>`:""}
  ${S.events.length?`<div class="box"><h4>Xatolar va ogohlantirishlar</h4><ul style="padding-left:18px;font-size:13px;line-height:1.5">${S.events.map(e=>`<li>${e.st}-bosqich: ${e.msg}</li>`).join("")}</ul></div>`:""}
  <div class="box"><h4>Nazorat savollari</h4>${QZ.map((q,qi)=>`<div class="q"><p>${qi+1}. ${q[0]}</p>${q[1].map((o,oi)=>{const a=S.quiz[qi];let c="";if(a!==undefined){if(oi===q[2])c="right";else if(oi===a)c="wrong"}return `<button class="${c}" onclick="quizA(${qi},${oi})" ${a!==undefined?"disabled":""}>${o}</button>`}).join("")}</div>`).join("")}</div>
  <div class="box"><h4>Xulosa</h4><div class="note">Vintli tarozida suspenziya zarrachalarining kosachaga choʻkishi kuzatildi va choʻkish egri chizigʻi m = f(t) tuzildi. Egri chiziq boshida toʻgʻri chiziqli (barcha fraksiyalar bir vaqtda choʻkadi), soʻng egilib, t_max dan keyin gorizontal boʻladi. Stoks qonuni asosida r = K√(H/t) formulasi bilan r_max va r_min hisoblandi, urinmalar usulida fraksiyalarning nisbiy massasi topildi va differensial taqsimlanish egri chizigʻi tuzildi. Uning maksimumi suspenziyadagi eng koʻp uchraydigan zarracha oʻlchamini koʻrsatadi; egri chiziq kengligi esa sistemaning polidispersligini tavsiflaydi.</div></div>
  <div class="row noprint"><button class="dark" onclick="window.print()">🖨 Hisobotni PDF / chop etish</button><button class="ghost" onclick="if(confirm('Ishni qaytadan boshlaysizmi?'))location.reload()">↺ Qaytadan</button></div></div>`;
}
function quizA(q,i){if(S.quiz[q]!==undefined)return;S.quiz[q]=i;SFX.play(i===QZ[q][2]?"ok":"err");renderPanel()}

/* ===================== MODALLAR ===================== */
function modal(h){$("#modalCard").innerHTML=h;$("#modal").classList.add("on")}
function closeModal(){$("#modal").classList.remove("on")}
function intro(){modal(`<h1>⚖️ Sedimentatsion analiz</h1><p style="color:#5f7b7f">8-laboratoriya ishi · Zarrachaning choʻkish tezligini va oʻlchamini topish</p>
 <h3>Ishning maqsadi</h3><p>Sedimentatsion analiz usulining mohiyati bilan tanishish, vintli tarozida suspenziya zarrachalarining choʻkishini kuzatish, choʻkish egri chizigʻini tuzish va undan zarrachalar oʻlchami hamda fraksion tarkibni aniqlash.</p>
 <h3>Bosqichlar</h3><ul>${STG.slice(1).map((s,i)=>`<li><b>${i+1}.</b> ${s.t}</li>`).join("")}</ul>
 <h3>Jihozlar</h3><p>Vintli (sedimentatsion) tarozi, kosacha, 1 l li 2 ta stakan, chinni hovoncha va pestik, shisha tayoqcha, sekundomer, oʻlchov silindri, chizgʻich, texnik tarozi. Reaktivlar: tal'k, distillangan suv.</p>
 <h3>Qanday ishlaydi</h3><ul><li>Sahnadagi asboblarni bosing; tarozining raqamlangan qismlari (1–9) darslikdagi 32-rasmga mos.</li><li>Richag 4 ni panel slayderi yoki klaviatura (← →) bilan suring, koʻrsatgich 9 <b style="color:#1fa463">yashil</b> boʻlsa — muvozanat.</li><li>Choʻkish tajribasida vaqtni tezlashtirish mumkin; har bir oʻlchov nuqtasida vaqt toʻxtaydi.</li><li>🔊 Ovoz effektlari bor — ovozni pastki paneldan oʻchirish mumkin.</li></ul>
 <div class="row" style="margin-top:16px"><button class="pri" style="padding:12px 18px" onclick="closeModal();SFX.play('fanfare')">Laboratoriyaga kirish →</button></div>
 <p class="note" style="margin-top:12px">Simulyatsiya — jarayonning soddalashtirilgan taʼlimiy modeli. Har safar yangi tasodifiy namuna yaratiladi.</p>`)}
function theory(){modal(`<h1>📘 Nazariya</h1>
 <h3>Sedimentatsiya</h3><p>Sedimentatsiya — dispers faza zarrachalarining ogʻirlik kuchi taʼsirida choʻkishi. Zarrachaga ogʻirlik kuchi (Arximed kuchi ayirilgan) va Stoks ishqalanish kuchi taʼsir etadi; ular tenglashganda zarracha <b>oʻzgarmas tezlikda</b> choʻkadi:</p>
 <div class="eq">⁴⁄₃πr³(d − d₁)g = 6πηru   ⇒   u = 2r²(d − d₁)g / 9η</div>
 <p>Tezlik u = H/t ekanidan:</p><div class="eq">r = √( 9ηH / (2(d − d₁)g·t) ) = K·√(H/t),   K = √( 9η / (2(d − d₁)g) )</div>
 <p>Bu yerda η — suyuqlik qovushqoqligi (Pa·s), d va d₁ — zarracha va suyuqlik zichliklari (kg/m³), g = 9,81 m/s², H — choʻkish balandligi (m), t — vaqt (s).</p>
 <h3>Stoks qonunining qoʻllanish shartlari</h3><ul><li>zarrachalar sharsimon va qattiq; bir-biriga taʼsir qilmaydi (suyultirilgan suspenziya, ≈ 0,5–1%);</li><li>harakat laminar, tezlik oʻzgarmas; zarracha radiusi ≈ 1–100 µm;</li><li>juda mayda zarrachalarda Broun harakati xalaqit beradi — ular uchun sentrifuga ishlatiladi.</li></ul>
 <h3>Choʻkish egri chizigʻi</h3><p>Kosachaga choʻkkan massa m = f(t). Polidispers sistemada boshida barcha fraksiyalar choʻkadi — egri chiziq toʻgʻri (0 … t_min). Yirik zarrachalar tugagach qiyalik kamayadi, t_max dan soʻng m = const.</p>
 <p><b>Urinmalar usuli:</b> egri chiziqning t nuqtasiga oʻtkazilgan urinma m oʻqidan S(t) kesmani kesadi — bu t gacha <i>toʻliq</i> choʻkib boʻlgan (r ≥ r(t)) zarrachalar massasi. Ikki urinma kesmalari farqi — ular orasidagi fraksiya massasi.</p>
 <div class="eq">p_i = (S(t_{i+1}) − S(t_i)) / m_max · 100%,   F(r) = p_i / Δr_i</div>
 <h3>Differensial taqsimlanish egri chizigʻi</h3><p>Absissada r, ordinatada p/Δr. Maksimum — eng koʻp uchraydigan radius; egri qanchalik tor boʻlsa, sistema shunchalik monodispersga yaqin.</p>
 <h3>Adabiyotlar</h3><ul style="font-size:13px"><li>Axmedov K.S., Raximov X.R. Kolloid ximiya. T., 1992.</li><li>Fridrixsberg D.A. Kurs kolloidnoy ximii. L., 1974.</li><li>Frolov Yu.G. Kurs kolloidnoy ximii. M., 1989.</li><li>Baranova V.I. Raschyoti i zadachi po kolloidnoy ximii. M., 1989.</li></ul>
 <div class="row" style="margin-top:16px"><button class="pri" onclick="closeModal()">Yopish</button></div>`)}
function tableModal(){modal(`<h1>📋 Oʻlchov jurnali</h1>${S.rd.length?readTable(false):"<p>Hali oʻlchovlar yoʻq.</p>"}<div class="row" style="margin-top:12px"><button class="pri" onclick="closeModal()">Yopish</button></div>`)}
function hint(){
  S.hints++;const st=S.stage;let m="Panel savollariga javob bering; 📘 Nazariyada formulalar bor.";
  if(st===1){const i=S.L.cal||0;m=["Pufakchani markazga keltiring: 1 va 2 vintlarni navbat bilan buring.","«Maxsus yukni osish» tugmasini bosing.","Arretir 3 ni oʻngga suring (sahnadagi sariq dumaloqcha).","Richagni 0 mg ga qoʻying (−10 tugmasi yoki slayder).","Vint 7: koʻrsatgich chap tomonda boʻlsa «+», oʻngda boʻlsa «−».","Arretirni yoping."][i]||m;S.glow=["s1",null,"arr","lev","z7","arr"][i]||null}
  if(st===2&&S.ai<PREP.length){const a=PREP[S.ai];S.glow=a.t;m=S.weighOn?"0,5% → 100 g eritmada 0,5 g modda; 1000 g da — 5 g.":`Keyingi asbob: <b>${TN[a.t]}</b> (yoritildi).`}
  if(st===3){const i=S.L.geo||0;m=["Sahnada «2 · toza suv» stakanini bosing.","Paneldagi «Ilgakka ilish» tugmasi.","Slayder bilan h ni 2–3 sm qiling, soʻng «H ni oʻlchash».","Arretirni oching, richagni koʻrsatgich yashil boʻlguncha suring.","Arretirni yoping, soʻng «Kosachani koʻtarish»."][i]||m;S.glow=i===0?"b2":i===2?"ruler":null}
  if(st===4){const i=S.L.sed||0;m=["Aralashtirishni boshlang va 2–3 minutda toʻxtating.","1-stakanni bosing.","«Kosachani tushirish».","«START» ni bosing.","Vaqt toʻxtaganda: arretir ochiq, richag bilan muvozanat, «Yozish» ×2. Muvozanat taxminan p₀ + choʻkma massasi atrofida."][i]||m;S.glow=i===1?"b1":i===3?"sw":null}
  if(st===5)m="t_min — egri toʻgʻri chiziqdan ajraladigan, t_max — gorizontallashadigan nuqta. r = K√(H/t).";
  toast("💡 "+m,"",6000);SFX.play("click");
}

/* ===================== ISHGA TUSHIRISH ===================== */
$("#btnHint").onclick=hint;$("#btnTheory").onclick=()=>{SFX.play("paper");theory()};$("#btnTable").onclick=()=>{SFX.play("paper");tableModal()};
$("#btnSnd").onclick=()=>{SFX.on=!SFX.on;$("#btnSnd").textContent=SFX.on?"🔊 Ovoz":"🔇 Ovoz";if(SFX.on)SFX.play("click")};
$("#btnFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
document.querySelectorAll("footer [data-sp]").forEach(b=>b.onclick=()=>setSpeed(+b.dataset.sp));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("pointerdown",()=>SFX.init(),{once:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft"||e.key==="ArrowRight"){if([1,3,4].includes(S.stage)){e.preventDefault();setLever(S.lever+(e.key==="ArrowLeft"?-1:1)*(e.shiftKey?1:.1))}}});
let last=performance.now(),chartT=0;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;frame(dt);chartT+=dt;if(chartT>.5){chartT=0;if(S.stage===4&&S.sim.run)drawChart();if(S.stage===4&&S.sim.run&&!S.sim.frozen){const p=$("#panel");const kv=p.querySelector(".box .kv b");if(kv)kv.textContent=tLbl(Math.round(S.sim.t))}}requestAnimationFrame(loop)}
setSpeed(5);goStage(1);intro();requestAnimationFrame(loop);
if(window.KKBridge){KKBridge.mount(8);const _rt=renderTabs;renderTabs=function(){_rt();KKBridge.save(8,total().tot,S.stage>5||stageDone(5));};renderTabs();}
</script>
