  V: 0.050,          // har bir probirkadagi eritma hajmi, L (50 ml)
  m: 0.50,           // faollashtirilgan koʻmir massasi, g
  M_KMnO4: 158.03,   // KMnO4 molyar massasi, g/mol
  eps: 2200,         // molyar yutilish koeffitsiyenti, L/(mol·cm) λ=525 nm da
  pathL: 0.1,        // kyuvet qalinligi, cm (1 mm)
  AinfTrue: 0.520,   // haqiqiy chegaraviy adsorbsiya, mmol/g
  Ktrue: 650,        // Langmyur adsorbsiya doimiysi, L/mol
  NA: 6.02214e23,    // Avogadro soni, mol⁻¹

};

// Har bir C0 uchun Langmyur tenglamasi va massa balansi orqali muvozanat konsentratsiyasini hisoblash
function solveLangmuirEq(C0, noise = 1) {
  const r = PHYS.V / PHYS.m; // 0.100 L/g
  const Ainf = (PHYS.AinfTrue / 1000) * noise; // mol/g
  const K = PHYS.Ktrue;
  const a = r * K;
  const b = r + Ainf * K - r * K * C0;
  const c = -r * C0;
  const Ceq = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
  const A_mol = (C0 - Ceq) * r;
  const A_mmol = A_mol * 1000;
  const A_mg = A_mmol * PHYS.M_KMnO4;
  return { Ceq, A_mmol, A_mg };
}

// KMnO4 eritmasining konsentratsiyasiga qarab haqiqiy binafsha-pushti rangi
function kmno4Color(C, alpha = 0.88) {
  const t = clamp(Math.log10(Math.max(C, 1e-5) / 0.00015) / Math.log10(0.010 / 0.00015), 0, 1);
  const r = Math.round(lerp(245, 92, t));
  const g = Math.round(lerp(185, 10, t));
  const b = Math.round(lerp(225, 118, t));
  return `rgba(${r},${g},${b},${alpha})`;
}
function kmno4Hex(C) {
  const t = clamp(Math.log10(Math.max(C, 1e-5) / 0.00015) / Math.log10(0.010 / 0.00015), 0, 1);
  const r = Math.round(lerp(244, 90, t));
  const g = Math.round(lerp(178, 12, t));
  const b = Math.round(lerp(222, 118, t));
  return `rgb(${r},${g},${b})`;
}

/* ============ HOLAT (STATE) ============ */
function createInitialState() {
  // Kichik real laboratoriya tarqoqligi (±1.2%)
  const noises = [0.992, 1.008, 0.996, 1.004];
  const samples = C0_LIST.map((C0, i) => {
    const D0 = +(PHYS.eps * PHYS.pathL * C0).toFixed(3);
    const eq = solveLangmuirEq(C0, noises[i]);
    const Dq = +(PHYS.eps * PHYS.pathL * eq.Ceq).toFixed(3);
    const CeqMeas = +(Dq / (PHYS.eps * PHYS.pathL)).toFixed(6);
    const A_mmol = +((C0 - CeqMeas) * PHYS.V / PHYS.m * 1000).toFixed(3);
    const A_mg = +(A_mmol * PHYS.M_KMnO4).toFixed(2);
    return {
      idx: i,
      label: `#${i + 1}`,
      C0,
      D0,
      Dq,
      Ceq: CeqMeas,
      A_mmol,
      A_mg,
      prepared: false,
      calDone: false,
      charcoalAdded: false,
      separated: false,
      specDone: false
    };
  });
  return {
    stage: 0,
    speed: 5,
    samples,
    // 1-bosqich
    activeTube: -1,
    pouring: null,       // {idx, prog}
    specActive: null,    // {idx, mode:'base'|'eq', prog, val}

    seed: 1142,

}

let S = createInitialState();

/* ============ CHIZIQLI REGRESSIYA (LANGMYUR) ============ */
function computeLangmuirFit() {
  const ready = S.samples.filter(s => s.specDone);
  if (ready.length < 2) return null;
  // x = C_eq (mmol/L), y = C_eq / A (g/L)
  const pts = ready.map(s => {
    const x = s.Ceq * 1000; // mmol/L
    const y = x / Math.max(s.A_mmol, 1e-6); // g/L
    return { x, y, Ceq: s.Ceq, A: s.A_mmol, idx: s.idx };
  });
  const n = pts.length;
  const sx = pts.reduce((a, p) => a + p.x, 0);
  const sy = pts.reduce((a, p) => a + p.y, 0);
  const sxy = pts.reduce((a, p) => a + p.x * p.y, 0);
  const sxx = pts.reduce((a, p) => a + p.x * p.x, 0);
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1); // 1 / A_inf (g/mmol)
  const intercept = (sy - slope * sx) / n; // 1 / (A_inf * K_mM) (g/L)
  const A_inf = 1 / slope; // mmol/g
  const K_mM = slope / Math.max(intercept, 1e-6); // L/mmol
  const K_M = K_mM * 1000; // L/mol
  // R^2
  const yMean = sy / n;
  let ssTot = 0, ssRes = 0;
  pts.forEach(p => {
    const yh = slope * p.x + intercept;
    ssTot += (p.y - yMean) ** 2;
    ssRes += (p.y - yh) ** 2;
  });
  const R2 = 1 - ssRes / (ssTot || 1);
  const S_sol = (A_inf / 1000) * PHYS.NA * PHYS.S0; // m^2/g
  return { pts, slope, intercept, A_inf, K_M, K_mM, R2, S_sol };
}

/* ============ BALL HISOBLASH (100 BALL) ============ */
function total() {
  const prepCount = S.samples.filter(s => s.prepared).length;
  const calCount = S.samples.filter(s => s.calDone).length;
  const p1 = Math.round(prepCount * 1.5 + calCount * 1.5); // 12

  const chCount = S.samples.filter(s => s.charcoalAdded).length;
  const p2 = Math.round(chCount * 1.5) + (S.shaken ? 2 : 0) + (S.bathDone ? 4 : 0); // 12

  const sepCount = S.samples.filter(s => s.separated).length;
  const specCount = S.samples.filter(s => s.specDone).length;
  const p3 = (sepCount === 4 ? 4 : 0) + specCount * 2; // 12

  const p4 = (S.plottedIso ? 3 : 0) + (S.plottedLin ? 3 : 0) + (S.calcSurface ? 4 : 0); // 10

  const prac = p1 + p2 + p3 + p4; // 46

  let sq = 0;
  Object.values(STAGE_QS).flat().forEach(q => { if (S.ans[q.id] === q.ok) sq += 3; }); // 8*3 = 24

  let fq = 0;
  FINAL_QUIZ.forEach(q => { if (S.ans[q.id] === q.ok) fq += 6; }); // 5*6 = 30

  const tot = prac + sq + fq;
  return { p1, p2, p3, p4, prac, sq, fq, tot };
}

function stageDone(i) {
  if (i === 0) return S.samples.every(s => s.prepared && s.calDone);
  if (i === 1) return S.samples.every(s => s.charcoalAdded) && S.shaken && S.bathDone;
  if (i === 2) return S.samples.every(s => s.separated && s.specDone);
  if (i === 3) return S.plottedIso && S.plottedLin && S.calcSurface;
  if (i === 4) return FINAL_QUIZ.every(q => S.ans[q.id] !== undefined);
  return false;
}

    return `<button class="${cls}" data-st="${i}">${stageDone(i) ? "✓ " : ""}${t}</button>`;

    b.onclick = () => {
      const idx = +b.dataset.st;

      SFX.play("click");

      renderAll();

}

/* ============ HARAKATLAR ============ */
function prepareSample(i) {
  const s = S.samples[i];
  if (s.prepared || S.pouring) return;
  SFX.play("pour");
  S.pouring = { idx: i, prog: 0 };
  LabUI.toast(`Probirka ${s.label} ga 50 ml ${f1(s.C0, 3)} M KMnO₄ tayyorlanmoqda...`, "");
  renderPanel();
}

function prepareAll() {
  const next = S.samples.findIndex(s => !s.prepared);
  if (next === -1) return;
  prepareSample(next);
  S._autoPrep = true;
}

function measureBaseline(i) {
  const s = S.samples[i];
  if (!s.prepared) { LabUI.toast("Avval bu eritmani tayyorlang!", "warn"); SFX.play("warn"); return; }
  if (S.specActive) return;
  SFX.play("pipette");
  S.specActive = { idx: i, mode: "base", prog: 0, val: s.D0 };
  renderPanel();
}

function weighAndAddCharcoal(i) {
  const s = S.samples[i];
  if (s.charcoalAdded || S.weighing) return;
  SFX.play("weigh");
  S.weighing = true;
  S.weighedMass = 0;
  const start = performance.now();
  const dur = 650;
  function step(now) {
    const k = clamp((now - start) / dur, 0, 1);
    S.weighedMass = +(0.500 * k).toFixed(3);
    if (k < 1) {
      requestAnimationFrame(step);
    } else {
      S.weighing = false;
      s.charcoalAdded = true;
      SFX.play("drip");
      LabUI.toast(`${s.label} probirkaga 0,500 g faollashtirilgan koʻmir qoʻshildi.`, "ok");
      renderAll();
      if (S._autoCharcoal) {
        const nxt = S.samples.findIndex(x => !x.charcoalAdded);
        if (nxt !== -1) setTimeout(() => weighAndAddCharcoal(nxt), 180);
        else S._autoCharcoal = false;
      }
    }
  }
  requestAnimationFrame(step);
}

function addAllCharcoal() {
  const nxt = S.samples.findIndex(x => !x.charcoalAdded);
  if (nxt === -1) return;
  S._autoCharcoal = true;
  weighAndAddCharcoal(nxt);
}

function shakeTubes() {
  if (!S.samples.every(s => s.charcoalAdded)) {
    LabUI.toast("Avval barcha 4 ta probirkaga 0,50 g dan koʻmir qoʻshing!", "warn");

  SFX.play("shake");
  S.shakeT = 1.2;
  S.shaken = true;
  LabUI.toast("Probirkalar kuchli chayqatildi — koʻmir zarralari bir tekis taqsimlandi!", "ok");
  renderAll();
}

  S.inBath = true;
  S.bathRunning = !S.bathRunning;
  SFX.play(S.bathRunning ? "heat" : "click");
  if (S.bathRunning) {
    LabUI.toast("25,0 °C suv hammomi ishga tushdi. KMnO₄ rangi asta-sekin ochlashmoqda!", "");
  }
  renderAll();
}

function runSeparation() {
  if (S.samples.every(s => s.separated) || S.sepRunning) return;
  S.sepRunning = true;
  S.sepProg = 0;
  SFX.play(S.sepMethod === "centrifuge" ? "vacuum" : "pour");
  LabUI.toast(S.sepMethod === "centrifuge"
    ? "Sentrifuga 4000 ayl/min tezlikda ishlamoqda..."
    : "Eritmalar qogʻoz filtr orqali tozalanmoqda...", "");
  renderPanel();
}

function measureResidual(i) {
  const s = S.samples[i];
  if (!s.separated) { LabUI.toast("Avval koʻmirni eritmadan ajrating!", "warn"); SFX.play("warn"); return; }
  if (S.specActive) return;
  SFX.play("pipette");
  S.specActive = { idx: i, mode: "eq", prog: 0, val: s.Dq };
  renderPanel();
}

function answerQ(qid, chosen, correct) {
  if (S.ans[qid] !== undefined) return;
  S.ans[qid] = chosen;
  if (chosen === correct) {
    SFX.play("ok");
    LabUI.toast("Toʻgʻri javob!", "ok", 2200);
  } else {
    SFX.play("err");
    LabUI.toast("Notoʻgʻri. Nazariya boʻlimini koʻzdan kechiring.", "err", 2800);
  }
  renderAll();
}

/* ============ SVG SAHNA CHIZISH ============ */
function tubeColorNow(s) {
  if (!s.prepared) return "rgba(210,225,224,0.18)";
  if (S.stage === 0) return kmno4Color(s.C0, 0.9);
  const f = clamp(S.bathTime / 20, 0, 1);
  // Eksponensial yaqinlashish C(t) = Ceq + (C0 - Ceq) * exp(-3.2 * f)
  const Cnow = s.Ceq + (s.C0 - s.Ceq) * Math.exp(-3.4 * f);
  return kmno4Color(Cnow, 0.88);
}

}

function drawStage4() {
  const fit = computeLangmuirFit();
  let s = `<text x="36" y="40" fill="#132629" font-size="19" font-weight="800">4-BOSQICH: Langmyur izotermasi va solishtirma sirt yuzasi S_sol</text>
    <text x="36" y="61" fill="#476366" font-size="13">Adsorbsiya izotermasi A = f(C_eq) va chiziqli shakl C_eq/A = f(C_eq) orqali A_∞, K va S_sol ni aniqlang</text>`;

  // Chap grafik paneli: A = f(C_eq)
  s += `<g transform="translate(36, 82)" filter="url(#shd)">
    <rect x="0" y="0" width="445" height="270" rx="14" fill="#ffffff" stroke="#b9cecb" stroke-width="1.6"/>
    <text x="222" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#132629">Langmyur adsorbsiya izotermasi: A = f(C_eq)</text>`;
  if (S.plottedIso && fit) {
    const padL = 56, padT = 40, w = 365, h = 186;
    const xm = 7.0, ym = 0.60;
    const X = v => padL + (v / xm) * w;
    const Y = v => padT + h - (v / ym) * h;
    s += `<rect x="${padL}" y="${padT}" width="${w}" height="${h}" fill="#f8fbfa"/>`;
    for (let v = 0; v <= 7; v += 1) {
      s += `<line x1="${X(v)}" y1="${padT}" x2="${X(v)}" y2="${padT+h}" stroke="#e5efed"/>
            <text x="${X(v)}" y="${padT+h+15}" text-anchor="middle" font-size="10" fill="#587276">${v}</text>`;
    }
    for (let v = 0; v <= 0.601; v += 0.1) {
      s += `<line x1="${padL}" y1="${Y(v)}" x2="${padL+w}" y2="${Y(v)}" stroke="#e5efed"/>
            <text x="${padL-7}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="#587276">${v.toFixed(1)}</text>`;
    }
    // Asimptota A_inf
    s += `<line x1="${padL}" y1="${Y(fit.A_inf)}" x2="${padL+w}" y2="${Y(fit.A_inf)}" stroke="#d64545" stroke-width="1.6" stroke-dasharray="6 4"/>
          <text x="${padL+w-4}" y="${Y(fit.A_inf)-5}" text-anchor="end" font-size="10.5" font-weight="700" fill="#d64545">A_∞ = ${f1(fit.A_inf,3)} mmol/g</text>`;
    // Egri chiziq
    let d = "";
    for (let k = 0; k <= 70; k++) {
      const c = (k / 70) * xm;
      const a = (fit.A_inf * fit.K_mM * c) / (1 + fit.K_mM * c);
      d += (k ? "L" : "M") + X(c).toFixed(1) + " " + Y(a).toFixed(1);
    }
    s += `<path d="${d}" fill="none" stroke="#1b484f" stroke-width="2.6"/>`;
    // Tajriba nuqtalari
    S.samples.forEach((sm, i) => {
      const cx = X(sm.Ceq * 1000), cy = Y(sm.A_mmol);
      const sel = S.inspectIdx === i;
      s += `<circle class="clk" data-act="inspect" data-i="${i}" cx="${cx}" cy="${cy}" r="${sel ? 7 : 5.2}" fill="${sel ? "#e89b3c" : "#8b1ca6"}" stroke="#132629" stroke-width="1.5"/>`;
      s += `<text x="${cx + 8}" y="${cy + 4}" font-size="10" font-weight="700" fill="#132629">${sm.label}</text>`;
    });
    s += `<text x="${padL+w}" y="${padT+h+32}" text-anchor="end" font-size="10.5" font-weight="700" fill="#132629">C_eq, mmol/L</text>
          <text x="16" y="${padT+h/2}" transform="rotate(-90 16 ${padT+h/2})" text-anchor="middle" font-size="10.5" font-weight="700" fill="#132629">A, mmol/g</text>`;
  } else {
    s += `<text x="222" y="145" text-anchor="middle" fill="#6f888b" font-size="13">Oʻng panelda «Izotermani chizish» tugmasini bosing</text>`;

  s += `</g>`;

  // Oʻng grafik paneli: Chiziqli Langmyur C/A = f(C)
  s += `<g transform="translate(505, 82)" filter="url(#shd)">
    <rect x="0" y="0" width="458" height="270" rx="14" fill="#ffffff" stroke="#b9cecb" stroke-width="1.6"/>

  if (S.plottedLin && fit) {
    const padL = 56, padT = 40, w = 378, h = 186;
    const xm = 7.0, ym = 18;
    const X = v => padL + (v / xm) * w;
    const Y = v => padT + h - (v / ym) * h;
    s += `<rect x="${padL}" y="${padT}" width="${w}" height="${h}" fill="#f8fbfa"/>`;
    for (let v = 0; v <= 7; v += 1) {
      s += `<line x1="${X(v)}" y1="${padT}" x2="${X(v)}" y2="${padT+h}" stroke="#e5efed"/>
            <text x="${X(v)}" y="${padT+h+15}" text-anchor="middle" font-size="10" fill="#587276">${v}</text>`;
    }
    for (let v = 0; v <= 18; v += 3) {
      s += `<line x1="${padL}" y1="${Y(v)}" x2="${padL+w}" y2="${Y(v)}" stroke="#e5efed"/>
            <text x="${padL-7}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="#587276">${v}</text>`;
    }
    const y0 = fit.intercept, yEnd = fit.intercept + fit.slope * xm;
    s += `<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(xm)}" y2="${Y(yEnd)}" stroke="#d64545" stroke-width="2.4"/>`;
    s += `<circle cx="${X(0)}" cy="${Y(y0)}" r="4.5" fill="#d64545"/>

    fit.pts.forEach(p => {
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="#1b484f" stroke="#fff" stroke-width="1.5"/>`;
    });
    s += `<rect x="${padL+10}" y="${padT+8}" width="185" height="44" rx="7" fill="#fff7e8" stroke="#e89b3c"/>
          <text x="${padL+18}" y="${padT+25}" font-size="10" font-family="var(--mono)" font-weight="700" fill="#5b4114">tg α = 1/A_∞ = ${f1(fit.slope,3)}</text>

          <text x="16" y="${padT+h/2}" transform="rotate(-90 16 ${padT+h/2})" text-anchor="middle" font-size="10.5" font-weight="700" fill="#132629">C_eq/A, g/L</text>`;

    s += `<text x="229" y="145" text-anchor="middle" fill="#6f888b" font-size="13">Avval «Chiziqli shaklga keltirish» tugmasini bosing</text>`;
  }
  s += `</g>`;

  // Pastki panel: Monomolekulyar qavat va S_sol vizualizatsiyasi
  const sm = S.samples[S.inspectIdx];
  const theta = fit ? clamp((fit.K_mM * sm.Ceq * 1000) / (1 + fit.K_mM * sm.Ceq * 1000), 0, 1) : 0;
  const totalSites = 20;

    <rect x="0" y="0" width="927" height="190" rx="14" fill="#133136" stroke="#2c5960" stroke-width="2"/>

    <text x="22" y="48" fill="#8dc4bd" font-size="11.5">Sirt bandlik darajasi θ = K·C / (1 + K·C) = ${Math.round(theta*100)}%   |   Har bir faol markazga 1 ta MnO₄⁻ ioni (S₀ = 3,6·10⁻¹⁹ m²)</text>

    <!-- Gʻovak uglerod sirti -->
    <rect x="22" y="116" width="540" height="52" rx="10" fill="#272e31" stroke="#475358" stroke-width="1.5"/>
    <text x="292" y="147" text-anchor="middle" fill="#9fb0b5" font-size="12" font-weight="700" letter-spacing="2">FAOLLASHTIRILGAN KOʻMIR SIRTI (20 TA FAOL MARKAZ)</text>

    <!-- 20 ta faol markaz va yutilgan MnO4- ionlari -->
    ${Array.from({length: totalSites}, (_, k) => {
      const mx = 42 + k * 26;
      const occ = k < filledSites;
      const bob = occ ? Math.sin(S.t * 3 + k) * 1.5 : 0;
      return `<rect x="${mx-7}" y="111" width="14" height="6" rx="2" fill="${occ ? "#e89b3c" : "#56676c"}"/>`
        + (occ ? `<circle cx="${mx}" cy="${96 + bob}" r="9.5" fill="#b434d6" stroke="#f0b6ff" stroke-width="1.5"/>
                  <text x="${mx}" y="${99.5 + bob}" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">MnO₄⁻</text>`
               : `<circle cx="${mx}" cy="96" r="8" fill="none" stroke="#48686c" stroke-dasharray="2 2"/>`);
    }).join("")}

    <!-- Natija qutisi oʻngda -->
    <rect x="590" y="24" width="316" height="144" rx="10" fill="#0b2024" stroke="#2c5960"/>
    ${S.calcSurface && fit ? `
      <text x="610" y="50" fill="#8dc4bd" font-size="11" font-family="var(--mono)">A_∞ = ${f1(fit.A_inf, 3)} mmol/g (${f1(fit.A_inf*PHYS.M_KMnO4, 1)} mg/g)</text>
      <text x="610" y="74" fill="#8dc4bd" font-size="11" font-family="var(--mono)">K   = ${Math.round(fit.K_M)} L/mol</text>
      <line x1="608" y1="88" x2="888" y2="88" stroke="#244b52"/>
      <text x="610" y="112" fill="#e89b3c" font-size="11" font-weight="700">SOLISHTIRMA SIRT YUZASI:</text>
      <text x="610" y="148" fill="#77f5be" font-size="28" font-weight="800" font-family="var(--mono)">S_sol = ${f1(fit.S_sol, 1)} m²/g</text>
    ` : `
      <text x="748" y="88" text-anchor="middle" fill="#7ba6a1" font-size="12.5">S_sol = A_∞ · N_A · S₀</text>
      <text x="748" y="112" text-anchor="middle" fill="#e89b3c" font-size="11.5">«S_sol ni hisoblash» tugmasini bosing</text>
    `}
  </g>`;
  return s;
}

function bindStageClicks() {
  el("scene").querySelectorAll(".clk").forEach(n => {
    n.onclick = () => {
      const act = n.dataset.act, i = +n.dataset.i;
      if (act === "tube1") {
        if (!S.samples[i].prepared) prepareSample(i);
        else measureBaseline(i);
      } else if (act === "addNextCharcoal") {
        const nxt = S.samples.findIndex(x => !x.charcoalAdded);
        if (nxt !== -1) weighAndAddCharcoal(nxt);
        else LabUI.toast("Barcha 4 ta probirkaga 0,50 g koʻmir qoʻshib boʻlingan!", "ok");
      } else if (act === "tube2") {
        if (!S.samples[i].charcoalAdded) weighAndAddCharcoal(i);
        else if (!S.shaken) shakeTubes();
      } else if (act === "runSep") {
        runSeparation();
      } else if (act === "tube3") {
        measureResidual(i);
      } else if (act === "inspect") {
        SFX.play("click");
        S.inspectIdx = i;
        renderAll();
      }
    };
  });
}

function renderQuestionsHTML(list) {
  return list.map((q, qi) => {
    const order = shuf(q.opts.length, S.seed + qi * 17 + q.id.charCodeAt(q.id.length - 1));
    const chosen = S.ans[q.id];
    return `<div class="q">
      <p>${qi + 1}. ${q.q}</p>
      ${order.map(oi => {
        let cls = "";
        if (chosen !== undefined) {
          if (oi === q.ok) cls = "right";
          else if (oi === chosen) cls = "wrong";
        }
        return `<button class="${cls}" data-qid="${q.id}" data-oi="${oi}" data-ok="${q.ok}" ${chosen !== undefined ? "disabled" : ""}>${q.opts[oi]}</button>`;
      }).join("")}
    </div>`;
  }).join("");
}

function bindQuestions(root) {
  root.querySelectorAll("button[data-qid]").forEach(b => {
    b.onclick = () => answerQ(b.dataset.qid, +b.dataset.oi, +b.dataset.ok);
  });
}

function renderPanel() {
  const p = el("panel");
  const st = S.stage;
  let h = "";

  if (st === 0) {
    const prepAll = S.samples.every(s => s.prepared);
    const calAll = S.samples.every(s => s.calDone);
    h = `<h2>1-bosqich: Eritmalar va kalibrlash</h2>
      <p class="sub">Turli konsentratsiyadagi 4 ta KMnO₄ eritmasini (50 ml dan) tayyorlang va λ = 525 nm da boshlangʻich optik zichlik D₀ ni oʻlchang.</p>
      <ul class="tasks">
        <li class="${prepAll ? "done" : "cur"}"><span class="b">${prepAll ? "✓" : "1"}</span>4 ta KMnO₄ eritmasini (0,001–0,010 M) tayyorlash</li>
        <li class="${calAll ? "done" : (prepAll ? "cur" : "")}"><span class="b">${calAll ? "✓" : "2"}</span>Spektrofotometrda D₀ qiymatlarini oʻlchash</li>
      </ul>
      <div class="box">
        <h4>Eritmalarni tayyorlash va D₀ oʻlchash</h4>
        ${S.samples.map((sm, i) => `
          <div class="tube-row">
            <div><span class="swatch" style="background:${kmno4Hex(sm.C0)}"></span><b>${sm.label}</b> · ${f1(sm.C0, 3)} M (50 ml)</div>
            <div class="row">
              <button class="${sm.prepared ? "on" : "pri"}" data-p1="${i}" ${sm.prepared || S.pouring ? "disabled" : ""}>${sm.prepared ? "✓ Tayyor" : "Quyish"}</button>
              <button class="${sm.calDone ? "on" : "dark"}" data-c1="${i}" ${!sm.prepared || sm.calDone || S.specActive ? "disabled" : ""}>${sm.calDone ? "D₀=" + f1(sm.D0, 3) : "Oʻlchash"}</button>
            </div>
          </div>`).join("")}
        <div class="row" style="margin-top:9px">
          <button class="pri" id="btnPrepAll" ${prepAll || S.pouring ? "disabled" : ""}>Barchasini tayyorlash</button>
          <button class="dark" id="btnCalAll" ${!prepAll || calAll || S.specActive ? "disabled" : ""}>Barchasini oʻlchash</button>
        </div>
      </div>
      <div class="box">
        <h4>Kalibrlash grafigi (D₀ = ε·l·C₀)</h4>
        ${LabUI.svgChart({
          x0: 0, xm: 11, y0: 0, ym: 2.5,
          xl: "C₀, mmol/L", yl: "D₀",
          line: [{ x: 0, y: 0 }, { x: 10.5, y: 2.31 }],
          lineColor: "#8b1ca6",
          series: [{
            pts: S.samples.filter(s => s.calDone).map(s => ({ x: s.C0 * 1000, y: s.D0 })),
            color: "#8b1ca6", dot: "#e89b3c", scatterOnly: true
          }]
        })}
      </div>
      <div class="box"><h4>Nazorat savollari (1-bosqich)</h4>${renderQuestionsHTML(STAGE_QS[0])}</div>
      <button class="pri next" id="btnNext" ${!stageDone(0) ? "disabled" : ""}>2-bosqichga oʻtish: Adsorbsiya (25 °C) →</button>`;
  } else if (st === 1) {
    const chAll = S.samples.every(s => s.charcoalAdded);
    h = `<h2>2-bosqich: Koʻmir qoʻshish va 25 °C hammom</h2>
      <p class="sub">Analitik tarozida 0,500 g faollashtirilgan koʻmir tortib har bir probirkaga soling, kuchli chayqating va 25,0 °C suv hammomida 20 daqiqa ushlang.</p>
      <ul class="tasks">
        <li class="${chAll ? "done" : "cur"}"><span class="b">${chAll ? "✓" : "1"}</span>Har bir probirkaga 0,500 g koʻmir qoʻshish</li>
        <li class="${S.shaken ? "done" : (chAll ? "cur" : "")}"><span class="b">${S.shaken ? "✓" : "2"}</span>Probirkalarni kuchli chayqatish</li>
        <li class="${S.bathDone ? "done" : (S.shaken ? "cur" : "")}"><span class="b">${S.bathDone ? "✓" : "3"}</span>25,0 °C suv hammomida 20 daqiqa adsorbsiya</li>
      </ul>
      <div class="box">
        <h4>1. Analitik tarozida koʻmir qoʻshish</h4>
        <div class="grid4" style="margin-bottom:8px">
          ${S.samples.map((sm, i) => `<button class="${sm.charcoalAdded ? "on" : ""}" data-ch="${i}" ${sm.charcoalAdded || S.weighing ? "disabled" : ""}>${sm.label}<br>${sm.charcoalAdded ? "✓ 0,5g" : "+0,5g"}</button>`).join("")}
        </div>
        <button class="pri" id="btnChAll" style="width:100%" ${chAll || S.weighing ? "disabled" : ""}>Barcha probirkalarga 0,50 g dan qoʻshish</button>
      </div>
      <div class="box">
        <h4>2. Chayqatish va 25,0 °C suv hammomi</h4>
        <div class="big">${f1(S.bathTime, 1)} / 20,0 daq<small>Harorat: 25,0 °C · Tezlik: ×${S.speed}</small></div>
        <div class="mini-bar"><i style="width:${clamp(S.bathTime/20*100,0,100)}%"></i></div>
        <div class="row" style="margin-top:9px">
          <button class="${S.shaken ? "on" : "pri"}" id="btnShake" ${!chAll ? "disabled" : ""}>${S.shaken ? "✓ Chayqatildi" : "🫧 Chayqatish"}</button>
          <button class="${S.bathDone ? "on" : "dark"}" id="btnBath" ${!S.shaken || S.bathDone ? "disabled" : ""}>${S.bathDone ? "✓ 20 daq tugadi" : (S.bathRunning ? "⏸ Pauza" : "▶ Suv hammomini yoqish")}</button>
        </div>
        <p class="note" style="margin-top:7px">Pastdagi <b>×1 / ×5 / ×10</b> tugmalari bilan vaqtni tezlashtirishingiz mumkin.</p>
      </div>
      <div class="box"><h4>Nazorat savollari (2-bosqich)</h4>${renderQuestionsHTML(STAGE_QS[1])}</div>
      <button class="pri next" id="btnNext" ${!stageDone(1) ? "disabled" : ""}>3-bosqichga oʻtish: Ajratish va tahlil →</button>`;
  } else if (st === 2) {
    const allSep = S.samples.every(s => s.separated);
    const allSpec = S.samples.every(s => s.specDone);
    h = `<h2>3-bosqich: Ajratish va spektrofotometriya</h2>
      <p class="sub">Adsorbentni eritmadan ajrating va qoldiq KMnO₄ konsentratsiyasi C_eq hamda adsorbsiya miqdori A ni aniqlang.</p>
      <ul class="tasks">
        <li class="${allSep ? "done" : "cur"}"><span class="b">${allSep ? "✓" : "1"}</span>Koʻmirni sentrifuga yoki filtr orqali ajratish</li>
        <li class="${allSpec ? "done" : (allSep ? "cur" : "")}"><span class="b">${allSpec ? "✓" : "2"}</span>4 ta qoldiq eritmaning D_qold qiymatini oʻlchash</li>
      </ul>
      <div class="box">
        <h4>1. Ajratish usulini tanlang</h4>
        <div class="grid2" style="margin-bottom:8px">
          <button class="${S.sepMethod === "centrifuge" ? "on" : ""}" id="btnUseCent" ${S.sepRunning ? "disabled" : ""}>⚙ Sentrifuga</button>
          <button class="${S.sepMethod === "filter" ? "on" : ""}" id="btnUseFilt" ${S.sepRunning ? "disabled" : ""}>🔻 Qogʻoz filtr</button>
        </div>
        <button class="pri" id="btnRunSep" style="width:100%" ${allSep || S.sepRunning ? "disabled" : ""}>${allSep ? "✓ Koʻmir ajratildi" : (S.sepRunning ? "Ajratilmoqda..." : "▶ Ajratishni boshlash")}</button>
      </div>
      <div class="box">
        <h4>2. Spektrofotometrda qoldiq D_qold ni oʻlchash (λ = 525 nm)</h4>
        <div class="grid4" style="margin-bottom:8px">
          ${S.samples.map((sm, i) => `<button class="${sm.specDone ? "on" : ""}" data-sp3="${i}" ${!allSep || sm.specDone || S.specActive ? "disabled" : ""}>${sm.label}<br>${sm.specDone ? "✓ " + f1(sm.Dq, 3) : "Oʻlchash"}</button>`).join("")}
        </div>
        <button class="dark" id="btnSpecAll3" style="width:100%" ${!allSep || allSpec || S.specActive ? "disabled" : ""}>Barcha qoldiqlarni ketma-ket oʻlchash</button>
      </div>
      <div class="box">
        <h4>Tajriba jadvali (V = 50 ml, m = 0,50 g)</h4>
        <table class="j">
          <thead><tr><th>#</th><th>C₀, mM</th><th>D_qold</th><th>C_eq, mM</th><th>A, mmol/g</th><th>A, mg/g</th></tr></thead>
          <tbody>
            ${S.samples.map(sm => `<tr>
              <td>${sm.label}</td>
              <td>${f1(sm.C0*1000, 1)}</td>
              <td>${sm.specDone ? f1(sm.Dq, 3) : "—"}</td>
              <td>${sm.specDone ? f1(sm.Ceq*1000, 2) : "—"}</td>
              <td><b>${sm.specDone ? f1(sm.A_mmol, 3) : "—"}</b></td>
              <td>${sm.specDone ? f1(sm.A_mg, 1) : "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="box"><h4>Nazorat savollari (3-bosqich)</h4>${renderQuestionsHTML(STAGE_QS[2])}</div>
      <button class="pri next" id="btnNext" ${!stageDone(2) ? "disabled" : ""}>4-bosqichga oʻtish: Langmyur izotermasi →</button>`;
  } else if (st === 3) {
    const fit = computeLangmuirFit();
    h = `<h2>4-bosqich: Langmyur izotermasi va S_sol</h2>
      <p class="sub">Tajriba maʼlumotlarini Langmyur tenglamasi boʻyicha qayta ishlang, A_∞ va K konstantalarini hamda solishtirma sirt yuzasini toping.</p>
      <ul class="tasks">
        <li class="${S.plottedIso ? "done" : "cur"}"><span class="b">${S.plottedIso ? "✓" : "1"}</span>Langmyur izotermasi A = f(C_eq) ni chizish</li>
        <li class="${S.plottedLin ? "done" : (S.plottedIso ? "cur" : "")}"><span class="b">${S.plottedLin ? "✓" : "2"}</span>Chiziqli shakl C_eq/A = f(C_eq) dan A_∞ va K ni topish</li>
        <li class="${S.calcSurface ? "done" : (S.plottedLin ? "cur" : "")}"><span class="b">${S.calcSurface ? "✓" : "3"}</span>Solishtirma sirt yuzasi S_sol ni hisoblash</li>
      </ul>
      <div class="box">
        <h4>Grafik tahlil va hisoblash</h4>
        <div class="row" style="margin-bottom:8px">
          <button class="${S.plottedIso ? "on" : "pri"}" id="btnPlotIso">${S.plottedIso ? "✓ Izoterma chizildi" : "📈 Izotermani chizish"}</button>
          <button class="${S.plottedLin ? "on" : "dark"}" id="btnPlotLin" ${!S.plottedIso ? "disabled" : ""}>${S.plottedLin ? "✓ Chiziqli shakl" : "📐 Chiziqli shaklga keltirish"}</button>
        </div>
        <button class="${S.calcSurface ? "on" : "pri"}" id="btnCalcSurf" style="width:100%" ${!S.plottedLin ? "disabled" : ""}>${S.calcSurface ? "✓ S_sol hisoblandi" : "🧮 S_sol ni hisoblash (A_∞ · N_A · S₀)"}</button>
        ${S.plottedLin && fit ? `
          <div class="kpi-grid">
            <div class="kpi"><small>A_∞ (chegaraviy)</small><b>${f1(fit.A_inf, 3)} mmol/g</b></div>
            <div class="kpi"><small>K (Langmyur)</small><b>${Math.round(fit.K_M)} L/mol</b></div>
            <div class="kpi"><small>Korrelyatsiya R²</small><b>${f1(fit.R2, 4)}</b></div>
            <div class="kpi"><small>S_sol (sirt yuzasi)</small><b>${S.calcSurface ? f1(fit.S_sol, 1) + " m²/g" : "—"}</b></div>
          </div>` : ""}
      </div>
      <div class="box">
        <h4>Monomolekulyar qavat bandligi θ ni koʻrish</h4>
        <div class="grid4">
          ${S.samples.map((sm, i) => `<button class="${S.inspectIdx === i ? "on" : ""}" data-ins="${i}">${sm.label}<br>${f1(sm.C0*1000,0)} mM</button>`).join("")}
        </div>
        <div class="eq">A = A_∞ · K·C / (1 + K·C)  ⇒  C/A = 1/(A_∞·K) + C/A_∞</div>
      </div>
      <div class="box"><h4>Nazorat savollari (4-bosqich)</h4>${renderQuestionsHTML(STAGE_QS[3])}</div>
      <button class="pri next" id="btnNext" ${!stageDone(3) ? "disabled" : ""}>Yakuniy hisobotga oʻtish →</button>`;
  } else {
    const sc = total();
    const fit = computeLangmuirFit();
    h = `<div class="rep">
      <h2>11-laboratoriya · Yakuniy hisobot</h2>
      <div class="score">
        <div class="n">${sc.tot}</div>
        <div>
          <b>Umumiy ball (100 dan)</b>
          <div style="font-size:12px;opacity:.82">Amaliyot: ${sc.prac}/46 · Bosqich savollari: ${sc.sq}/24 · Test: ${sc.fq}/30</div>
        </div>
      </div>
      <div class="box">
        <h4>Oʻlchash va hisoblash natijalari</h4>
        <table class="j">
          <thead><tr><th>#</th><th>C₀, mM</th><th>D₀</th><th>D_q</th><th>C_eq, mM</th><th>A, mmol/g</th><th>C/A</th></tr></thead>
          <tbody>
            ${S.samples.map(sm => `<tr>
              <td>${sm.label}</td>
              <td>${f1(sm.C0*1000,1)}</td>
              <td>${f1(sm.D0,3)}</td>
              <td>${sm.specDone ? f1(sm.Dq,3) : "—"}</td>
              <td>${sm.specDone ? f1(sm.Ceq*1000,2) : "—"}</td>
              <td><b>${sm.specDone ? f1(sm.A_mmol,3) : "—"}</b></td>
              <td>${sm.specDone ? f1((sm.Ceq*1000)/sm.A_mmol, 2) : "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        ${fit ? `<div class="kv" style="margin-top:8px"><span>Chegaraviy adsorbsiya A_∞:</span><b>${f1(fit.A_inf,3)} mmol/g (${f1(fit.A_inf*PHYS.M_KMnO4,1)} mg/g)</b></div>
          <div class="kv"><span>Langmyur konstantasi K:</span><b>${Math.round(fit.K_M)} L/mol</b></div>
          <div class="kv"><span>Solishtirma sirt yuzasi S_sol:</span><b>${f1(fit.S_sol,1)} m²/g</b></div>` : ""}
      </div>
      ${fit ? `<div class="box">
        <h4>Langmyur izotermasi va chiziqli regressiya</h4>
        ${LabUI.svgChart({
          H: 185, x0: 0, xm: 7, y0: 0, ym: 0.6,
          title: "A = f(C_eq)", xl: "C_eq, mmol/L", yl: "A, mmol/g",
          series: [{
            pts: Array.from({length: 30}, (_, k) => {
              const c = (k / 29) * 6.6;
              return { x: c, y: (fit.A_inf * fit.K_mM * c) / (1 + fit.K_mM * c) };
            }),
            color: "#1b484f", dot: "transparent"
          }, {
            pts: S.samples.map(sm => ({ x: sm.Ceq * 1000, y: sm.A_mmol })),
            color: "#8b1ca6", dot: "#e89b3c", scatterOnly: true
          }]
        })}
        <div style="height:8px"></div>
        ${LabUI.svgChart({
          H: 185, x0: 0, xm: 7, y0: 0, ym: 18,
          title: "C_eq / A = f(C_eq)", xl: "C_eq, mmol/L", yl: "C_eq/A, g/L",
          line: [{ x: 0, y: fit.intercept }, { x: 6.8, y: fit.intercept + fit.slope * 6.8 }],
          series: [{ pts: fit.pts, color: "#1b484f", dot: "#e89b3c", scatterOnly: true }]
        })}
      </div>` : ""}
      <div class="box">
        <h4>Yakuniy test (5 savol × 6 ball = 30 ball)</h4>
        ${renderQuestionsHTML(FINAL_QUIZ)}
      </div>
      <div class="row noprint">
        <button class="pri" id="btnPrint" style="flex:1">🖨 Hisobotni chop etish</button>
        <button class="ghost" id="btnReset">🔄 Qaytadan boshlash</button>
      </div>
    </div>`;
  }

  p.innerHTML = h;
  bindQuestions(p);

  // Panel tugmalari
  p.querySelectorAll("button[data-p1]").forEach(b => b.onclick = () => prepareSample(+b.dataset.p1));
  p.querySelectorAll("button[data-c1]").forEach(b => b.onclick = () => measureBaseline(+b.dataset.c1));
  p.querySelectorAll("button[data-ch]").forEach(b => b.onclick = () => weighAndAddCharcoal(+b.dataset.ch));
  p.querySelectorAll("button[data-sp3]").forEach(b => b.onclick = () => measureResidual(+b.dataset.sp3));
  p.querySelectorAll("button[data-ins]").forEach(b => b.onclick = () => { SFX.play("click"); S.inspectIdx = +b.dataset.ins; renderAll(); });

  const bPrepAll = el("btnPrepAll"); if (bPrepAll) bPrepAll.onclick = prepareAll;
  const bCalAll = el("btnCalAll"); if (bCalAll) bCalAll.onclick = () => {
    const nxt = S.samples.findIndex(x => !x.calDone);
    if (nxt !== -1) { S._autoCal = true; measureBaseline(nxt); }
  };
  const bChAll = el("btnChAll"); if (bChAll) bChAll.onclick = addAllCharcoal;
  const bShake = el("btnShake"); if (bShake) bShake.onclick = shakeTubes;
  const bBath = el("btnBath"); if (bBath) bBath.onclick = toggleWaterBath;
  const bUseCent = el("btnUseCent"); if (bUseCent) bUseCent.onclick = () => { SFX.play("click"); S.sepMethod = "centrifuge"; renderAll(); };
  const bUseFilt = el("btnUseFilt"); if (bUseFilt) bUseFilt.onclick = () => { SFX.play("click"); S.sepMethod = "filter"; renderAll(); };
  const bRunSep = el("btnRunSep"); if (bRunSep) bRunSep.onclick = runSeparation;
  const bSpecAll3 = el("btnSpecAll3"); if (bSpecAll3) bSpecAll3.onclick = () => {
    const nxt = S.samples.findIndex(x => !x.specDone);
    if (nxt !== -1) { S._autoSpec3 = true; measureResidual(nxt); }
  };
  const bPlotIso = el("btnPlotIso"); if (bPlotIso) bPlotIso.onclick = () => {
    SFX.play("ok"); S.plottedIso = true; LabUI.toast("Langmyur adsorbsiya izotermasi qurildi!", "ok"); renderAll();
  };
  const bPlotLin = el("btnPlotLin"); if (bPlotLin) bPlotLin.onclick = () => {
    SFX.play("ok"); S.plottedLin = true; LabUI.toast("Chiziqli regressiya (C/A vs C) bajarildi!", "ok"); renderAll();
  };
  const bCalcSurf = el("btnCalcSurf"); if (bCalcSurf) bCalcSurf.onclick = () => {
    SFX.play("fanfare"); S.calcSurface = true;
    const fit = computeLangmuirFit();
    LabUI.toast(`Solishtirma sirt yuzasi topildi: S_sol = ${f1(fit.S_sol, 1)} m²/g!`, "ok");
    renderAll();
  };
  const bNext = el("btnNext"); if (bNext) bNext.onclick = () => { SFX.play("whoosh"); S.stage++; renderAll(); };
  const bPrint = el("btnPrint"); if (bPrint) bPrint.onclick = () => window.print();
  const bReset = el("btnReset"); if (bReset) bReset.onclick = () => { SFX.play("click"); S = createInitialState(); renderAll(); LabUI.toast("Laboratoriya qaytadan boshlandi.", ""); };
}

function renderAll() {
  renderTabs();
  renderPanel();
  renderSVG();
}

    <h3>Ish bosqichlari:</h3>

function showTheory() {
  LabUI.modal(`
    <h1>Nazariy maʼlumotlar (11-lab)</h1>
    <h3>1. Qattiq jism sirtidagi adsorbsiya</h3>
    <p>Adsorbsiya — erigan modda (adsorbat — KMnO₄) zarralarining qattiq jism (adsorbent — faollashtirilgan koʻmir) sirtida toʻplanish jarayonidir. Adsorbsiya qiymati massa balansi orqali topiladi:</p>
    <div class="eq">A = (C₀ − C_eq) · V / m   [mmol/g]     |     A_mg = A · M(KMnO₄)   [mg/g]</div>
    <h3>2. Buger–Lambert–Ber qonuni</h3>
    <p>Binafsha KMnO₄ eritmasining optik zichligi λ = 525 nm (yashil nur) toʻlqin uzunligida konsentratsiyaga toʻgʻri proporsional:</p>
    <div class="eq">D = ε · l · C   (ε = 2200 L/(mol·cm), l = 0,1 cm)</div>
    <h3>3. Langmyur monomolekulyar adsorbsiya tenglamasi</h3>
    <p>Sirtdagi bir jinsli faol markazlarda monomolekulyar qavat hosil boʻlishini tavsiflaydi:</p>
    <div class="eq">A = A_∞ · K·C / (1 + K·C)   ⇒   C / A = 1 / (A_∞·K) + (1 / A_∞) · C</div>
    <p>Chiziqli grafikning burchak koeffitsiyentidan <b>A_∞ = 1 / tg α</b>, ordinata oʻqidan kesilgan kesmadan esa <b>K = tg α / b</b> topiladi.</p>
    <h3>4. Adsorbentning solishtirma sirt yuzasi</h3>
    <div class="eq">S_sol = A_∞ · N_A · S₀   [m²/g]   (N_A = 6,022·10²³ mol⁻¹, S₀ = 3,6·10⁻¹⁹ m²)</div>
    ${LabUI.refsHTML()}
    <div style="margin-top:14px;text-align:right"><button class="dark" onclick="LabUI.closeModal()">Yopish</button></div>
  `);
}

function showJournal() {
  const fit = computeLangmuirFit();
  LabUI.modal(`
    <h1>Laboratoriya jurnali (11-lab)</h1>
    <p style="color:var(--muted);margin-bottom:10px">V = 50 ml (0,050 L) · m(koʻmir) = 0,500 g · T = 25,0 °C · λ = 525 nm · M(KMnO₄) = 158,03 g/mol</p>
    <table class="j">
      <thead><tr><th>Probirka</th><th>C₀, M</th><th>D₀</th><th>D_qold</th><th>C_eq, M</th><th>A, mmol/g</th><th>A, mg/g</th><th>C_eq/A, g/L</th></tr></thead>
      <tbody>
        ${S.samples.map(sm => `<tr>
          <td><b>${sm.label}</b></td>
          <td>${f1(sm.C0, 3)}</td>
          <td>${sm.calDone ? f1(sm.D0, 3) : "—"}</td>
          <td>${sm.specDone ? f1(sm.Dq, 3) : "—"}</td>
          <td>${sm.specDone ? f1(sm.Ceq, 5) : "—"}</td>
          <td><b>${sm.specDone ? f1(sm.A_mmol, 3) : "—"}</b></td>
          <td>${sm.specDone ? f1(sm.A_mg, 2) : "—"}</td>
          <td>${sm.specDone ? f1((sm.Ceq*1000)/sm.A_mmol, 2) : "—"}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    ${fit ? `<div class="eq" style="margin-top:12px">A_∞ = ${f1(fit.A_inf,3)} mmol/g  |  K = ${Math.round(fit.K_M)} L/mol  |  R² = ${f1(fit.R2,4)}  |  S_sol = ${f1(fit.S_sol,1)} m²/g</div>` : ""}
    <div style="margin-top:14px;text-align:right"><button class="dark" onclick="LabUI.closeModal()">Yopish</button></div>
  `);
}

function showSmartHint() {
  SFX.play("beep");
  let msg = "";
  if (S.stage === 0) {
    if (!S.samples.every(s => s.prepared)) msg = "1-qadam: Sahna ustidagi probirkalarni yoki oʻng paneldagi «Quyish» / «Barchasini tayyorlash» tugmasini bosing.";
    else if (!S.samples.every(s => s.calDone)) msg = "2-qadam: Har bir tayyor eritmani spektrofotometrda oʻlchang (D₀ qiymatlari kalibrlash chizigʻiga tushadi).";
    else msg = "1-bosqich tayyor! Nazorat savollariga javob berib, 2-bosqichga oʻting.";
  } else if (S.stage === 1) {
    if (!S.samples.every(s => s.charcoalAdded)) msg = "Koʻmir bankasini yoki «+0,5g» tugmalarini bosib, barcha 4 probirkaga 0,500 g dan koʻmir soling.";
    else if (!S.shaken) msg = "Endi «🫧 Chayqatish» tugmasini bosing — koʻmir eritma boʻylab bir tekis taqsimlanadi.";
    else if (!S.bathDone) msg = "«▶ Suv hammomini yoqish» tugmasini bosing va 20 daqiqa (×10 tezlikda atigi 6 soniya) kuting.";
    else msg = "Adsorbsiya muvozanati oʻrnatildi! 3-bosqichga oʻting.";
  } else if (S.stage === 2) {
    if (!S.samples.every(s => s.separated)) msg = "Sentrifuga yoki qogʻoz filtrni tanlab, «▶ Ajratishni boshlash» tugmasini bosing.";
    else if (!S.samples.every(s => s.specDone)) msg = "Tiniq eritmalarni ketma-ket spektrofotometrda oʻlchab, qoldiq D_qold va A qiymatlarini oling.";
    else msg = "Barcha oʻlchashlar yakunlandi! 4-bosqichda Langmyur grafigini quring.";
  } else if (S.stage === 3) {
    if (!S.plottedIso) msg = "«📈 Izotermani chizish» tugmasini bosing.";
    else if (!S.plottedLin) msg = "«📐 Chiziqli shaklga keltirish» tugmasini bosib A_∞ va K ni aniqlang.";
    else if (!S.calcSurface) msg = "«🧮 S_sol ni hisoblash» tugmasini bosib solishtirma sirt yuzasini toping.";
    else msg = "Ajoyib! Endi yakuniy hisobotga oʻtib 5 savolli testni topshiring.";
  } else {
    msg = "5 ta yakuniy test savoliga javob bering va hisobotni chop eting!";
  }
  LabUI.toast("💡 " + msg, "warn", 4600);
}

/* ============ ANIMATSIYA SIKLI ============ */
let lastTs = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTs) / 1000, 0.08);
  lastTs = now;
  S.t += dt;
  let dirty = false;

  // 1-bosqich: eritma quyish
  if (S.pouring) {
    S.pouring.prog += dt * 1.45;
    if (S.pouring.prog >= 1) {
      const idx = S.pouring.idx;
      S.samples[idx].prepared = true;
      S.pouring = null;
      dirty = true;
      if (S._autoPrep) {
        const nxt = S.samples.findIndex(x => !x.prepared);
        if (nxt !== -1) prepareSample(nxt);
        else { S._autoPrep = false; LabUI.toast("Barcha 4 ta KMnO₄ eritmasi tayyorlandi!", "ok"); }
      }
    }
  }

  // Spektrofotometr oʻlchashi
  if (S.specActive) {
    S.specActive.prog += dt * 1.25;
    if (S.specActive.prog >= 1) {
      const { idx, mode } = S.specActive;
      S.specActive = null;
      SFX.play("beep");
      if (mode === "base") {
        S.samples[idx].calDone = true;
        if (S._autoCal) {
          const nxt = S.samples.findIndex(x => !x.calDone);
          if (nxt !== -1) measureBaseline(nxt);
          else { S._autoCal = false; LabUI.toast("Kalibrlash yakunlandi (R² = 1,000)!", "ok"); }
        }
      } else {
        S.samples[idx].specDone = true;
        if (S._autoSpec3) {
          const nxt = S.samples.findIndex(x => !x.specDone);
          if (nxt !== -1) measureResidual(nxt);
          else { S._autoSpec3 = false; LabUI.toast("Barcha 4 ta qoldiq konsentratsiya aniqlandi!", "ok"); }
        }
      }
      dirty = true;
    }
  }

  // 2-bosqich: chayqatish va suv hammomi
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (S.bathRunning && !S.bathDone) {
    // x1 = 0.35 daq/s, x5 = 1.75 daq/s, x10 = 3.5 daq/s
    S.bathTime = Math.min(20, S.bathTime + dt * 0.35 * S.speed);
    if (S.bathTime >= 20) {
      S.bathRunning = false;
      S.bathDone = true;
      SFX.play("bell");
      LabUI.toast("20 daqiqa yakunlandi! Adsorbsion muvozanat 25,0 °C da oʻrnatildi.", "ok");
      dirty = true;
    } else if (Math.floor((S.bathTime - dt * 0.35 * S.speed) * 2) !== Math.floor(S.bathTime * 2)) {
      dirty = true;
    }
  }

  // 3-bosqich: ajratish
  if (S.sepRunning) {
    S.sepProg += dt * 0.52;
    if (S.sepProg >= 1) {
      S.sepRunning = false;
      S.sepProg = 1;
      S.samples.forEach(s => s.separated = true);
      SFX.play("ok");
      LabUI.toast("Faollashtirilgan koʻmir barcha eritmalardan toʻliq ajratildi!", "ok");
      dirty = true;
    }
  }

  if (dirty) renderAll();
  else renderSVG();
  requestAnimationFrame(loop);
}

/* ============ INITSIALIZATSIYA ============ */
function init() {
  LabUI.initShell(LAB_ID);
  document.querySelectorAll("footer.lab-foot button[data-sp]").forEach(b => {
    const sp = +b.dataset.sp;
    if (sp === S.speed) b.classList.add("on");
    b.onclick = () => {
      SFX.play("click");
      S.speed = sp;
      document.querySelectorAll("footer.lab-foot button[data-sp]").forEach(x => x.classList.toggle("on", +x.dataset.sp === sp));
      if (S.stage === 1) renderPanel();
    };
  });
  el("btnTable").onclick = () => { SFX.play("paper"); showJournal(); };
  el("btnHint").onclick = showSmartHint;
  el("btnTheory").onclick = () => { SFX.play("paper"); showTheory(); };
  renderAll();
  showIntro();
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
