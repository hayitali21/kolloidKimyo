// Animatsiya ionlari (dializ va elektrodializ uchun)
for (let i = 0; i < 28; i++) {

    ["Tiniq filtratda AgNO₃ bilan Cl⁻ borligini hamda kolloid zarrachalar oʻtmaganini tekshiring", () => S.s3.filtrateAg && S.s3.filtrateCol]

    },

      o: [
        "Kichik Cl⁻ elektrolit ionlari ultramembranadan oʻtgan, yirik kolloid zarrachalar esa membrana sirtida ushlanib qolgan",

const QZ = [
  ["Yarim oʻtkazgich membrananing kolloid zarrachalarni ushlab qolish qobiliyati nimaga bogʻliq?", ["Membrana teshiklari oʻlchami (kichik ionlardan katta, kolloid zarrachalardan kichik) ga", "Faqat stakandagi suv hajmiga", "Kolloid eritmaning rangiga", "Xona yorugʻligiga"], 0],
  ["Kolloid sistemalarni ortiqcha elektrolitlardan tozalash nima uchun muhim?", ["Ortiqcha elektrolitlar zolning agregativ barqarorligini pasaytirib, koagullanishni tezlashtiradi", "Elektrolitlar zolni rangsiz gazga aylantiradi", "Suvning qaynash haroratini 0 °C ga tushiradi", "Kolloid zarrachalarni eritib atomlarga ajratadi"], 0],
  ["Tibbiyotda «sunʼiy buyrak» (gemodializ) apparatida qonni zaharli kichik molekulalardan tozalashda qaysi usul qoʻllaniladi?", ["Dializ — yarim oʻtkazgich membrana orqali mochevina va ortiqcha tuzlar chiqariladi, qon oqsillari va hujayralari esa saqlanib qoladi", "Qaynatib haydash", "Oddiy qum filtridan oʻtkazish", "Kristallash"], 0],
  ["Uchala usul orasida bir vaqtning oʻzida zolni ham tozalash, ham konsentrlash (quyuqlashtirish) imkonini beruvchi usul qaysi?", ["Ultrafiltratsiya", "Oddiy dializ", "Dekantatsiya", "Qizdirish"], 0],

];

/* ============ YORDAMCHILAR ============ */
function idx(st) {
  const list = TASKS[st] || [];
  for (let i = 0; i < list.length; i++) if (!list[i][1]()) return i;
  return list.length;
}
function qDone(id) { return S.q[id] && S.q[id].ans !== undefined; }
function stageDone(st) {
  return st >= 1 && st <= 3 && idx(st) >= TASKS[st].length && QS[st].every(q => qDone(q.id));
}
function pen(pts, msg, type = "warn") {
  if (S.stage <= 3) S.pen[S.stage] = (S.pen[S.stage] || 0) + pts;
  S.events.push({ st: S.stage, msg: msg.replace(/<[^>]+>/g, "") });
  toast(msg, type, 3500);
  SFX.play(type === "err" ? "err" : "warn");
}

/* ============ 1-BOSQICH: ODDIY DIALIZ ============ */
function setSys1(k) {
  if (S.s1.timeMin > 0) { toast("Dializ boshlangan. Boshqa sistemani koʻrish uchun joriy siklni yakunlang.", "warn"); return; }
  S.s1.sys = k;
  SFX.play("click");
  renderPanel();
}
function toggleDialysis1() {
  S.s1.running = !S.s1.running;
  SFX.play("click");
  renderPanel();
}
function stepDialysis1(addMin) {
  const s = S.s1;
  const steps = Math.max(1, Math.round(addMin / 5));
  for (let i = 0; i < steps; i++) advanceDialysis1(addMin / steps);
  SFX.play("tick");
  renderPanel();
}
function advanceDialysis1(dMin) {
  const s = S.s1;
  if (s.timeMin >= 120) { s.running = false; return; }
  s.timeMin = Math.min(120, s.timeMin + dMin);
  s.cycleTime += dMin;
  // Eksponensial diffuziya muvozanati (ichki -> tashqi, 1:3 hajm nisbatida)
  const kRate = 0.068;
  const eqVal = (s.innerSalt + 3 * s.outerSalt) / 4;
  const diff = (s.innerSalt - eqVal) * (1 - Math.exp(-kRate * dMin));
  s.innerSalt = clamp(s.innerSalt - diff, 0, 100);
  s.outerSalt = clamp(s.outerSalt + diff / 3, 0, 100);
  const lastX = s.curve[s.curve.length - 1].x;
  if (s.timeMin - lastX >= 5) {
    s.curve.push({ x: +s.timeMin.toFixed(1), y: +s.innerSalt.toFixed(1) });
  }
}
function sampleIon1() {
  const s = S.s1;
  const cIdx = s.cycle - 1;
  if (s.cycleTime < 20) {
    pen(0.5, "Kamida 20–30 daqiqa dializ oʻtishini kuting, soʻng tashqi suvdan namuna oling!", "warn");
    return;
  }
  s.testedIon[cIdx] = true;
  const sys = SYS_DEF[s.sys];
  SFX.play("pipette");
  if (cIdx === 0) {
    toast(`1-sikl + ${sys.ionTest}: kuchli oq ${sys.ionRes} loyqasi (+++ ${sys.ionB} koʻp chiqdi)! Tashqi suvni almashtiring.`, "warn", 3800);
  } else if (cIdx === 1) {
    toast(`2-sikl + ${sys.ionTest}: kuchsiz loyqalanish (+ ${sys.ionB} ancha kamaydi). Suvni yana almashtiring.`, "warn", 3600);
  } else {
    SFX.play("ok");
    toast(`✓ 3-sikl + ${sys.ionTest}: eritma tiniq (− ${sys.ionB} qolmadi)! Oddiy dializ yakunlandi!`, "ok", 3800);
    s.running = false;
  }
  renderPanel();
}
function sampleCol1() {
  const s = S.s1;
  if (s.cycleTime < 15) { pen(0.5, "Avval dializni boshlab, kamida 15–20 daqiqa kuting.", "warn"); return; }
  s.testedCol = true;
  const sys = SYS_DEF[s.sys];
  SFX.play("ok");
  toast(`✓ Kolloid sinovi (${sys.colTest}): ${sys.colRes} — yirik kolloid zarrachalar membranadan oʻtmadi!`, "ok", 3600);
  renderPanel();
}
function replaceWater1() {
  const s = S.s1;
  const cIdx = s.cycle - 1;
  if (!s.testedIon[cIdx]) {
    pen(0.5, `Tashqi suvni almashtirishdan oldin ${s.cycle}-sikl suvini ${SYS_DEF[s.sys].ionTest} bilan sinab koʻring!`, "warn");
    return;
  }
  if (s.cycle >= 3) { toast("3 ta sikl yetarli — 3-siklda namuna olib tekshiring.", "warn"); return; }
  s.cycle++;
  s.replaced++;
  s.cycleTime = 0;
  s.outerSalt = 0;
  SFX.play("pour");
  toast(`🔄 Tashqi distillangan suv yangilandi (${s.cycle}-sikl boshlandi). Yana 30 min dializ oʻtkazing.`, "", 3200);
  renderPanel();
}

/* ============ 2-BOSQICH: ELEKTRODIALIZ ============ */
function setVolts2(v) {
  S.s2.volts = +v;
  renderPanel();
}
function togglePower2() {
  if (!S.s2.powerOn && (S.s2.volts < 6 || S.s2.volts > 12)) {
    pen(0.5, "Metodik koʻrsatma boʻyicha elektrodializ kuchlanishini <b>6–12 V</b> oraligʻida oʻrnating!", "warn");
    return;
  }
  S.s2.powerOn = !S.s2.powerOn;
  SFX.play(S.s2.powerOn ? "electric" : "click");
  if (S.s2.powerOn) toast(`⚡ Elektrodializ yoqildi (${S.s2.volts} V): Cl⁻ anodga (+), Na⁺ katodga (−) tez koʻchmoqda!`, "", 3200);
  renderPanel();
}
function stepElectro2(dMin) {
  if (S.s2.volts < 6) { pen(0.5, "Avval kuchlanishni 6–12 V ga qoʻying va manbani yoqing.", "warn"); return; }
  S.s2.powerOn = true;
  const steps = Math.max(1, Math.round(dMin));
  for (let i = 0; i < steps; i++) advanceElectro2(dMin / steps);
  SFX.play("electric");
  renderPanel();
}
function advanceElectro2(dMin) {
  const s = S.s2;
  if (s.timeMin >= 12) { s.powerOn = false; return; }
  s.timeMin = Math.min(12, s.timeMin + dMin);
  // 6-12 V da tezlik oddiy dializdan ~9x yuqori
  const kE = 0.045 * s.volts;
  s.innerSalt = clamp(s.innerSalt * Math.exp(-kE * dMin), 0.2, 100);
  const lastX = s.curve[s.curve.length - 1].x;
  if (s.timeMin - lastX >= 1) {
    s.curve.push({ x: +s.timeMin.toFixed(1), y: +s.innerSalt.toFixed(1) });
  }
  if (s.innerSalt <= 5 && !s.doneTime) {
    s.doneTime = +s.timeMin.toFixed(1);
    SFX.play("bell");
    toast(`✓ Atigi ${f1(s.doneTime, 1)} daqiqada elektrolit 95%+ chiqarildi! Endi AgNO₃ bilan tekshiring.`, "ok", 3800);
  }
}
function testElectroCl() {
  const s = S.s2;
  if (s.timeMin < 5) { pen(0.5, "Kamida 5–10 daqiqa elektrodializ oʻtishini kuting.", "warn"); return; }
  if (s.innerSalt > 8) { pen(0.5, "Markaziy kamerada hali elektrolit bor — yana bir necha daqiqa davom ettiring.", "warn"); return; }
  s.testedCl = true;
  s.powerOn = false;
  if (!s.doneTime) s.doneTime = +s.timeMin.toFixed(1);
  SFX.play("ok");
  toast(`✓ AgNO₃ sinovi: elektrodializ ${f1(s.doneTime, 1)} daqiqada yakunlandi (oddiy dializdan ~10× tez)!`, "ok", 4000);
  renderPanel();
}

/* ============ 3-BOSQICH: ULTRAFILTRATSIYA ============ */
function setSol3(k) {
  if (S.s3.poured) { toast("Zol allaqachon voronkaga quyilgan.", "warn"); return; }
  S.s3.sol = k;
  SFX.play("click");
  renderPanel();
}
function pourSol3() {
  if (S.s3.poured) return;
  S.s3.poured = true;
  SFX.play("pour");
  toast("Zol ultramembrana voronkasiga quyildi. Endi vakuum nasosini yoqing!", "", 2400);
  renderPanel();
}
function toggleVac3() {
  if (!S.s3.poured) { pen(0.5, "Avval zolni ultrafiltr voronkasiga quying.", "warn"); return; }
  if (S.s3.progress >= 99) { toast("Ultrafiltratsiya yakunlangan. Filtratni sinab koʻring.", "warn"); return; }
  S.s3.vacOn = !S.s3.vacOn;
  SFX.play(S.s3.vacOn ? "vacuum" : "click");
  if (S.s3.vacOn) toast("💨 Suv oqimli vakuum nasosi yoqildi — tiniq filtrat pastga tomchilamoqda!", "", 2800);
  renderPanel();
}
function finishVac3() {
  if (!S.s3.poured) { pen(0.5, "Avval zolni voronkaga quying.", "warn"); return; }
  S.s3.vacOn = false;
  S.s3.pressure = 65;
  S.s3.progress = 100;
  SFX.play("ok");
  toast("✓ Ultrafiltratsiya yakunlandi (≈ 5 min): filtrat tiniq, konsentrlangan kolloid membranada qoldi!", "ok", 3800);
  renderPanel();
}
function testFiltAg3() {
  if (S.s3.progress < 99) { pen(0.5, "Avval vakuum ostida ultrafiltratsiyani yakunlang.", "warn"); return; }
  S.s3.filtrateAg = true;
  SFX.play("drip");
  toast("✓ Filtrat + AgNO₃ → oq AgCl↓ loyqa: kichik Cl⁻ ionlari ultramembranadan oʻtgan!", "ok", 3600);
  renderPanel();
}
function testFiltCol3() {
  if (S.s3.progress < 99) { pen(0.5, "Avval vakuum ostida ultrafiltratsiyani yakunlang.", "warn"); return; }
  S.s3.filtrateCol = true;
  SFX.play("ok");

  toast(`✓ Kolloid tekshiruvi: ${txt}!`, "ok", 3600);
  renderPanel();
}

function renderScene() {
  const svg = el("scene");
  svg.innerHTML = sceneHTML();
  svg.querySelectorAll("[data-t]").forEach(node => {
    node.addEventListener("click", e => {
      e.stopPropagation();
      const t = node.dataset.t;
      SFX.init();
      if (t === "ionTest") sampleIon1();
      else if (t === "pwr2") togglePower2();
      else if (t === "vac3") toggleVac3();
    });
  });
}

/* ============ SAVOLLAR VA PANEL ============ */
function qBlock(Q, seed) {
  const q = S.q[Q.id] || {};
  return `<div class="q"><p>${Q.q}</p>${shuf(Q.o.length, seed).map(oi => {
    let c = "";
    if (q.ans !== undefined && oi === Q.a) c = "right";
    else if (q.wrong && q.wrong.includes(oi)) c = "wrong";
    return `<button class="${c}" onclick="ansQ('${Q.id}',${oi})" ${q.ans !== undefined || (q.wrong && q.wrong.includes(oi)) ? "disabled" : ""}>${Q.o[oi]}</button>`;
  }).join("")}</div>`;
}
function ansQ(id, i) {
  let Q;
  for (const k in QS) { Q = QS[k].find(x => x.id === id); if (Q) break; }
  const q = S.q[id] || (S.q[id] = { tries: 0, wrong: [], pts: 0 });
  if (q.ans !== undefined) return;
  q.tries++;
  if (i === Q.a) {
    q.ans = i; q.pts = q.tries === 1 ? 2 : 1;
    SFX.play("ok"); toast("✓ Toʻgʻri javob!", "ok", 1600);
  } else {
    q.wrong.push(i);
    if (q.tries >= 2) { q.ans = Q.a; SFX.play("warn"); toast("Toʻgʻri javob koʻrsatildi.", "warn", 2400); }
    else { SFX.play("err"); toast("✗ Notoʻgʻri. Yana bir urinish.", "err", 1800); }
  }
  renderPanel();
}
function tasksHTML(st) {
  const cur = idx(st);
  return `<ul class="tasks">${TASKS[st].map((t, k) => `<li class="${k < cur ? "done" : k === cur ? "cur" : ""}"><span class="b">${k < cur ? "✓" : k + 1}</span><span>${t[0]}</span></li>`).join("")}</ul>`;
}

    h += `<div class="box"><h4>Kolloid sistema (qoʻllanma variantlari)</h4>
      <div class="sys-tabs">

      </div>
      <div class="big">${f1(s.timeMin, 0)} min<small>${s.cycle}-sikl (${f1(s.cycleTime, 0)} min) · Ichki elektrolit: ${f1(s.innerSalt, 1)}%</small></div>
      <div class="row">

      </div>`).join("")}
      <div class="cyc-row"><span>Kolloid tekshiruvi (${sys.colTest})</span><span class="pill ${s.testedCol ? "ok" : ""}">${s.testedCol ? sys.colRes : "Tekshirilmagan"}</span></div>
      ${s.curve.length > 1 ? `<div style="margin-top:8px">${dialysisChart()}</div>` : ""}

    if (cur >= totT) h += QS[1].map((q, k) => `<div class="box"><h4>Nazorat savoli ${k + 1}</h4>${qBlock(q, 19 + k * 7)}</div>`).join("");
  }

  if (st === 2) {
    const s = S.s2;
    h += `<div class="sub">Uch kamerali dializatorda elektrodlarga 6–12 V doimiy kuchlanish beriladi. Kationlar katodga (−), anionlar anodga (+) tez koʻchib, tozalash vaqtini keskin qisqartiradi.</div>` + tasksHTML(2);
    h += `<div class="box"><h4>Elektr manbai (tavsiya: 6–12 V)</h4>
      <div class="kv"><span>Kuchlanish (U)</span><b>${s.volts} V</b></div>

  if (st === 3) {

    h += `<div class="sub">Kolloid zol mayda teshikli ultramembrana orqali vakuum yordamida soʻrib oʻtkaziladi: erituvchi va Cl⁻ ionlari pastga oʻtadi, kolloid zarrachalar membranada konsentrlanadi.</div>` + tasksHTML(3);
    h += `<div class="box"><h4>Ultrafiltratsiya boshqaruvi</h4>
      <div class="grid2" style="margin-bottom:8px">
        <button class="${s.sol === "fe" ? "on" : ""}" onclick="setSol3('fe')">Fe(OH)₃ + NaCl</button>

        <button class="${s.vacOn ? "on" : "dark"}" onclick="toggleVac3()" ${!s.poured || s.progress >= 99 ? "disabled" : ""}>2. 💨 Vakuum (${Math.round(s.progress)}%)</button>
        <button class="ghost" onclick="finishVac3()" ${!s.poured || s.progress >= 99 ? "disabled" : ""}>⏩ Yakunlash</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="${s.filtrateAg ? "on" : "pri"}" onclick="testFiltAg3()" ${s.progress < 99 ? "disabled" : ""}>🧪 Filtrat + AgNO₃</button>
        <button class="${s.filtrateCol ? "on" : "pri"}" onclick="testFiltCol3()" ${s.progress < 99 ? "disabled" : ""}>🔬 Kolloid tekshiruvi</button>

    </div>`;
    h += `<div class="box"><h4>Usullarni taqqoslash jadvali va grafigi</h4>

    </div>`;
    if (cur >= totT) h += QS[3].map((q, k) => `<div class="box"><h4>Nazorat savoli ${k + 1}</h4>${qBlock(q, 53 + k * 7)}</div>`).join("");
  }

  if (stageDone(st)) {
    h += `<button class="pri next" onclick="nextStage()">${st === 3 ? "📊 Hisobotni koʻrish →" : `${st + 1}-bosqichga oʻtish →`}</button>`;

  P.innerHTML = h;

}

function compareTableHTML() {

/* ============ BAHOLASH VA HISOBOT ============ */
function total() {
  let proc = 0;
  for (let k = 1; k <= 3; k++) {
    const tDone = idx(k) / TASKS[k].length;
    proc += Math.max(0, 15 * tDone - (S.pen[k] || 0));
  }
  const allQ = [1, 2, 3].flatMap(k => QS[k].map(q => q.id));
  const qp = allQ.reduce((s, id) => s + ((S.q[id] && S.q[id].pts) || 0), 0);
  const qsScore = 30 * qp / (allQ.length * 2);
  const qzScore = QZ.filter((q, i) => S.quiz[i] === q[2]).length * 5;
  const hp = Math.min(5, S.hints * 0.5);
  return {
    proc: Math.round(proc),
    qs: Math.round(qsScore),
    qz: qzScore,
    hp,
    tot: clamp(Math.round(proc + qsScore + qzScore - hp), 0, 100)
  };
}

    <div class="sub">Kolloid sistemalarni tozalash usullari · ${new Date().toLocaleDateString("uz-UZ")}</div>

    <div class="box"><h4>Ball tarkibi</h4>

        const a = S.quiz[qi];

        if (a !== undefined) { if (oi === q[2]) c = "right"; else if (oi === a) c = "wrong"; }

      }).join("")}</div>`).join("")}

    <div class="row noprint">

      <button class="ghost" onclick="if(confirm('Ishni qaytadan boshlaysizmi?'))location.reload()">↺ Qaytadan boshlash</button>
    </div>
  </div>`;
}

function quizA(qi, oi) {
  if (S.quiz[qi] !== undefined) return;
  S.quiz[qi] = oi;
  SFX.play(oi === QZ[qi][2] ? "ok" : "err");
  renderPanel();
}

/* ============ NAVIGATSIYA ============ */
function goStage(n) {
  if (n > S.unlocked) return;
  S.stage = n;
  S.s1.running = false;
  S.s2.powerOn = false;
  S.s3.vacOn = false;
  SFX.play("paper");
  renderPanel();
  el("panel").scrollTop = 0;
}
function nextStage() {
  const n = S.stage + 1;
  if (n > S.unlocked) S.unlocked = n;
  goStage(n);
}
function renderTabs() {
  el("tabs").innerHTML = STG.slice(1).map((x, i) => {
    const n = i + 1;
    const d = n <= 3 ? stageDone(n) : Object.keys(S.quiz).length === QZ.length;
    return `<button class="${n === S.stage ? "cur" : ""} ${d ? "done" : ""}" ${n > S.unlocked ? "disabled" : ""} onclick="goStage(${n})" title="${x.t}">${d ? "✓ " : ""}${n} · ${x.s}</button>`;
  }).join("");
  const sc = total().tot;
  el("chip").textContent = sc + " ball";
  LabProgress.save(LAB_ID, sc, stageDone(1) && stageDone(2) && stageDone(3));
}

/* ============ ANIMATSIYA (rAF) ============ */
let lastTs = 0, uiAccum = 0;
function tick(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  S.anim.t += dt;
  uiAccum += dt;

  // 1-bosqich: oddiy dializ simulyatsiyasi va ion diffuziyasi
  if (S.stage === 1) {
    if (S.s1.running) {
      advanceDialysis1(dt * 12); // 1 soniyada 12 min
      if (S.s1.cycleTime >= 30 && !S.s1.testedIon[S.s1.cycle - 1]) {
        S.s1.running = false;
        SFX.play("bell");
        toast(`⏰ ${S.s1.cycle}-siklda 30 daqiqa oʻtdi! Tashqi suvdan namuna olib tekshiring.`, "ok", 3200);
        renderPanel();
      } else if (uiAccum > 0.35) {
        uiAccum = 0;
        renderPanel();
      }
    }
    const dg = el("dialIons");
    if (dg) {
      let html = "";
      const outRatio = clamp(S.s1.outerSalt / 35, 0.05, 1);
      S.anim.ions.forEach((p, k) => {
        const isOut = k < Math.round(S.anim.ions.length * outRatio * 0.65);
        const ang = S.anim.t * p.spd * (S.s1.running ? 2.2 : 0.6) + k;
        const x = isOut ? (k % 2 ? 78 : -78) + Math.sin(ang) * 24 : Math.cos(ang) * 34;
        const y = -135 + Math.sin(ang * 0.8 + k) * 58;
        html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="${p.sign > 0 ? "#2563eb" : "#1f9d6b"}" opacity="0.82"/>`;
      });
      dg.innerHTML = html;
    }
  }

  // 2-bosqich: elektrodializ migratsiyasi
  if (S.stage === 2) {
    if (S.s2.powerOn) {
      advanceElectro2(dt * 1.8);
      if (S.s2.innerSalt <= 3.5) {
        S.s2.powerOn = false;
        renderPanel();
      } else if (uiAccum > 0.3) {
        uiAccum = 0;
        renderPanel();
      }
    }
    const eg = el("electroIons");
    if (eg) {
      let html = "";
      // Yirik jigarrang Fe(OH)3 mitsellalari (markazda qoladi!)
      for (let m = 0; m < 7; m++) {
        const mx = -85 + m * 28 + Math.sin(S.anim.t * 1.4 + m) * 6;
        const my = -105 + Math.cos(S.anim.t * 1.6 + m * 2) * 38;
        html += `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="#5e1406" stroke="#f0a875" stroke-width="1.3" opacity="0.88"/>`;
      }
      // Harakatlanayotgan Cl- (chapga anodga) va Na+ (o'ngga katodga)
      const drift = S.s2.powerOn ? S.s2.volts * 0.055 : 0;
      S.anim.ions.forEach((p, k) => {
        if (drift > 0) p.x = (p.x + p.sign * drift * p.spd * dt + 1) % 1;
        const cx = p.sign < 0
          ? lerp(-245, 70, p.x)
          : lerp(-70, 245, p.x);
        const cy = -165 + p.y * 140;
        html += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.2" fill="${p.sign > 0 ? "#3b82f6" : "#22c55e"}" stroke="#fff" stroke-width="0.7"/>`;
      });
      eg.innerHTML = html;
    }
  }

  // 3-bosqich: vakuumli ultrafiltratsiya
  if (S.stage === 3) {
    if (S.s3.vacOn && S.s3.progress < 100) {
      S.s3.pressure = Math.min(65, S.s3.pressure + dt * 48);
      S.s3.progress = Math.min(100, S.s3.progress + dt * 18);
      if (S.s3.progress >= 100) {
        S.s3.vacOn = false;
        SFX.play("ok");
        toast("✓ Ultrafiltratsiya yakunlandi! Filtratni AgNO₃ va kolloid sinovlari bilan tekshiring.", "ok", 3800);
        renderPanel();
      } else if (uiAccum > 0.25) {
        uiAccum = 0;
        renderPanel();
      }
    }
    const ufd = el("ufDrops");
    if (ufd && S.s3.vacOn && S.s3.progress < 100) {
      const dy = -145 + ((S.anim.t * 170) % 110);
      ufd.innerHTML = `<ellipse cx="0" cy="${dy.toFixed(1)}" rx="3.4" ry="5.5" fill="rgba(186,232,248,0.88)" stroke="#4c9bb5" stroke-width="0.8"/>`;
    } else if (ufd && ufd.innerHTML) {
      ufd.innerHTML = "";
    }
  }

  requestAnimationFrame(tick);
}

el("btnHint").addEventListener("click", smartHint);
el("btnTheory").addEventListener("click", showTheory);
renderPanel();
showIntro();
requestAnimationFrame(tick);
</script>
