/* ============ HOLAT (STATE) ============ */
const S = {
  stage: 0, // 0: 9 probirka tayyorlash, 1: Suvsiz spirt, 2: 30-60 min kuzatuv va grafik, 3: Hisobot
  speed: 30,
  numbered: false,
  selTube: 5, // 1..9
  manualFilledCount: 0,
  tubes: TABLE2.map(r => ({
    id: r.id,
    ac01: false, naac: false, ac10: false, h2o: false, gel: false,
    etMl: 0,
    swirled: false
  })),
  // Stage 2: Etanol
  etThreshold: 4.6, // #5 probirkada dastlabki sal loyqalanish hajmi (ml)
  etRecorded: null, // qayd etilgan spirt hajmi (ml)
  etAllDone: false,
  pourAnim: null,   // { tubeId, color, t }
  // Stage 3: 30-60 min kutish va tahlil
  agingRun: false,
  agingMin: 0,      // 0..60 daqiqa
  inspectTube: 5,
  ienGuess: null,
  ienOk: false,
  clearGuess: null,
  clearOk: false,
  q: { s1: {}, s2: {}, s3: {} },
  quiz: {}
};

function tubeFilled(t) {
  const r = TABLE2[t.id - 1];
  const needAc01 = r.ac01 > 0 ? t.ac01 : true;
  const needAc10 = r.ac10 > 0 ? t.ac10 : true;
  const needH2o = r.h2o > 0 ? t.h2o : true;
  return needAc01 && t.naac && needAc10 && needH2o && t.gel;
}

function tubeVol(t) {
  const r = TABLE2[t.id - 1];
  let v = 0;
  if (t.ac01) v += r.ac01;
  if (t.naac) v += r.naac;
  if (t.ac10) v += r.ac10;
  if (t.h2o) v += r.h2o;
  if (t.gel) v += r.gel;
  return v + t.etMl;
}

function allTubesPrepared() {
  return S.numbered && S.tubes.every(tubeFilled);
}

// Har bir probirkadagi joriy loyqalik (0..100)
function getTubeTurbidity(id) {
  const t = S.tubes[id - 1];
  const r = TABLE2[id - 1];
  if (t.etMl <= 0) return 0;
  // 2-bosqichda #5 probirkada dastlabki sal loyqalanish (spirt >= 4.4 ml)
  const initialFaint = id === 5 && t.etMl >= S.etThreshold - 0.2
    ? clamp((t.etMl - (S.etThreshold - 0.4)) * 18, 0, 26)
    : 0;
  if (S.agingMin <= 0) return initialFaint;
  // 3-bosqich: 0..60 min davomida rivojlanish
  const speedFactor = id === 5 ? 1.45 : (id === 4 || id === 6 || id === 7) ? 1.05 : 0.78;
  const prog = clamp(1 - Math.exp(-(S.agingMin / 22) * speedFactor), 0, 1);
  // Agar spirt yetarli quyilgan bo'lsa (kamida 4.2 ml)
  const etScale = clamp(t.etMl / S.etThreshold, 0, 1.15);
  return clamp(Math.max(initialFaint, r.maxTurb * prog * etScale), 0, 100);
}

function getTubeFloc(id) {
  const r = TABLE2[id - 1];
  if (S.agingMin < 12 || S.tubes[id - 1].etMl < 3.5) return 0;
  const prog = clamp((S.agingMin - 12) / 38, 0, 1);
  return r.floc * prog;
}

/* ============ BALLAR HISOBI (0..100) ============ */
function total() {
  // Stage 1: 20 amaliy + 6 savol = 26
  const filledCnt = S.tubes.filter(tubeFilled).length;
  let p1 = (S.numbered ? 4 : 0) + Math.round((filledCnt / 9) * 16);
  let q1 = STAGE_QS[0].reduce((a, q) => a + (S.q.s1[q.id] === q.ok ? 3 : 0), 0);

  // Stage 2: 18 amaliy + 6 savol = 24
  let p2 = (S.etRecorded !== null ? 9 : 0) + (S.etAllDone ? 9 : 0);
  let q2 = STAGE_QS[1].reduce((a, q) => a + (S.q.s2[q.id] === q.ok ? 3 : 0), 0);

  // Stage 3: 24 amaliy + 6 savol = 30
  let p3 = (S.agingMin >= 30 ? 8 : Math.round((S.agingMin / 30) * 8)) + (S.ienOk ? 8 : 0) + (S.clearOk ? 8 : 0);
  let q3 = STAGE_QS[2].reduce((a, q) => a + (S.q.s3[q.id] === q.ok ? 3 : 0), 0);

  // Quiz: 5 * 4 = 20
  let qz = QUIZ.reduce((a, q) => a + (S.quiz[q.id] === q.ok ? 4 : 0), 0);
  const tot = p1 + q1 + p2 + q2 + p3 + q3 + qz;
  return { p1, q1, p2, q2, p3, q3, qz, tot };
}

function stageDone(i) {
  if (i === 0) return allTubesPrepared() && STAGE_QS[0].every(q => S.q.s1[q.id] === q.ok);
  if (i === 1) return S.etAllDone && STAGE_QS[1].every(q => S.q.s2[q.id] === q.ok);
  if (i === 2) return S.agingMin >= 30 && S.ienOk && S.clearOk && STAGE_QS[2].every(q => S.q.s3[q.id] === q.ok);
  return false;
}

const TAB_NAMES = ["1. 9 probirka (2-jadval)", "2. Spirt bilan degidratlash", "3. 30–60 min & Grafik", "4. Hisobot"];
function renderTabs() {
  const t = total();
  const doneAll = stageDone(0) && stageDone(1) && stageDone(2) && QUIZ.every(q => S.quiz[q.id] !== undefined);
  el("chip").textContent = `${t.tot} / 100 ball`;
  el("tabs").innerHTML = TAB_NAMES.map((nm, i) => {
    const cls = [S.stage === i ? "cur" : "", (i < 3 && stageDone(i)) || (i === 3 && doneAll) ? "done" : ""].join(" ");
    return `<button class="${cls}" onclick="goStage(${i})">${nm}</button>`;
  }).join("");
  LabProgress.save(LAB_ID, t.tot, doneAll || t.tot >= 75);
}

window.goStage = function(i) {
  if (i === 1 && !allTubesPrepared()) {
    SFX.play("warn");
    return toast("Avval 1-bosqichda barcha 9 ta probirkani 2-jadval boʻyicha toʻldiring!", "warn");
  }
  if (i === 2 && !S.etAllDone) {
    SFX.play("warn");
    return toast("Avval 2-bosqichda barcha 9 ta probirkaga suvsiz etil spirt quying!", "warn");
  }
  SFX.play("click");
  S.stage = i;
  if (i === 1) S.selTube = 5;
  renderAll();
};

/* ============ ANIMATSIYA (requestAnimationFrame) ============ */
let lastTs = performance.now();
let animPhase = 0;

function tick(now) {
  const dt = Math.min(0.08, (now - lastTs) / 1000);
  lastTs = now;
  animPhase += dt;

  if (S.pourAnim) {
    S.pourAnim.t += dt;
    if (S.pourAnim.t > 0.65) S.pourAnim = null;
  }

  let quickUpdate = false;
  if (S.agingRun && S.agingMin < 60) {
    const prevMin = Math.floor(S.agingMin);
    S.agingMin = clamp(S.agingMin + dt * (S.speed / 8), 0, 60);
    if (Math.floor(S.agingMin) !== prevMin) quickUpdate = true;
    if (S.agingMin >= 60) {
      S.agingRun = false;
      SFX.play("bell");
      toast("60 daqiqa oʻtdi! 5-probirkada pagʻa-pagʻa choʻkma, #1 va #9 esa toʻliq tiniq!", "ok", 4500);
      quickUpdate = true;
    }
  }

  updateSceneLive();
  if (quickUpdate) {
    const clk = el("agingClock");
    if (clk) clk.innerHTML = `${Math.floor(S.agingMin)} min<small>Kutish vaqti (30–60 min)</small>`;
    if (S.stage === 2 && (Math.floor(S.agingMin) % 5 === 0 || S.agingMin >= 60)) {
      renderPanel();
    }
    renderTabs();
  }
  requestAnimationFrame(tick);
}

    const liqY = 444 - liqH;
    const isSel = (S.stage === 0 || S.stage === 1) ? S.selTube === id : S.inspectTube === id;
    const isDone = S.stage === 0 ? tubeFilled(t) : (S.stage === 1 ? t.etMl > 0 : false);

    tubesHtml += `<g class="clk ${isSel ? "glow" : ""}" onclick="${clickFn}(${id})">
      <!-- Probirka tanasi -->
      <path d="M${x - 19},260 L${x - 19},430 Q${x - 19},450 ${x},450 Q${x + 19},450 ${x + 19},430 L${x + 19},260" fill="#f1fafc" fill-opacity="0.58" stroke="${isSel ? "#e89b3c" : "#44656b"}" stroke-width="${isSel ? 2.8 : 2}"/>

        <path d="M${x - 17},262 L${x - 17},429 Q${x - 17},448 ${x},448 Q${x + 17},448 ${x + 17},429 L${x + 17},262 Z"/>
      </clipPath>
      <g clip-path="url(#tc${id})">

function renderScene() {
  const svg = el("scene");
  if (S.stage === 0) svg.innerHTML = buildScene1();
  else if (S.stage === 1) svg.innerHTML = buildScene2();
  else if (S.stage === 2) svg.innerHTML = buildScene3();
  else svg.innerHTML = buildSceneReport();
  updateSceneLive();
}

function updateSceneLive() {
  // Har bir probirkadagi loyqalik va pag'a-pag'a cho'kmani yangilash
  if (S.stage <= 2) {
    TABLE2.forEach(r => {
      const id = r.id;
      const tb = getTubeTurbidity(id);
      const fl = getTubeFloc(id);
      const turbEl = el(`tTurb${id}`);
      if (turbEl) turbEl.setAttribute("opacity", (tb / 100 * 0.92).toFixed(3));
      const pctEl = el(`tPct${id}`);
      if (pctEl) pctEl.textContent = `${Math.round(tb)}%`;

      const flEl = el(`tFloc${id}`);
      if (flEl) {
        if (fl > 0.04) {
          const x = tubeX(id);
          const cnt = Math.floor(4 + fl * 18);
          let html = "";
          // Cho'kma tagida oq qatlam
          const sedH = fl * 26;
          html += `<rect x="${x - 17}" y="${(448 - sedH).toFixed(1)}" width="34" height="${(sedH + 4).toFixed(1)}" fill="#fffdf6" opacity="0.95"/>`;
          // Sekin cho'kayotgan pag'a-pag'a iviqlar
          for (let i = 0; i < cnt; i++) {
            const sx = x - 12 + ((i * 19 + id * 7) % 24);
            const drop = ((animPhase * 8 + i * 23) % 72);
            const sy = 342 + drop * (0.65 + fl * 0.35);
            const rr = 2 + (i % 3) * 1.1;
            html += `<circle cx="${sx.toFixed(1)}" cy="${Math.min(443, sy).toFixed(1)}" r="${rr}" fill="#ffffff" stroke="#d5d0be" stroke-width="0.6" opacity="0.92"/>`;
          }
          flEl.innerHTML = html;
        } else {
          flEl.innerHTML = "";
        }
      }
    });

    // Tomchi animatsiyasi
    const dr = el("pourDrops");
    if (dr) {
      if (S.pourAnim) {
        const px = tubeX(S.pourAnim.tubeId);
        const py = lerp(246, 360, clamp(S.pourAnim.t / 0.65, 0, 1));
        dr.innerHTML = `<ellipse cx="${px}" cy="${py.toFixed(1)}" rx="3.5" ry="6" fill="${S.pourAnim.color}" stroke="#5b95aa" stroke-width="0.8"/>`;
      } else {
        dr.innerHTML = "";
      }
    }

    const st = el("svgTimerTxt");
    if (st) {
      const m = Math.floor(S.agingMin);
      const sec = Math.floor((S.agingMin - m) * 60);
      st.textContent = `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }
  }
}

/* ============ AMALLAR ============ */
window.actNum = function() {
  if (S.numbered) return toast("Probirkalar allaqachon 1 dan 9 gacha raqamlangan.", "warn");
  S.numbered = true;
  SFX.play("paper");
  toast("Mum qalam bilan barcha 9 ta probirka #1–#9 raqamlandi!", "ok");
  renderAll();
};

window.selectTube = function(id) {
  S.selTube = id;
  SFX.play("click");
  renderAll();
};

window.addReag = function(key) {
  if (!S.numbered) return toast("Avval mum qalam bilan probirkalarni raqamlang!", "warn");
  const r = TABLE2[S.selTube - 1];
  const t = S.tubes[S.selTube - 1];
  if (r[key] === 0) return toast(`#${S.selTube} probirka uchun 2-jadvalda bu reaktiv kerak emas (—)!`, "warn");
  if (t[key]) return toast(`Bu reaktiv #${S.selTube} probirkaga allaqachon quyilgan.`, "warn");
  const wasFilled = tubeFilled(t);
  t[key] = true;
  S.pourAnim = { tubeId: S.selTube, color: key === "gel" ? "#f5e3aa" : "#bceaf7", t: 0 };
  SFX.play(key === "gel" || key === "naac" ? "pipette" : "pour");
  if (!wasFilled && tubeFilled(t)) {
    S.manualFilledCount++;
    SFX.play("ok");
    toast(`#${S.selTube} probirka (pH ${f1(r.pH, 1)}) toʻliq 8,00 ml ga toʻldirildi!`, "ok");
  }
  renderAll();
};

window.fillOneQuick = function(id) {
  if (!S.numbered) S.numbered = true;
  const r = TABLE2[id - 1];
  const t = S.tubes[id - 1];
  if (r.ac01 > 0) t.ac01 = true;
  t.naac = true;
  if (r.ac10 > 0) t.ac10 = true;
  if (r.h2o > 0) t.h2o = true;
  t.gel = true;
  S.pourAnim = { tubeId: id, color: "#f5e3aa", t: 0 };
  SFX.play("pour");
  toast(`#${id} probirka 2-jadval boʻyicha 8,00 ml qilib tayyorlandi.`, "ok");
  renderAll();
};

window.fillRestAuto = function() {
  if (!S.numbered) return toast("Avval mum qalam bilan raqamlang!", "warn");
  const filledCnt = S.tubes.filter(tubeFilled).length;
  if (filledCnt < 2) return toast("Avval kamida 2 ta probirkani (jumladan #5 ni) qoʻlda toʻldirib koʻring!", "warn");
  TABLE2.forEach((r, i) => {
    const t = S.tubes[i];
    if (r.ac01 > 0) t.ac01 = true;
    t.naac = true;
    if (r.ac10 > 0) t.ac10 = true;
    if (r.h2o > 0) t.h2o = true;
    t.gel = true;
  });
  SFX.play("ok");
  toast("Qolgan barcha probirkalar 2-jadval boʻyicha aniq 8,00 ml qilib toʻldirildi!", "ok");
  renderAll();
};

window.selectTube2 = function(id) {

    SFX.play("warn");

  }

  SFX.play("click");

};

window.dripEthanol = function(amt = 0.4) {
  if (S.etRecorded === null && S.selTube !== 5) {
    SFX.play("warn");
    return toast("Avval #5 probirkaga (pH = 4,7) spirt tomizing!", "warn");
  }
  const t = S.tubes[S.selTube - 1];
  if (S.etRecorded === null) {
    if (t.etMl >= 7.0) return toast("Spirt meʼyordan oshib ketdi — #5 probirkani qayta boshlang yoki hajmni qayd eting.", "warn");
    t.etMl = +(t.etMl + amt).toFixed(1);
    S.pourAnim = { tubeId: 5, color: "#d6eeff", t: 0 };
    SFX.play("drip");
    if (t.etMl >= S.etThreshold - 0.1 && t.etMl <= S.etThreshold + 0.5) {
      toast(`#5 probirkada (${f1(t.etMl, 1)} ml) yengil loyqalanish paydo boʻldi! Endi hajmni qayd eting.`, "ok", 4200);
    }
  } else {
    if (t.etMl > 0) return toast(`#${S.selTube} probirkaga allaqachon ${f1(t.etMl, 1)} ml spirt quyilgan.`, "warn");
    t.etMl = S.etRecorded;
    t.swirled = true;
    S.pourAnim = { tubeId: S.selTube, color: "#d6eeff", t: 0 };
    SFX.play("pour");
    if (S.tubes.every(x => x.etMl > 0)) {
      S.etAllDone = true;
      SFX.play("ok");
      toast("Barcha 9 ta probirkaga bir xil hajmda suvsiz etil spirt quyildi! 3-bosqichga oʻting.", "ok", 4500);
    }
  }
  renderAll();
};

window.swirlTube5 = function() {
  S.tubes[4].swirled = true;
  SFX.play("shake");
  toast("#5 probirka chayqatib aralashtirildi.", "");
  renderAll();
};

window.recordEthanol5 = function() {
  const v = S.tubes[4].etMl;
  if (v < S.etThreshold - 0.3) {
    SFX.play("warn");
    return toast(`Hali eritma tiniq (${f1(v, 1)} ml)! Sal loyqalanish paydo boʻlguncha (~4,6 ml) spirt qoʻshing.`, "warn", 3800);
  }
  S.etRecorded = v;
  S.tubes[4].swirled = true;
  SFX.play("ok");
  toast(`Qayd etildi: V(spirt) = ${f1(v, 1)} ml! Endi qolgan 8 ta probirkaga ham aynan ${f1(v, 1)} ml dan quying.`, "ok", 4500);
  renderAll();
};

window.pourEthanolAllRest = function() {
  if (S.etRecorded === null) return toast("Avval #5 probirkada kerakli spirt hajmini aniqlab qayd eting!", "warn");
  S.tubes.forEach(t => { t.etMl = S.etRecorded; t.swirled = true; });
  S.etAllDone = true;
  SFX.play("shake");
  setTimeout(() => SFX.play("ok"), 320);
  toast(`Barcha 9 ta probirkaga bir xil ${f1(S.etRecorded, 1)} ml dan suvsiz etil spirt quyilib chayqatildi!`, "ok", 4500);
  renderAll();
};

/* Stage 3: Kutish va tahlil */
window.inspectTube3 = function(id) {
  S.inspectTube = id;
  SFX.play("click");
  renderAll();
};

window.toggleAging = function() {
  if (S.agingMin >= 60) S.agingMin = 0;
  S.agingRun = !S.agingRun;
  SFX.play(S.agingRun ? "beep" : "click");
  renderAll();
};

window.jumpAging = function(mins) {
  S.agingRun = false;
  S.agingMin = mins;
  SFX.play("bell");
  toast(`Vaqt ${mins} daqiqaga oʻtkazildi. Probirkalardagi loyqalik va choʻkmani tahlil qiling!`, "ok");
  renderAll();
};

window.guessIEN = function(phVal) {
  if (S.agingMin < 30) return toast("Avval kamida 30 daqiqa kutish natijasini kuzating!", "warn");
  S.ienGuess = phVal;
  if (phVal === 4.7) {
    S.ienOk = true; SFX.play("ok");
    toast("Toʻgʻri! Jelatinaning izoelektrik nuqtasi pH = 4,7 (#5 probirka).", "ok");
  } else {
    SFX.play("err");
    toast("Qayta qarang: eng kuchli loyqalanish va pagʻa-pagʻa choʻkma qaysi probirkada?", "err");
  }
  renderAll();
};

window.guessClear = function(pair) {
  if (S.agingMin < 30) return toast("Avval kamida 30 daqiqa kutish natijasini kuzating!", "warn");
  S.clearGuess = pair;
  if (pair === "1-9") {
    S.clearOk = true; SFX.play("ok");
    toast("Toʻgʻri! #1 (pH 6,0) va #9 (pH 3,5) kuchli zaryad tufayli toʻliq tiniq qoldi.", "ok");
  } else {
    SFX.play("err");
    toast("Shtativdagi eng chetki probirkalarga qarang — qaysilari 0% loyqalikda qoldi?", "err");
  }
  renderAll();
};

window.ansStageQ = function(stageIdx, qid, optIdx) {
  const qObj = STAGE_QS[stageIdx].find(x => x.id === qid);
  const store = stageIdx === 0 ? S.q.s1 : stageIdx === 1 ? S.q.s2 : S.q.s3;
  store[qid] = optIdx;
  SFX.play(optIdx === qObj.ok ? "ok" : "err");
  if (optIdx === qObj.ok) toast("Toʻgʻri javob! (+3 ball)", "ok");
  else toast("Notoʻgʻri. Qayta urinib koʻring!", "err");
  renderAll();
};

window.ansQuiz = function(qid, optIdx) {
  const qObj = QUIZ.find(x => x.id === qid);
  S.quiz[qid] = optIdx;
  SFX.play(optIdx === qObj.ok ? "ok" : "err");
  renderAll();
};

/* ============ YON PANEL ============ */
function renderStageQs(stageIdx) {
  const store = stageIdx === 0 ? S.q.s1 : stageIdx === 1 ? S.q.s2 : S.q.s3;
  return `<div class="box"><h4>Nazorat savollari</h4>` +
    STAGE_QS[stageIdx].map((q, qi) => {
      const order = shuf(q.opts.length, 51 + stageIdx * 19 + qi * 11);
      const picked = store[q.id];
      return `<div class="q"><p>${q.p}</p>` +
        order.map(oi => {
          const cls = picked === oi ? (oi === q.ok ? "right" : "wrong") : "";
          return `<button class="${cls}" onclick="ansStageQ(${stageIdx},'${q.id}',${oi})">${q.opts[oi]}</button>`;
        }).join("") + `</div>`;
    }).join("") + `</div>`;
}

function turbidityChart() {
  return svgChart({
    title: "Jelatina loyqaligi (%) ning pH ga bogʻlanishi (IEN = 4,7)",
    xl: "pH", yl: "Loyqalik, %",
    x0: 3.3, xm: 6.2, y0: 0, ym: 105,
    series: [{
      color: "#d18224",
      dot: "#0f2e33",
      pts: TABLE2.map(r => ({ x: r.pH, y: +getTubeTurbidity(r.id).toFixed(1) }))
    }]
  });
}

  el("panel").innerHTML = `<div class="rep">
    <h2>5-laboratoriya hisoboti</h2>
    <div class="score">
      <div class="n">${t.tot}</div>
      <div><b>${grade}</b><br><span style="font-size:12px;opacity:.82">1-bosqich: ${t.p1 + t.q1}/26 · 2-bosqich: ${t.p2 + t.q2}/24 · 3-bosqich: ${t.p3 + t.q3}/30 · Test: ${t.qz}/20</span></div>
    </div>

    document.querySelectorAll("[data-sp]").forEach(b => b.classList.toggle("on", +b.dataset.sp === S.speed));
    SFX.play("click");
    toast(`Vaqt tezligi: ×${S.speed}`, "", 1800);
  });
});
el("btnTable").addEventListener("click", () => { SFX.play("click"); showJournal(); });
el("btnHint").addEventListener("click", () => { SFX.play("click"); showHint(); });
el("btnTheory").addEventListener("click", () => { SFX.play("click"); showTheory(); });

renderAll();
showIntro();
requestAnimationFrame(tick);
</script>
</body>
