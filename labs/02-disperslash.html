<script>
"use strict";

const LAB_ID = 2;
const { el, clamp, lerp, f1, shuf, toast, modal, closeModal } = LabUI;

/* ============ HOLAT (STATE) ============ */
const S = {
  stage: 1,
  unlocked: 1,
  hints: 0,
  pen: { 1: 0, 2: 0, 3: 0 },
  events: [],
  q: {},
  quiz: {},
  // 1-bosqich: H2SnO3 cho'kmasi va 3 marta dekantatsiya
  s1: {
    snAdded: 0,      // 1 n SnCl4 tomchi/dozalar (maqsad >= 3)
    precipDone: false,
    washes: 0,       // bajarilgan yuvishlar (0..3)
    tested: [false, false, false], // har bir yuvish suvi AgNO3 bilan tekshirilganmi
    clConc: [0.42, 0.14, 0.02, 0.0], // mol/l shartli Cl- konsentratsiyasi
    tiltT: 0
  },
  // 2-bosqich: Peptizatsiya
  s2: {
    pept: "HCl",     // "HCl" (0,1 n) yoki "NaOH" (1 n)
    drops: 0,        // peptizator tomchilari (maqsad >= 3)
    diluted: false,  // ko'p suv qo'shish
    shaken: false,   // chayqatish -> zolga o'tish
    solProgress: 0,  // 0 (cho'kma) .. 1 (opalesent zol)
    laser: false,
    shakeT: 0
  },
  // 3-bosqich: Emulsiya tayyorlash
  s3: {
    sub: "A",        // "A" (benzol + sovun) yoki "B" (bura + pista moyi)
    // A: Benzol + suv + sovun
    aWater: false,   // 50 ml H2O
    aBenz: false,    // 10 ml benzol
    aShaken1: false, // sovunsiz chayqatish -> ajraladi
    aSepPhase: 1,    // 0 (aralashgan) .. 1 (2 qavatga ajralgan)
    aSoap: false,    // 10 ml 2% sovun
    aStable: false,  // sovun bilan barqaror emulsiya
    aShakeT: 0,
    // B: Bura (ZEC 21) + 95 ml H2O + isitish + 2-3 ml pista moyi
    bMass: 0.0,      // tarozida tortilgan bura (maqsad 4.0 - 5.0 g)
    bWeighed: false,
    bDissolved: false, // 95 ml H2O da isitib eritilgan
    bTransferred: false,
    bOil: false,     // 2-3 ml pista moyi
    bStable: false,
    bShakeT: 0
  },
  anim: {
    t: 0,
    drops: [],
    bubbles: []
  }
};

const STG = [
  null,
  { s: "H₂SnO₃ va yuvish", t: "Stannat kislota choʻkmasini olish va dekantatsiya" },
  { s: "Peptizatsiya", t: "Choʻkmani kislota yoki ishqor bilan peptizlash" },
  { s: "Emulsiyalar", t: "Benzol va pista moyining barqaror emulsiyalari" },
  { s: "Hisobot", t: "Laboratoriya ishi hisoboti" }
];

const TASKS = {
  1: [
    ["Qaynab turgan 200 ml suvga 1 n SnCl₄ eritmasini tomchilab qoʻshib, oq H₂SnO₃ choʻkmasini oling", () => S.s1.precipDone],
    ["Choʻkmani qaynoq distillangan suv bilan 3 marta dekantatsiya qilib yuving", () => S.s1.washes >= 3],
    ["Har uchala yuvish suvini 0,1 n AgNO₃ bilan tekshirib, Cl⁻ ionlari yoʻqolganini tasdiqlang", () => S.s1.tested.every(Boolean)]
  ],
  2: [
    ["Yuvilgan H₂SnO₃ choʻkmasiga peptizator (0,1 n HCl yoki 1 n NaOH) dan bir necha tomchi qoʻshing", () => S.s2.drops >= 3],
    ["Distillangan suv bilan suyultiring va chayqatib opalesent stannat kislota zolini hosil qiling", () => S.s2.shaken]
  ],
  3: [
    ["A qism: 50 ml H₂O + 10 ml benzolni chayqatib qavatlarga ajralishini kuzating, soʻng 10 ml 2% sovun qoʻshib barqaror emulsiya oling", () => S.s3.aStable],
    ["B qism: ZEC 21 tarozida 4–5 g bura torting, 95 ml suvda isitib eriting va 2–3 ml pista moyi qoʻshib barqaror emulsiya oling", () => S.s3.bStable]
  ]
};

const QS = {
  1: [
    {
      id: "q1_1",
      q: "Nima uchun H₂SnO₃ choʻkmasini peptizlashdan oldin qaynoq suv bilan dekantatsiya qilib Cl⁻ ionlaridan yuvish shart?",
      o: [
        "Ortiqcha HCl (Cl⁻ ionlari) elektrolit boʻlib, zol hosil boʻlishiga toʻsqinlik qiladi va koagullanishni keltirib chiqaradi",
        "Yuvish natijasida choʻkma qora rangga boʻyaladi",
        "Suv qoʻshilmasa, SnCl₄ muzlab qoladi",
        "Cl⁻ ionlari shishani eritib yuboradi"
      ],
      a: 0
    },
    {
      id: "q1_2",
      q: "3-dekantatsiyadan keyin yuvish suviga 0,1 n AgNO₃ tomizilganda eritma tiniq qolishi nimani anglatadi?",
      o: [
        "Yuvish suvida Cl⁻ ionlari qolmagan (AgCl choʻkmasi hosil boʻlmadi) — choʻkma toʻliq yuvilgan",
        "AgNO₃ eritmasi yaroqsiz boʻlib qolgan",
        "H₂SnO₃ choʻkmasi toʻliq erib ketgan",
        "Suvda natriy ionlari koʻpayib ketgan"
      ],
      a: 0
    }
  ],
  2: [
    {
      id: "q2_1",
      q: "Peptizatsiya jarayonining fizik-kimyoviy mohiyati qanday?",
      o: [
        "Yangi tushgan gʻovak choʻkmani oz miqdor peptizator-elektrolit taʼsirida kolloid eritma (zol) holatiga oʻtkazish",
        "Kolloid eritmani qizdirib choʻkmaga tushirish",
        "Ikki xil gazni aralashtirib aerozol olish",
        "Kolloid zarrachalarni filtr qogʻozdan oʻtkazish"
      ],
      a: 0
    },
    {
      id: "q2_2",
      q: "H₂SnO₃ choʻkmasi 0,1 n HCl bilan peptizlanganda hosil boʻladigan mitsella formulasida potensial aniqlovchi ion qaysi?",
      o: [
        "SnO²⁺ (mitsella: {[H₂SnO₃]ₘ · nSnO²⁺ · 2(n−x)Cl⁻}²ˣ⁺ · 2xCl⁻)",
        "Na⁺ (mitsella: {[H₂SnO₃]ₘ · nNa⁺})",
        "SO₄²⁻ ionlari",
        "OH⁻ ionlari"
      ],
      a: 0
    }
  ],
  3: [
    {
      id: "q3_1",
      q: "Sovun qoʻshilmagan «suv + benzol» aralashmasi chayqatilgandan soʻng nima uchun tezda ikki qavatga ajraladi?",
      o: [
        "Faza chegarasidagi sirt taranglik katta va tomchilar birlashishiga (koalessensiyaga) qarshilik koʻrsatuvchi himoya qavati yoʻq",
        "Benzol suvda kimyoviy reaksiyaga kirishib choʻkadi",
        "Benzolning zichligi suvnikidan ancha katta",
        "Suv molekulalari benzolni muzlatib qoʻyadi"
      ],
      a: 0
    },
    {
      id: "q3_2",
      q: "Sovun (R–COONa) benzolning suvdagi emulsiyasini qanday barqarorlashtiradi?",
      o: [
        "Tomchilar sirtida adsorbsiya qavati hosil qiladi: gidrofob R− radikali benzolga, qutbli −COO⁻ guruhi suvga yoʻnaladi",
        "Benzolni butunlay suvga aylantiradi",
        "Suvning qaynash haroratini 200 °C ga koʻtaradi",
        "Benzol tomchilarini qattiq muzga aylantiradi"
      ],
      a: 0
    }
  ]
};

const QZ = [
  ["Disperslash usuli kondensatsion usuldan nimasi bilan farq qiladi?", ["Yirik qattiq yoki suyuq fazani kolloid oʻlchamgacha maydalashga asoslanadi", "Ionlardan yangi molekula sintez qilishga asoslanadi", "Faqat gazsimon moddalarga qoʻllaniladi", "Eritmani sovitib kristallashga asoslanadi"], 0],
  ["SnCl₄ qaynoq suvda gidrolizlanganda qaysi choʻkma hosil boʻladi?", ["Stannat kislota — H₂SnO₃ (Sn(OH)₄ dan suv ajralishi natijasida)", "Kumush xlorid — AgCl", "Temir (III) gidroksid — Fe(OH)₃", "Kalsiy karbonat — CaCO₃"], 0],
  ["H₂SnO₃ choʻkmasiga 1 n NaOH qoʻshilganda qaysi kimyoviy reaksiya natijasida stabilizator hosil boʻladi?", ["H₂SnO₃ + 2NaOH → Na₂SnO₃ + 2H₂O", "H₂SnO₃ + 2NaOH → SnCl₄ + 2H₂O", "H₂SnO₃ + NaOH → NaCl + O₂", "Sn + 2NaOH → Na₂O + H₂"], 0],
  ["Pista moyining suvdagi emulsiyasini tayyorlashda emulgator sifatida qaysi modda va qancha miqdorda olinadi?", ["4–5 g bura (95 ml suvda isitib eritiladi)", "100 g osh tuzi", "0,5 ml xlorid kislota", "20 g oltingugurt kukuni"], 0],
  ["Benzolning suvdagi emulsiyasi qaysi tipdagi emulsiyaga kiradi?", ["«Moy/suv» (M/S) tipidagi toʻgʻri emulsiya", "«Suv/moy» (S/M) tipidagi teskari emulsiya", "Qattiq aerozol", "Molekulyar chin eritma"], 0]
];

/* ============ YORDAMCHILAR ============ */
function idx(st) {
  const list = TASKS[st] || [];
  for (let i = 0; i < list.length; i++) if (!list[i][1]()) return i;
  return list.length;
}
function qDone(id) { return S.q[id] && S.q[id].ans !== undefined; }
function stageDone(st) {
  return st >= 1 && st <= 3 && idx(st) >= TASKS[st].length && QS[st].every(q => qDone(q.id));
}
function pen(pts, msg, type = "warn") {
  if (S.stage <= 3) S.pen[S.stage] = (S.pen[S.stage] || 0) + pts;
  S.events.push({ st: S.stage, msg: msg.replace(/<[^>]+>/g, "") });
  toast(msg, type, 3500);
  SFX.play(type === "err" ? "err" : "warn");
}
function spawnDrop(x, y0, y1, color, r = 4.2) {
  S.anim.drops.push({ x, y: y0, vy: 95, targetY: y1, color, r });
}

/* ============ 1-BOSQICH AMALLARI ============ */
function addSnCl4() {
  if (S.stage !== 1) return;
  if (S.s1.precipDone) { toast("H₂SnO₃ choʻkmasi tayyor. Endi dekantatsiya qilib yuving.", "warn"); return; }
  S.s1.snAdded++;
  spawnDrop(290, 215, 360, "#e6eef2", 4.6);
  SFX.play("drip");
  if (S.s1.snAdded >= 3) {
    S.s1.precipDone = true;
    SFX.play("ok");
    toast("✓ Oq gʻovak H₂SnO₃ choʻkmasi tushdi! Endi qaynoq suv bilan 3 marta dekantatsiya qiling.", "ok", 3600);
  } else {
    toast(`1 n SnCl₄ tomizildi (${S.s1.snAdded}/3) — gidroliz bormoqda...`, "", 1800);
  }
  renderPanel();
}
function decantWash() {
  if (S.stage !== 1) return;
  if (!S.s1.precipDone) { pen(0.5, "Avval 1 n SnCl₄ tomizib H₂SnO₃ choʻkmasini oling.", "warn"); return; }
  if (S.s1.washes >= 3) { toast("3 marta yuvish bajarildi. Barcha probirkalarni AgNO₃ bilan tekshiring.", "warn"); return; }
  if (S.s1.washes > 0 && !S.s1.tested[S.s1.washes - 1]) {
    pen(0.5, `Avval ${S.s1.washes}-yuvish suvini AgNO₃ bilan tekshirib koʻring!`, "warn");
    return;
  }
  S.s1.washes++;
  S.s1.tiltT = 0.95;
  SFX.play("pour");
  toast(`💧 ${S.s1.washes}-dekantatsiya bajarildi! Endi ${S.s1.washes}-probirkaga 0,1 n AgNO₃ tomizib Cl⁻ ni tekshiring.`, "", 3200);
  renderPanel();
}
function testAgWash(k) {
  if (S.stage !== 1) return;
  if (k + 1 > S.s1.washes) { pen(0.5, `Avval ${k + 1}-yuvishni (dekantatsiyani) bajaring.`, "warn"); return; }
  if (S.s1.tested[k]) { toast(`${k + 1}-probirka allaqachon tekshirilgan.`, "", 1600); return; }
  S.s1.tested[k] = true;
  spawnDrop([725, 805, 885][k], 240, 395, "#e0eef5", 4.2);
  SFX.play("drip");
  if (k === 0) toast("1-yuvish + AgNO₃: kuchli oq AgCl↓ loyqasi (+++ Cl⁻ koʻp!). Yana yuving.", "warn", 3400);
  else if (k === 1) toast("2-yuvish + AgNO₃: kuchsiz loyqalanish (+ Cl⁻ kamaydi). 3-marta yuving.", "warn", 3400);
  else {
    SFX.play("ok");
    toast("✓ 3-yuvish + AgNO₃: eritma mutlaqo tiniq (− Cl⁻ yoʻq)! Choʻkma peptizatsiyaga tayyor!", "ok", 3800);
  }
  renderPanel();
}

/* ============ 2-BOSQICH AMALLARI ============ */
function setPept(type) {
  if (S.s2.drops > 0 && !S.s2.shaken) {
    toast("Joriy peptizator bilan davom eting yoki qayta boshlang.", "warn");
    return;
  }
  S.s2.pept = type;
  if (S.s2.shaken) {
    // Talaba ikkinchi peptizatorni ham sinab ko'rishi uchun holatni yangilash (progress saqlanadi)
    SFX.play("click");
    toast(`${type === "HCl" ? "0,1 n HCl (kislotali)" : "1 n NaOH (ishqoriy)"} sxemasi koʻrsatilmoqda.`, "", 2200);
  } else {
    SFX.play("click");
  }
  renderPanel();
}
function addPeptDrop() {
  if (S.stage !== 2) return;
  if (S.s2.drops >= 5) { toast("Peptizator yetarlicha qoʻshildi. Endi suv bilan suyultirib chayqating.", "warn"); return; }
  S.s2.drops++;
  spawnDrop(430, 225, 385, S.s2.pept === "HCl" ? "#d5eef7" : "#e2f5e6", 4.5);
  SFX.play("drip");
  toast(`+1 tomchi ${S.s2.pept === "HCl" ? "0,1 n HCl" : "1 n NaOH"} qoʻshildi (${S.s2.drops} tomchi).`, "", 1700);
  renderPanel();
}
function dilutePept() {
  if (S.stage !== 2) return;
  if (S.s2.drops < 3) { pen(0.5, "Avval choʻkmaga kamida 3 tomchi peptizator (HCl yoki NaOH) qoʻshing.", "warn"); return; }
  if (S.s2.diluted) { toast("Suv allaqachon qoʻshilgan — endi chayqating.", "", 1800); return; }
  S.s2.diluted = true;
  SFX.play("pour");
  toast("Koʻp miqdorda distillangan suv qoʻshildi. Endi kolbani chayqating!", "", 2400);
  renderPanel();
}
function shakePept() {
  if (S.stage !== 2) return;
  if (!S.s2.diluted) { pen(0.5, "Avval peptizator qoʻshib, soʻng distillangan suv bilan suyultiring.", "warn"); return; }
  S.s2.shaken = true;
  S.s2.shakeT = 1.15;
  S.s2.solProgress = 1;
  SFX.play("shake");
  setTimeout(() => SFX.play("ok"), 420);
  toast("✓ Choʻkma disperslanib, havorang-oqish opalesent H₂SnO₃ zoliga aylandi!", "ok", 3800);
  renderPanel();
}
function toggleLaser2() {
  S.s2.laser = !S.s2.laser;
  SFX.play("click");
  renderPanel();
}

/* ============ 3-BOSQICH AMALLARI ============ */
function setSub3(s) { S.s3.sub = s; SFX.play("click"); renderPanel(); }
function aAddWater() {
  if (S.s3.aWater) return;
  S.s3.aWater = true;
  SFX.play("pour");
  toast("Silindrga 50 ml distillangan suv quyildi.", "", 1800);
  renderPanel();
}
function aAddBenz() {
  if (!S.s3.aWater) { pen(0.5, "Avval silindrga 50 ml distillangan suv quying.", "warn"); return; }
  if (S.s3.aBenz) return;
  S.s3.aBenz = true;
  SFX.play("pour");
  toast("10 ml benzol qoʻshildi — zichligi kichikligi uchun suv ustida qavat hosil qildi.", "", 2500);
  renderPanel();
}
function aShake() {
  if (!S.s3.aBenz) { pen(0.5, "Avval 50 ml suv va 10 ml benzol quying.", "warn"); return; }
  S.s3.aShakeT = 1.1;
  SFX.play("shake");
  if (!S.s3.aSoap) {
    S.s3.aShaken1 = true;
    S.s3.aSepPhase = 0; // animatsiyada sekin 1 ga qaytib qavatlarga ajraladi!
    toast("⚠️ Qattiq chayqatildi — ammo emulgatorsiz benzol va suv tezda 2 qavatga ajralib ketmoqda!", "warn", 3800);
  } else {
    S.s3.aStable = true;
    S.s3.aSepPhase = 0;
    SFX.play("ok");
    toast("✓ 2% sovun bilan barqaror sutdek oppoq «benzol/suv» emulsiyasi hosil boʻldi!", "ok", 3800);
  }
  renderPanel();
}
function aAddSoap() {
  if (!S.s3.aShaken1) { pen(0.5, "Avval sovunsiz aralashmani chayqatib, qavatlarga ajralishini kuzating!", "warn"); return; }
  if (S.s3.aSoap) return;
  S.s3.aSoap = true;
  SFX.play("pour");
  toast("10 ml 2% li sovun (emulgator) qoʻshildi. Endi silindrni yana qattiq chayqating!", "", 2800);
  renderPanel();
}

// B qism: Bura + ZEC 21 + pista moyi
function bScoop(delta) {
  if (S.s3.bWeighed) { toast("Bura allaqachon tortib olingan.", "", 1800); return; }
  S.s3.bMass = clamp(+(S.s3.bMass + delta).toFixed(2), 0, 8);
  SFX.play("weigh");
  renderPanel();
}
function bConfirmWeigh() {
  if (S.s3.bMass < 4.0 || S.s3.bMass > 5.0) {
    pen(0.5, `Metodik koʻrsatma boʻyicha <b>4–5 g</b> kristallik bura tortish kerak (hozir ${f1(S.s3.bMass, 2)} g).`, "warn");
    return;
  }
  S.s3.bWeighed = true;
  SFX.play("ok");
  toast(`✓ ZEC 21 tarozida ${f1(S.s3.bMass, 2)} g kristallik bura tortib olindi!`, "ok", 2600);
  renderPanel();
}
function bDissolve() {
  if (!S.s3.bWeighed) { pen(0.5, "Avval ZEC 21 tarozida 4–5 g bura torting.", "warn"); return; }
  if (S.s3.bDissolved) return;
  S.s3.bDissolved = true;
  SFX.play("heat");
  setTimeout(() => SFX.play("ok"), 450);
  toast("✓ Bura 95 ml distillangan suvda isitib toʻliq eritildi va silindrga quyildi!", "ok", 3000);
  S.s3.bTransferred = true;
  renderPanel();
}
function bAddOil() {
  if (!S.s3.bTransferred) { pen(0.5, "Avval burani 95 ml suvda isitib eriting va silindrga quying.", "warn"); return; }
  if (S.s3.bOil) return;
  S.s3.bOil = true;
  SFX.play("drip");
  toast("2,5 ml pista moyi qoʻshildi. Endi silindrni qattiq chayqating!", "", 2500);
  renderPanel();
}
function bShake() {
  if (!S.s3.bOil) { pen(0.5, "Avval bura eritmasi ustiga 2–3 ml pista moyi qoʻshing.", "warn"); return; }
  S.s3.bStable = true;
  S.s3.bShakeT = 1.15;
  SFX.play("shake");
  setTimeout(() => SFX.play("ok"), 400);
  toast("✓ Pista moyining bura bilan barqaror emulsiyasi hosil boʻldi!", "ok", 3600);
  renderPanel();
}

/* ============ SAVOLLAR VA PANEL ============ */
function qBlock(Q, seed) {
  const q = S.q[Q.id] || {};
  return `<div class="q"><p>${Q.q}</p>${shuf(Q.o.length, seed).map(oi => {
    let c = "";
    if (q.ans !== undefined && oi === Q.a) c = "right";
    else if (q.wrong && q.wrong.includes(oi)) c = "wrong";
    return `<button class="${c}" onclick="ansQ('${Q.id}',${oi})" ${q.ans !== undefined || (q.wrong && q.wrong.includes(oi)) ? "disabled" : ""}>${Q.o[oi]}</button>`;
  }).join("")}</div>`;
}
function ansQ(id, i) {
  let Q;
  for (const k in QS) { Q = QS[k].find(x => x.id === id); if (Q) break; }
  const q = S.q[id] || (S.q[id] = { tries: 0, wrong: [], pts: 0 });
  if (q.ans !== undefined) return;
  q.tries++;
  if (i === Q.a) {
    q.ans = i; q.pts = q.tries === 1 ? 2 : 1;
    SFX.play("ok"); toast("✓ Toʻgʻri javob!", "ok", 1600);
  } else {
    q.wrong.push(i);
    if (q.tries >= 2) { q.ans = Q.a; SFX.play("warn"); toast("Toʻgʻri javob koʻrsatildi.", "warn", 2400); }
    else { SFX.play("err"); toast("✗ Notoʻgʻri. Yana bir urinish.", "err", 1800); }
  }
  renderPanel();
}
function tasksHTML(st) {
  const cur = idx(st);
  return `<ul class="tasks">${TASKS[st].map((t, k) => `<li class="${k < cur ? "done" : k === cur ? "cur" : ""}"><span class="b">${k < cur ? "✓" : k + 1}</span><span>${t[0]}</span></li>`).join("")}</ul>`;
}

function clDecayChart() {
  const pts = [{ x: 0, y: 0.42 }];
  if (S.s1.washes >= 1) pts.push({ x: 1, y: 0.14 });
  if (S.s1.washes >= 2) pts.push({ x: 2, y: 0.03 });
  if (S.s1.washes >= 3) pts.push({ x: 3, y: 0.002 });
  return LabUI.svgChart({
    title: "Dekantatsiya davomida Cl⁻ kamayishi",
    xl: "Yuvish soni", yl: "[Cl⁻], mol/l",
    x0: 0, xm: 3, y0: 0, ym: 0.5, sx: 1, sy: 0.1,
    series: [{ pts, color: "#1b484f", dot: "#e89b3c" }]
  });
}

/* ============ BAHOLASH VA HISOBOT ============ */
function total() {
  let proc = 0;
  for (let k = 1; k <= 3; k++) {
    const tDone = idx(k) / TASKS[k].length;
    proc += Math.max(0, 15 * tDone - (S.pen[k] || 0));
  }
  const allQ = [1, 2, 3].flatMap(k => QS[k].map(q => q.id));
  const qp = allQ.reduce((s, id) => s + ((S.q[id] && S.q[id].pts) || 0), 0);
  const qsScore = 30 * qp / (allQ.length * 2);
  const qzScore = QZ.filter((q, i) => S.quiz[i] === q[2]).length * 5;
  const hp = Math.min(5, S.hints * 0.5);
  return {
    proc: Math.round(proc),
    qs: Math.round(qsScore),
    qz: qzScore,
    hp,
    tot: clamp(Math.round(proc + qsScore + qzScore - hp), 0, 100)
  };
}

function quizA(qi, oi) {
  if (S.quiz[qi] !== undefined) return;
  S.quiz[qi] = oi;
  SFX.play(oi === QZ[qi][2] ? "ok" : "err");
  renderPanel();
}

/* ============ NAVIGATSIYA ============ */
function goStage(n) {
  if (n > S.unlocked) return;
  S.stage = n;
  SFX.play("paper");
  renderPanel();
  el("panel").scrollTop = 0;
}
function nextStage() {
  const n = S.stage + 1;
  if (n > S.unlocked) S.unlocked = n;
  goStage(n);
}
function renderTabs() {
  el("tabs").innerHTML = STG.slice(1).map((x, i) => {
    const n = i + 1;
    const d = n <= 3 ? stageDone(n) : Object.keys(S.quiz).length === QZ.length;
    return `<button class="${n === S.stage ? "cur" : ""} ${d ? "done" : ""}" ${n > S.unlocked ? "disabled" : ""} onclick="goStage(${n})" title="${x.t}">${d ? "✓ " : ""}${n} · ${x.s}</button>`;
  }).join("");
  const sc = total().tot;
  el("chip").textContent = sc + " ball";
  LabProgress.save(LAB_ID, sc, stageDone(1) && stageDone(2) && stageDone(3));
}

    <p>Bir-birida erimaydigan ikki suyuqlikdan (benzol + suv, pista moyi + suv) barqaror emulsiya hosil qilish uchun emulgator (sovun yoki bura) qoʻshiladi. Emulgator molekulalari faza chegarasida adsorbsion qavat hosil qilib, tomchilarning qoʻshilib ketishiga (koalessensiyaga) yoʻl qoʻymaydi:</p>
    <div class="eq">n(R–COONa) ⇌ nRCOO⁻ + nNa⁺</div>
    <div class="eq">[C₆H₆]ₘ + nRCOO⁻ + nNa⁺ → {[C₆H₆]ₘ · nRCOO⁻}ⁿ⁻ · nNa⁺</div>
    ${LabUI.refsHTML()}
    <div class="row" style="margin-top:14px"><button class="pri" onclick="closeModal()">Yopish</button></div>`);
}

function showJournal() {
  modal(`<h1>📋 Laboratoriya jurnali</h1>
    <table class="j">
      <tr><th>Bosqich</th><th>Holat</th><th>Jarima</th></tr>
      <tr><td>1 · H₂SnO₃ & dekantatsiya</td><td>Choʻkma: ${S.s1.precipDone ? "✓" : "—"}, Yuvish: ${S.s1.washes}/3, AgNO₃: ${S.s1.tested.filter(Boolean).length}/3</td><td>${S.pen[1]}</td></tr>
      <tr><td>2 · Peptizatsiya</td><td>Peptizator: ${S.s2.pept} (${S.s2.drops} t), Zol: ${S.s2.shaken ? "✓" : "—"}</td><td>${S.pen[2]}</td></tr>
      <tr><td>3 · Emulsiyalar</td><td>A (benzol): ${S.s3.aStable ? "✓" : "—"}, B (bura ${f1(S.s3.bMass, 2)} g + moy): ${S.s3.bStable ? "✓" : "—"}</td><td>${S.pen[3]}</td></tr>
    </table>
    ${S.events.length ? `<h3>Ogohlantirishlar</h3><ul>${S.events.map(e => `<li>${e.st}-bosqich: ${e.msg}</li>`).join("")}</ul>` : "<p class='note' style='margin-top:10px'>Xatolik qayd etilmagan.</p>"}
    <div class="row" style="margin-top:14px"><button class="pri" onclick="closeModal()">Yopish</button></div>`);
}

function smartHint() {
  S.hints++;
  SFX.play("beep");
  let msg = "";
  if (S.stage === 1) {
    if (!S.s1.precipDone) msg = "1 n SnCl₄ shishasini 3 marta bosib qaynoq suvga tomizing.";
    else if (S.s1.washes === 0 || (S.s1.tested[S.s1.washes - 1] && S.s1.washes < 3)) msg = "«Qaynoq suv bilan dekantatsiya» tugmasini bosing.";
    else if (!S.s1.tested.every(Boolean)) msg = "Yuvish suvini tekshirish uchun shtativdagi navbatdagi probirkani bosing (+0,1 n AgNO₃).";
    else msg = "2 ta nazorat savoliga javob bering va 2-bosqichga oʻting.";
  } else if (S.stage === 2) {
    if (S.s2.drops < 3) msg = "0,1 n HCl yoki 1 n NaOH dan kamida 3 tomchi qoʻshing.";
    else if (!S.s2.diluted) msg = "«Suv bilan suyultirish» tugmasini bosing.";
    else if (!S.s2.shaken) msg = "«Chayqatish» tugmasini bosing — choʻkma opalesent zolga aylanadi.";
    else msg = "Savollarga javob bering va 3-bosqichga oʻting.";
  } else if (S.stage === 3) {
    if (!S.s3.aStable) msg = "A qismda: 50 ml suv + 10 ml benzol → chayqatish → 10 ml 2% sovun → yana qattiq chayqatish.";
    else if (!S.s3.bStable) msg = "B qismga oʻting: ZEC 21 tarozida 4,0–5,0 g bura torting, 95 ml suvda isitib eriting, 2,5 ml pista moyi qoʻshib chayqating.";
    else msg = "Savollarga javob bering va hisobotga oʻting.";
  } else {
    msg = "5 ta yakuniy nazorat savolini bajaring va hisobotni chop eting.";
  }
  toast("💡 " + msg, "warn", 4200);
  renderTabs();
}

/* ============ ANIMATSIYA (rAF) ============ */
let lastTs = 0;
function tick(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  S.anim.t += dt;

  if (S.stage === 1) {
    if (S.s1.tiltT > 0) {
      S.s1.tiltT = Math.max(0, S.s1.tiltT - dt);
      const ang = Math.sin(S.s1.tiltT * Math.PI) * 18;
      const bk = el("beaker1");
      if (bk) bk.setAttribute("transform", `translate(290,382) rotate(${ang.toFixed(1)},0,-60)`);
    }
    const bg = el("boilBub1");
    if (bg && !S.s1.precipDone) {
      if (Math.random() < 0.35) S.anim.bubbles.push({ x: (Math.random() - 0.5) * 100, y: -4, r: 2 + Math.random() * 2.6, vy: 34 + Math.random() * 32 });
      S.anim.bubbles = S.anim.bubbles.filter(b => { b.y -= b.vy * dt; return b.y > -88; });
      bg.innerHTML = S.anim.bubbles.map(b => `<circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${b.r.toFixed(1)}" fill="rgba(255,255,255,0.55)"/>`).join("");
    }
  }

  if (S.stage === 2 && S.s2.shakeT > 0) {
    S.s2.shakeT = Math.max(0, S.s2.shakeT - dt);
    const ang = Math.sin(S.s2.shakeT * 34) * 9 * (S.s2.shakeT / 1.15);
    const pf = el("peptFlask");
    if (pf) pf.setAttribute("transform", `translate(430,478) rotate(${ang.toFixed(1)},0,-80)`);
  }

  if (S.stage === 3) {
    if (S.s3.aShakeT > 0) {
      S.s3.aShakeT = Math.max(0, S.s3.aShakeT - dt);
      const ang = Math.sin(S.s3.aShakeT * 34) * 10 * (S.s3.aShakeT / 1.1);
      const cA = el("cylA");
      if (cA) cA.setAttribute("transform", `translate(310,478) rotate(${ang.toFixed(1)},0,-140)`);
    }
    // Sovunsiz benzol+suv asta-sekin 2 qavatga ajraladi
    if (S.s3.aShaken1 && !S.s3.aStable && S.s3.aSepPhase < 1) {
      S.s3.aSepPhase = Math.min(1, S.s3.aSepPhase + dt * 0.28);
      if (S.s3.sub === "A" && Math.floor(S.anim.t * 12) !== Math.floor((S.anim.t - dt) * 12)) renderScene();
    }
    if (S.s3.bShakeT > 0) {
      S.s3.bShakeT = Math.max(0, S.s3.bShakeT - dt);
      const ang = Math.sin(S.s3.bShakeT * 34) * 10 * (S.s3.bShakeT / 1.15);
      const cB = el("cylB");
      if (cB) cB.setAttribute("transform", `translate(690,478) rotate(${ang.toFixed(1)},0,-140)`);
    }
  }

  const fx = el("fxLayer");
  if (fx && S.anim.drops.length) {
    S.anim.drops = S.anim.drops.filter(d => {
      d.vy += 420 * dt;
      d.y += d.vy * dt;
      return d.y < d.targetY;
    });
    fx.innerHTML = S.anim.drops.map(d => `<ellipse cx="${d.x}" cy="${d.y.toFixed(1)}" rx="${d.r * 0.78}" ry="${d.r * 1.22}" fill="${d.color}" stroke="#4a6369" stroke-width="0.8"/>`).join("");
  } else if (fx && fx.innerHTML) {
    fx.innerHTML = "";
  }

  requestAnimationFrame(tick);
}

/* ============ ISHGA TUSHIRISH ============ */
LabUI.initShell(LAB_ID);
el("btnTable").addEventListener("click", showJournal);
el("btnHint").addEventListener("click", smartHint);
el("btnTheory").addEventListener("click", showTheory);
renderPanel();
showIntro();
requestAnimationFrame(tick);
</script>
